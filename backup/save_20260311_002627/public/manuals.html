<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>マニュアル一覧</title>
    <link rel="stylesheet" href="/styles.css?v=20260309manual01" />
  </head>
  <body>
    <nav class="top-nav">
      <a href="/" class="nav-link">チャット</a>
      <a href="/manuals.html" class="nav-link active">マニュアル一覧</a>
      <a href="/help.html" class="nav-link">使い方</a>
      <a href="/profit-manual.html" class="nav-link">利益マニュアル</a>
    </nav>
    <button class="nav-toggle" type="button" aria-label="メニュー" aria-expanded="false">MENU</button>
    <button id="closeToChatBtn" class="close-to-chat" type="button" aria-label="チャットへ戻る" data-close-href="/">×</button>

    <main class="settings-layout">
      <section class="card">
        <div class="title-row">
          <img id="pageIcon" class="page-icon" src="/assets/icons/help.svg" alt="" />
          <h1>マニュアル一覧</h1>
        </div>
        <p class="sub">各アプリの操作手順をここから開けます。</p>

        <div class="settings-form">
          <div class="row">
            <button type="button" id="openProfitManualBtn">利益計算アプリ マニュアル</button>
          </div>
          <div class="row">
            <button type="button" class="secondary" id="openCommonHelpBtn">全体の使い方（チャット中心）</button>
          </div>
        </div>
      </section>
    </main>

    <script src="/nav.js?v=20260309manual01"></script>
    <script>
      const openProfitManualBtn = document.getElementById('openProfitManualBtn');
      const openCommonHelpBtn = document.getElementById('openCommonHelpBtn');
      if (openProfitManualBtn) openProfitManualBtn.addEventListener('click', () => (window.location.href = '/profit-manual.html'));
      if (openCommonHelpBtn) openCommonHelpBtn.addEventListener('click', () => (window.location.href = '/help.html'));
    </script>
  </body>
</html>
