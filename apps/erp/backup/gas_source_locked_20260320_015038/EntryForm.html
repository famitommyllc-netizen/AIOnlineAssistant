<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    <?!= HtmlService.createHtmlOutputFromFile('style.css').getContent(); ?>
  </style>
</head>
<body>
  <div class="section">
    <h2 class="section-title">仕入登録</h2>
    <div class="field-row">
      <label class="field-label">JAN/商品番号/商品名
        <input type="text" id="keyword" autocomplete="off" class="input-main"/>
      </label>
      <button onclick="searchProduct()" class="btn-main">検索</button>
      <button onclick="showProductRegisterForm()" class="btn-main">新規商品登録</button>
    </div>
  </div>

  <div id="search-result" class="section"></div>
  <div id="entry-form" class="section"></div>
  <div id="entry-list" class="section"></div>

  <div class="section" id="tax-area" style="margin:1em 0;">
    <h3 class="mid-title">税率設定・外税加算</h3>
    <div class="field-row">
      <label>税率
        <select id="tax-rate" class="input-select">
          <option value="10">10%</option>
          <option value="8">8%</option>
        </select>
      </label>
      <button type="button" onclick="applyTaxToAll()" class="btn-main">外税加算</button>
    </div>
    <span id="tax-note" class="note-text">
      ボタン押下でリスト全ての提示金額に税率分が加算されます
    </span>
  </div>

  <div id="point-area" class="section"></div>
  <div id="summary-area" class="section"></div>

  <div class="section">
    <button id="common-info-btn" onclick="inputCommonInfo()" class="btn-main">共通項目入力へ</button>
  </div>

  <div id="common-info" class="section"></div>
  <div id="final-result" class="section" style="margin-top:1em;"></div>
</body>

  
  <!-- 商品登録用エリア（モーダル風） -->
  <div id="product-register-modal" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:1000;align-items:center;justify-content:center;background:rgba(0,0,0,0.4);">
    <div style="background:#fff;padding:2em;max-width:500px;margin:auto;border-radius:20px;position:relative;">
      <span style="position:absolute;top:10px;right:15px;cursor:pointer;font-size:2em;" onclick="closeProductRegisterForm()">×</span>
      <h3 style="margin-top:0;">商品新規登録</h3>
      <div class="register-row">
        <label>JAN</label><input type="text" id="pr-jan">
      </div>
      <div class="register-row">
        <label>商品名</label><input type="text" id="pr-name">
      </div>
      <div class="register-row">
        <label>カテゴリ</label><input type="text" id="pr-category">
      </div>
      <div class="register-row">
        <label>メーカー</label><input type="text" id="pr-maker">
      </div>
      <div class="register-row">
        <label>ブランド</label><input type="text" id="pr-brand">
      </div>
      <div class="register-row">
        <label>サブ</label><input type="text" id="pr-sub">
      </div>
      <div class="register-row">
        <label>希望小売価格</label><input type="text" id="pr-retailPrice" inputmode="numeric">
      </div>
      <div class="register-row">
        <label>備考</label><input type="text" id="pr-note">
      </div>
      <div class="register-row">
        <label>検索名</label><input type="text" id="pr-searchName">
      </div>
      <div class="register-row">
        <label>読み仮名</label><input type="text" id="pr-yomigana">
      </div>
      <div class="register-row">
        <label>想定売価</label><input type="text" id="pr-assumedPrice" inputmode="numeric">
      </div>
      <div class="register-row">
        <button onclick="registerProductInline()" style="width:60%;">商品登録</button>
        <span id="pr-status" style="margin-left:1em;"></span>
      </div>
    </div>
  </div>
<script>
let entryList = [];
let _searchResults = [];
let pointTotal = 0;
let taxRate = 0.10; // 税率（10%：設定シート連携ならこの値を動的にする）

// 初期表示
window.onload = function() {
  renderEntryList();
  renderPointArea();
  renderSummary();
};

// 商品検索
function searchProduct() {
  const keyword = document.getElementById('keyword').value.trim();
  if (!keyword) {
    document.getElementById('search-result').innerHTML = '<span style="color:#d00;">キーワードを入力してください</span>';
    document.getElementById('entry-form').innerHTML = '';
    return;
  }
  document.getElementById('search-result').innerHTML = '検索中...';
  document.getElementById('entry-form').innerHTML = '';
  google.script.run.withSuccessHandler(showResult).searchProduct(keyword);
}

// 検索結果表示
function showResult(results) {
  _searchResults = results;
  document.getElementById('entry-form').innerHTML = '';
  let html = '<select id="product-select"><option value="">選択してください</option>';
  results.forEach((row, i) => {
    html += `<option value="${i}">${row[0]}：${row[1]}</option>`;
  });
  html += `<option value="new">新規商品登録</option>`;
  html += '</select>';
  document.getElementById('search-result').innerHTML = html;

  document.getElementById('product-select').onchange = function() {
    const idx = this.value;
    if (idx === "") {
      document.getElementById('entry-form').innerHTML = "";
      return;
    }
    if (idx === "new") {
      showProductRegisterForm();
      this.value = "";
      return;
    }
    const data = _searchResults[idx];
    let entryForm = `
      <div>
        <label>提示金額
          <input type="text" id="entry-price" inputmode="numeric" pattern="\\d*">
        </label>
        <label>個数
          <input type="text" id="entry-count" inputmode="numeric" pattern="\\d*">
        </label>
        <button id="add-btn" onclick="saveEntryFromSearch(${idx})">リストに追加</button>
        <span id="add-status"></span>
      </div>
    `;
    document.getElementById('entry-form').innerHTML = entryForm;
  };
}

function saveEntryFromSearch(idx) {
  const data = _searchResults[idx];
  const price = Number(document.getElementById('entry-price').value);
  const count = Number(document.getElementById('entry-count').value);
  const btn = document.getElementById('add-btn');
  const status = document.getElementById('add-status');
  if (!price || !count) {
    alert("提示金額・個数は必須です");
    return;
  }
  btn.disabled = true;
  status.textContent = "追加中...";
  setTimeout(() => {
    // [商品番号, 商品名, 提示金額, ポイント/割引, 原価, 個数]
    entryList.push([data[0], data[1], price, 0, 0, count]);
    renderEntryList();
    renderPointArea();
    renderSummary();
    document.getElementById('search-result').innerHTML = '';
    document.getElementById('entry-form').innerHTML = '';
    document.getElementById('keyword').value = '';
    btn.disabled = false;
    status.textContent = '';
  }, 300);
}

// ▼仕入リスト表示（編集/削除/同商品追加）
function renderEntryList() {
  let html = '<h3>仕入リスト</h3>';
  if (!entryList.length) {
    html += '<div style="color:#888;">リストに追加された商品はありません</div>';
  } else {
    html += '<table><tr><th>商品番号</th><th>商品名</th><th>提示金額</th><th>ポイント/割引</th><th>原価</th><th>個数</th><th>操作</th></tr>';
    entryList.forEach((item, idx) => {
      html += `<tr>
        <td>${item[0]}</td>
        <td>${item[1]}</td>
        <td>${item[2]}</td>
        <td>${item[3]}</td>
        <td>${item[4]}</td>
        <td>${item[5]}</td>
        <td>
          <button onclick="editEntry(${idx})">編集</button>
          <button onclick="removeEntry(${idx})">削除</button>
          <button onclick="addSameEntry(${idx})">同商品追加</button>
        </td>
      </tr>`;
    });
    html += '</table>';
  }
  document.getElementById('entry-list').innerHTML = html;
}


// 編集・削除・同商品追加
function editEntry(idx) {
  const item = entryList[idx];
  let html = `
    <tr>
      <td><input value="${item[0]}" disabled></td>
      <td><input value="${item[1]}" disabled></td>
      <td><input type="text" id="edit-price" value="${item[2]}" inputmode="numeric"></td>
      <td><input type="text" id="edit-point" value="${item[3]}" inputmode="numeric"></td>
      <td><input type="text" id="edit-genka" value="${item[4]}" inputmode="numeric" disabled></td>
      <td><input type="text" id="edit-count" value="${item[5]}" inputmode="numeric"></td>
      <td>
        <button onclick="saveEdit(${idx})">保存</button>
        <button onclick="renderEntryList()">キャンセル</button>
      </td>
    </tr>
  `;
  document.querySelectorAll('#entry-list table tr')[idx + 1].outerHTML = html;
}
function saveEdit(idx) {
  entryList[idx][2] = Number(document.getElementById('edit-price').value);
  // entryList[idx][3] = Number(document.getElementById('edit-point').value); ←自動再計算されるので編集不可
  // entryList[idx][4] = Number(document.getElementById('edit-genka').value); ←自動再計算されるので編集不可
  entryList[idx][5] = Number(document.getElementById('edit-count').value);
  distributePointAndGenka();
  renderEntryList();
  renderSummary();
}
function removeEntry(idx) {
  entryList.splice(idx, 1);
  distributePointAndGenka();
  renderEntryList();
  renderSummary();
}
function addSameEntry(idx) {
  const item = [...entryList[idx]];
  // 金額・個数は空欄で追加
  item[2] = "";
  item[3] = "";
  item[4] = "";
  item[5] = "";
  entryList.push(item);
  renderEntryList();
  renderSummary();
}

// ▼ポイント/割引入力欄
function renderPointArea() {
  document.getElementById('point-area').innerHTML = `
    <label>ポイント/割引（合計）
      <input type="text" id="point-total" inputmode="numeric" pattern="\\d*" value="${pointTotal || ''}" oninput="updatePointTotal()">
    </label>
  `;
}
function updatePointTotal() {
  pointTotal = Number(document.getElementById('point-total').value) || 0;
  distributePointAndGenka();
  renderEntryList();
  renderSummary();
}

// ▼ポイント・原価自動按分
function distributePointAndGenka() {
  let sumPrice = entryList.reduce((sum, item) => sum + Number(item[2] || 0), 0);
  let remainPoint = pointTotal;
  entryList.forEach((item, idx) => {
    if (!sumPrice || !pointTotal) {
      item[3] = 0;
      item[4] = Number(item[2]);
    } else if (idx === entryList.length - 1) {
      item[3] = remainPoint;
      item[4] = Number(item[2]) - item[3];
    } else {
      item[3] = Math.round(pointTotal * (item[2] / sumPrice));
      remainPoint -= item[3];
      item[4] = Number(item[2]) - item[3];
    }
  });
}

// ▼外税ボタン押下で全商品の提示金額に税率を加算
function applyTaxToAll() {
  if (!entryList.length) return;
  if (!confirm("リスト全商品の提示金額に外税（" + (taxRate*100) + "%）を加算します。よろしいですか？")) return;
  entryList.forEach(item => {
  // item[2]：提示金額
  let price = Number(item[2]) || 0;
  // 税込み金額（小数点以下切り捨て）
  let taxed = Math.floor(price * (1 + taxRate));
  item[2] = taxed;
});
  distributePointAndGenka();
  renderEntryList();
  renderSummary();
}


// ▼リストサマリー
function renderSummary() {
  let totalCount = 0, totalPrice = 0, totalGenka = 0;
  entryList.forEach(item => {
    totalCount += Number(item[5] || 1);
    totalPrice += Number(item[2] || 0);
    totalGenka += Number(item[4] || 0);
  });
  let genkaAfterPoint = totalGenka;
  document.getElementById('summary-area').innerHTML =
    `商品数: ${totalCount}　総提示金額: ${totalPrice}　原価合計（ポイント差引後）: ${genkaAfterPoint >= 0 ? genkaAfterPoint : 0}`;
}

// ▼共通項目入力
function inputCommonInfo() {
  distributePointAndGenka();
  renderEntryList();
  renderSummary();
  let html = `
    <h3>共通項目入力</h3>
    <label>仕入日
      <input type="text" id="common-date" maxlength="10" inputmode="numeric" placeholder="例: 20250701" oninput="formatDateInput(this)">
    </label>
    <label>仕入先<input type="text" id="common-supplier"></label>
    <label>支払い方法<input type="text" id="common-payment"></label>
    <button id="submit-btn" onclick="submitEntries()">一括登録</button>
    <span id="submit-status"></span>
  `;
  document.getElementById('common-info').innerHTML = html;
}
function formatDateInput(el) {
  let v = el.value.replace(/[^0-9]/g, '');
  if (v.length === 8) {
    el.value = v.replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3');
  }
}

// ▼仕入情報を登録
function submitEntries() {
  const btn = document.getElementById('submit-btn');
  const status = document.getElementById('submit-status');
  const date = document.getElementById('common-date').value;
  const supplier = document.getElementById('common-supplier').value;
  const payment = document.getElementById('common-payment').value;
  if (!date || !supplier || !payment) {
    alert("全ての共通項目を入力してください");
    return;
  }
  btn.disabled = true;
  status.textContent = '登録中...';
  google.script.run.withSuccessHandler(function(msg){
    document.getElementById('final-result').innerHTML = `<span style="color:green;">${msg}</span>`;
    entryList = [];
    renderEntryList();
    renderSummary();
    document.getElementById('common-info').innerHTML = '';
    btn.disabled = false;
    status.textContent = '';
    document.getElementById('point-total').value = '';
    pointTotal = 0;
    renderPointArea();
  }).registerEntries(entryList, {date, supplier, payment});
}

// ▼商品新規登録フォーム（モーダル）
function showProductRegisterForm() {
  document.getElementById('product-register-modal').style.display = "flex";
}
function closeProductRegisterForm() {
  document.getElementById('product-register-modal').style.display = "none";
  document.getElementById('pr-status').textContent = '';
}

// モーダル内商品登録処理
function registerProductInline() {
  const info = {
    jan: document.getElementById('pr-jan').value.trim(),
    name: document.getElementById('pr-name').value.trim(),
    category: document.getElementById('pr-category').value.trim(),
    maker: document.getElementById('pr-maker').value.trim(),
    brand: document.getElementById('pr-brand').value.trim(),
    sub: document.getElementById('pr-sub').value.trim(),
    retailPrice: document.getElementById('pr-retailPrice').value.trim(),
    note: document.getElementById('pr-note').value.trim(),
    searchName: document.getElementById('pr-searchName').value.trim(),
    yomigana: document.getElementById('pr-yomigana').value.trim(),
    assumedPrice: document.getElementById('pr-assumedPrice').value.trim()
  };
  if (!info.name) {
    alert("商品名は必須です");
    return;
  }
  document.getElementById('pr-status').textContent = "登録中...";
  google.script.run.withSuccessHandler(function(res){
    document.getElementById('pr-status').textContent = res.msg;
    setTimeout(closeProductRegisterForm, 1000); // 登録後1秒で自動閉じる
  }).registerNewProduct(info);
}
</script>
</body>
</html>
