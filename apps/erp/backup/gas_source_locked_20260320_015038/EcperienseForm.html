<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    <?!= HtmlService.createHtmlOutputFromFile('style.css').getContent(); ?>
  </style>
</head>
<body>
  <h2>経費登録</h2>
  <!-- 経費入力フォーム -->
<form id="expenseForm">
  <div class="form-row">
  <label class="form-label">日付</label>
  <input class="form-input" type="text" id="exp-date" maxlength="10" placeholder="20250713" inputmode="numeric" oninput="formatDateInput(this)">
</div>
<div class="form-row">
  <label class="form-label">内容</label>
  <input class="form-input" list="expense-items" id="exp-name" autocomplete="off">
  <datalist id="expense-items"></datalist>
</div>
<div class="form-row">
  <label class="form-label">金額</label>
  <input class="form-input" type="text" id="exp-amount" inputmode="numeric" pattern="\d*">
</div>
<div class="form-row">
  <label class="form-label">メモ</label>
  <input class="form-input" type="text" id="exp-memo">
</div>
<button type="button" onclick="registerExpenseUI()">登録</button>
<span id="exp-status"></span>
</form>

 <script>
    // 日付：半角数字8桁→自動整形（例: 20250701 → 2025-07-01）
// <script>内に記載してください
function formatDateInput(el) {
  // 数字以外を除外
  let v = el.value.replace(/[^0-9]/g, '');
  if (v.length > 8) v = v.slice(0, 8);
  // 8桁で「YYYY-MM-DD」に変換
  if (v.length === 8) {
    el.value = v.replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3');
  } else {
    el.value = v;
  }
}

// ページ読み込み時またはフォーム表示時に呼び出し
function loadExpenseItems() {
  google.script.run.withSuccessHandler(function(list){
    const dl = document.getElementById('expense-items');
    dl.innerHTML = '';
    list.forEach(function(item){
      const opt = document.createElement('option');
      opt.value = item;
      dl.appendChild(opt);
    });
  }).getExpenseItems();
}
window.onload = loadExpenseItems; // 必要に応じて呼び出し

// 経費登録処理
function registerExpenseUI() {
  const info = {
    date: document.getElementById('exp-date').value,
    name: document.getElementById('exp-name').value,
    amount: document.getElementById('exp-amount').value,
    memo: document.getElementById('exp-memo').value
  };
  // バリデーションは適宜
  google.script.run.withSuccessHandler(function(msg){
    document.getElementById('exp-status').textContent = msg;
    // 登録後クリアなど
  }).registerExpense(info);
}
</script>
</body>
</html>
