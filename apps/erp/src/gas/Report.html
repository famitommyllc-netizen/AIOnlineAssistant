<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    <?!= HtmlService.createHtmlOutputFromFile('style.css').getContent(); ?>
  </style>
</head>
<body class="entry-app-layout entry-b-layout">
  <div id="entry-app-shell" class="entry-app-shell">
    <header id="entry-fixed-header" class="entry-fixed-header">
      <div class="entry-fixed-header-inner">
        <div class="entry-fixed-header-title-wrap">
          <h1 class="entry-fixed-header-title">日次/月次レポート</h1>
          <div id="entry-fixed-header-file" class="entry-fixed-header-file">Report.html</div>
        </div>
        <div id="entry-fixed-header-state" class="entry-fixed-header-state">入力</div>
      </div>
    </header>
    <main id="entry-scroll-body" class="entry-scroll-body">
  <div class="section">
    <h2 class="section-title">日次/月次レポート</h2>
    <div class="input-row">
      <div class="row-label">集計単位</div>
      <select id="period-type" class="input-main" onchange="onPeriodTypeChange()">
        <option value="day">日次</option>
        <option value="month">月次</option>
      </select>
    </div>
    <div class="input-row">
      <div class="row-label">対象期間</div>
      <input id="period-value" class="input-main" type="text" inputmode="numeric" placeholder="YYYY-MM-DD" oninput="formatPeriodInput(this)">
    </div>
    <div class="button-row">
      <button type="button" class="btn-main" onclick="loadReport()">集計する</button>
      <button type="button" class="btn-sub" onclick="printReport()">印刷</button>
      <button type="button" class="btn-sub" onclick="saveReportPdf()">PDF保存</button>
      <span id="action-status"></span>
    </div>
    <div class="note-text">PDFは指定フォルダに保存されます。</div>
  </div>

  <div id="report-summary" class="section"></div>
  <div id="report-purchases" class="section"></div>
  <div id="report-sales" class="section"></div>
  <div id="report-expenses" class="section"></div>
    </main>
    <footer id="entry-fixed-footer" class="entry-fixed-footer">
      <nav class="entry-bottom-nav" aria-label="Report 操作">
        <button type="button" id="footer-home-btn" class="entry-bottom-nav-btn" onclick="handleFooterHomeClick()">
          <span class="entry-bottom-nav-icon">H</span>
          <span class="entry-bottom-nav-label">ホーム</span>
        </button>
        <button type="button" id="footer-display-btn" class="entry-bottom-nav-btn" onclick="handleFooterDisplaySettingsClick()">
          <span class="entry-bottom-nav-icon">UI</span>
          <span class="entry-bottom-nav-label">表示</span>
        </button>
        <button type="button" id="footer-detail-btn" class="entry-bottom-nav-btn is-placeholder" onclick="handleFooterPlaceholderClick()">
          <span class="entry-bottom-nav-icon">-</span>
          <span class="entry-bottom-nav-label"></span>
        </button>
        <button type="button" id="footer-tax-btn" class="entry-bottom-nav-btn is-placeholder" onclick="handleFooterPlaceholderClick()">
          <span class="entry-bottom-nav-icon">-</span>
          <span class="entry-bottom-nav-label"></span>
        </button>
        <button type="button" id="footer-individual-btn" class="entry-bottom-nav-btn" onclick="handleFooterPlaceholderClick()">
          <span class="entry-bottom-nav-icon">IND</span>
          <span class="entry-bottom-nav-label">個別</span>
        </button>
      </nav>
    </footer>
  </div>

<script>
let currentReport = null;
const REPORT_DISPLAY_SETTINGS_STORAGE_KEY_ = 'entryDisplaySettings.v1';
const REPORT_DISPLAY_SETTINGS_DEFAULTS_ = {
  h1FontPx: 22, h2FontPx: 28, thFontPx: 36, valueFontPx: 48, dropdownFontPx: 28, helperFontPx: 30,
  headerFontPx: 24, footerFontPx: 36, noteFontPx: 22, buttonFontPx: 48, borderWidth: 2, fontWeight: 500
};

window.onload = function() {
  initializeReportPageShell_();
  setDefaultPeriodValue();
  loadReport();
};

function clampDisplaySetting_(value, min, max, fallback) {
  const n = Number(value);
  if (!Number.isFinite(n)) return fallback;
  return Math.max(min, Math.min(max, Math.round(n)));
}

function normalizeDisplaySettings_(input) {
  const src = input || {};
  return {
    h1FontPx: clampDisplaySetting_(src.h1FontPx, 12, 96, REPORT_DISPLAY_SETTINGS_DEFAULTS_.h1FontPx),
    h2FontPx: clampDisplaySetting_(src.h2FontPx, 12, 96, REPORT_DISPLAY_SETTINGS_DEFAULTS_.h2FontPx),
    thFontPx: clampDisplaySetting_(src.thFontPx, 10, 96, REPORT_DISPLAY_SETTINGS_DEFAULTS_.thFontPx),
    valueFontPx: clampDisplaySetting_(src.valueFontPx, 10, 96, REPORT_DISPLAY_SETTINGS_DEFAULTS_.valueFontPx),
    dropdownFontPx: clampDisplaySetting_(src.dropdownFontPx, 10, 96, REPORT_DISPLAY_SETTINGS_DEFAULTS_.dropdownFontPx),
    helperFontPx: clampDisplaySetting_(src.helperFontPx, 10, 96, REPORT_DISPLAY_SETTINGS_DEFAULTS_.helperFontPx),
    headerFontPx: clampDisplaySetting_(src.headerFontPx, 10, 96, REPORT_DISPLAY_SETTINGS_DEFAULTS_.headerFontPx),
    footerFontPx: clampDisplaySetting_(src.footerFontPx, 10, 96, REPORT_DISPLAY_SETTINGS_DEFAULTS_.footerFontPx),
    noteFontPx: clampDisplaySetting_(src.noteFontPx, 10, 96, REPORT_DISPLAY_SETTINGS_DEFAULTS_.noteFontPx),
    buttonFontPx: clampDisplaySetting_(src.buttonFontPx, 10, 96, REPORT_DISPLAY_SETTINGS_DEFAULTS_.buttonFontPx),
    borderWidth: clampDisplaySetting_(src.borderWidth, 1, 8, REPORT_DISPLAY_SETTINGS_DEFAULTS_.borderWidth),
    fontWeight: clampDisplaySetting_(src.fontWeight, 400, 700, REPORT_DISPLAY_SETTINGS_DEFAULTS_.fontWeight)
  };
}

function applyDisplaySettingsFromStorage_() {
  let settings = REPORT_DISPLAY_SETTINGS_DEFAULTS_;
  try {
    const raw = window.localStorage.getItem(REPORT_DISPLAY_SETTINGS_STORAGE_KEY_);
    if (raw) settings = Object.assign({}, settings, JSON.parse(raw));
  } catch (err) {}
  const s = normalizeDisplaySettings_(settings);
  const root = document.documentElement;
  root.style.setProperty('--entry-ui-border-width', s.borderWidth + 'px');
  root.style.setProperty('--entry-ui-font-weight', String(s.fontWeight));
  root.style.setProperty('--entry-ui-h1-font-px', s.h1FontPx + 'px');
  root.style.setProperty('--entry-ui-title-font-px', s.h2FontPx + 'px');
  root.style.setProperty('--entry-ui-summary-header-font-px', s.thFontPx + 'px');
  root.style.setProperty('--entry-ui-value-font-px', s.valueFontPx + 'px');
  root.style.setProperty('--entry-ui-helper-font-px', s.helperFontPx + 'px');
  root.style.setProperty('--entry-ui-note-font-px', s.noteFontPx + 'px');
  root.style.setProperty('--entry-ui-button-font-px', s.buttonFontPx + 'px');
  root.style.setProperty('--entry-ui-header-font-px', s.headerFontPx + 'px');
  root.style.setProperty('--entry-ui-footer-font-px', s.footerFontPx + 'px');
  root.style.setProperty('--entry-ui-dropdown-font-px', s.dropdownFontPx + 'px');
}

function initializeReportPageShell_() {
  applyDisplaySettingsFromStorage_();
}

function buildWebAppPageUrl_(page, params) {
  try {
    const url = new URL(window.location.href);
    url.searchParams.set('page', String(page || 'home'));
    const p = params || {};
    Object.keys(p).forEach(function(key) {
      const value = p[key];
      if (value === undefined || value === null || String(value).trim() === '') {
        url.searchParams.delete(key);
        return;
      }
      url.searchParams.set(key, String(value));
    });
    return url.toString();
  } catch (err) {
    return '';
  }
}

function navigateToWebAppPage_(page, params) {
  const url = buildWebAppPageUrl_(page, params || {});
  if (!url) return;
  window.location.href = url;
}

function handleFooterHomeClick() {
  navigateToWebAppPage_('home', {});
}

function handleFooterDisplaySettingsClick() {
  navigateToWebAppPage_('entry', { openDisplaySettings: '1', returnPage: 'report' });
}

function handleFooterPlaceholderClick() {
  // レポート画面では未使用
}

function escapeHtml(value) {
  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function onPeriodTypeChange() {
  setDefaultPeriodValue();
}

function setDefaultPeriodValue() {
  const type = document.getElementById('period-type').value;
  const now = new Date();
  const yyyy = now.getFullYear();
  const mm = String(now.getMonth() + 1).padStart(2, '0');
  const dd = String(now.getDate()).padStart(2, '0');
  const input = document.getElementById('period-value');

  if (type === 'month') {
    input.placeholder = 'YYYY-MM';
    input.value = `${yyyy}-${mm}`;
  } else {
    input.placeholder = 'YYYY-MM-DD';
    input.value = `${yyyy}-${mm}-${dd}`;
  }
}

function formatPeriodInput(el) {
  const type = document.getElementById('period-type').value;
  let v = el.value.replace(/[^0-9]/g, '');

  if (type === 'month') {
    if (v.length > 6) v = v.slice(0, 6);
    if (v.length >= 4) {
      el.value = v.replace(/(\d{4})(\d{0,2})/, function(_, y, m) {
        return m ? `${y}-${m}` : y;
      });
    } else {
      el.value = v;
    }
    return;
  }

  if (v.length > 8) v = v.slice(0, 8);
  if (v.length === 8) {
    el.value = v.replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3');
  } else {
    el.value = v;
  }
}

function loadReport() {
  const type = document.getElementById('period-type').value;
  const value = document.getElementById('period-value').value.trim();
  const status = document.getElementById('action-status');
  status.textContent = '集計中...';

  google.script.run
    .withSuccessHandler(function(report) {
      currentReport = report;
      renderSummary(report);
      renderPurchases(report.purchases || []);
      renderSales(report.sales || []);
      renderExpenses(report.expenses || []);
      status.textContent = '';
    })
    .withFailureHandler(function(err) {
      status.textContent = '';
      showError(err);
    })
    .getPeriodReport(type, value);
}

function renderSummary(report) {
  const s = report.summary || {};
  document.getElementById('report-summary').innerHTML = `
    <h3 class="mid-title">集計結果（${escapeHtml(report.period ? report.period.label : '')}）</h3>
    <div class="summary-grid">
      <div>仕入件数</div><div>${s.purchaseCount || 0}</div>
      <div>仕入個数合計</div><div>${s.purchaseQtyTotal || 0}</div>
      <div>仕入総提示金額</div><div>${s.purchasePriceTotal || 0}</div>
      <div>仕入総原価</div><div>${s.purchaseCostTotal || 0}</div>
      <div>売上件数</div><div>${s.salesCount || 0}</div>
      <div>売上総額</div><div>${s.salesAmountTotal || 0}</div>
      <div>売上総利益</div><div>${s.salesProfitTotal || 0}</div>
      <div>経費件数</div><div>${s.expenseCount || 0}</div>
      <div>経費総額</div><div>${s.expenseTotal || 0}</div>
      <div>営業利益</div><div>${s.operatingProfit || 0}</div>
      <div>利益率</div><div>${s.profitRate || 0}%</div>
      <div>減価率</div><div>${s.depreciationRate || 0}%</div>
      <div>経費率</div><div>${s.expenseRate || 0}%</div>
    </div>
    <div class="note-text">生成日時: ${escapeHtml(report.generatedAt || '')}</div>
  `;
}

function renderPurchases(rows) {
  let body = '';
  if (!rows.length) {
    body = '<tr><td colspan="11">データなし</td></tr>';
  } else {
    rows.forEach((r, idx) => {
      body += `<tr>
        <td>${idx + 1}</td>
        <td>${escapeHtml(r.inventoryId)}</td>
        <td>${escapeHtml(r.purchaseDate)}</td>
        <td>${escapeHtml(r.productMasterNo)}</td>
        <td>${escapeHtml(r.name)}</td>
        <td>${r.price}</td>
        <td>${r.point}</td>
        <td>${r.expenseAlloc}</td>
        <td>${r.cost}</td>
        <td>${r.qty}</td>
        <td>${escapeHtml(r.slipNo)}</td>
      </tr>`;
    });
  }

  document.getElementById('report-purchases').innerHTML = `
    <h3 class="mid-title">仕入明細</h3>
    <div class="table-wrap">
      <table>
        <tr><th>No</th><th>商品個別番号</th><th>仕入日</th><th>商品マスタ番号</th><th>商品名</th><th>提示金額</th><th>ポイント</th><th>経費分配</th><th>原価</th><th>個数</th><th>伝票番号</th></tr>
        ${body}
      </table>
    </div>
  `;
}

function renderSales(rows) {
  let body = '';
  if (!rows.length) {
    body = '<tr><td colspan="10">データなし</td></tr>';
  } else {
    rows.forEach((r, idx) => {
      body += `<tr>
        <td>${idx + 1}</td>
        <td>${escapeHtml(r.salesDate)}</td>
        <td>${escapeHtml(r.inventoryId)}</td>
        <td>${escapeHtml(r.productMasterNo)}</td>
        <td>${escapeHtml(r.name)}</td>
        <td>${r.salesAmount}</td>
        <td>${r.cost}</td>
        <td>${r.profit}</td>
        <td>${r.assumedSales}</td>
        <td>${escapeHtml(r.slipNo)}</td>
      </tr>`;
    });
  }

  document.getElementById('report-sales').innerHTML = `
    <h3 class="mid-title">売上明細</h3>
    <div class="table-wrap">
      <table>
        <tr><th>No</th><th>売上日</th><th>商品個別番号</th><th>商品マスタ番号</th><th>商品名</th><th>売上金額</th><th>原価</th><th>利益</th><th>想定売価</th><th>伝票番号</th></tr>
        ${body}
      </table>
    </div>
  `;
}

function renderExpenses(rows) {
  let body = '';
  if (!rows.length) {
    body = '<tr><td colspan="5">データなし</td></tr>';
  } else {
    rows.forEach((r, idx) => {
      body += `<tr>
        <td>${idx + 1}</td>
        <td>${escapeHtml(r.date)}</td>
        <td>${escapeHtml(r.name)}</td>
        <td>${r.amount}</td>
        <td>${escapeHtml(r.memo)}</td>
      </tr>`;
    });
  }

  document.getElementById('report-expenses').innerHTML = `
    <h3 class="mid-title">経費明細</h3>
    <div class="table-wrap">
      <table>
        <tr><th>No</th><th>日付</th><th>内容</th><th>金額</th><th>メモ</th></tr>
        ${body}
      </table>
    </div>
  `;
}

function printReport() {
  if (!currentReport) {
    alert('先に集計を実行してください');
    return;
  }
  window.print();
}

function saveReportPdf() {
  const type = document.getElementById('period-type').value;
  const value = document.getElementById('period-value').value.trim();
  const status = document.getElementById('action-status');
  status.textContent = 'PDF保存中...';

  google.script.run
    .withSuccessHandler(function(res) {
      status.innerHTML = `保存完了: <a href="${escapeHtml(res.url)}" target="_blank">${escapeHtml(res.fileName)}</a>`;
    })
    .withFailureHandler(function(err) {
      status.textContent = '';
      showError(err);
    })
    .savePeriodReportPdf(type, value);
}

function showError(err) {
  const msg = err && err.message ? err.message : String(err);
  alert('エラー: ' + msg);
}
</script>
</body>
</html>
