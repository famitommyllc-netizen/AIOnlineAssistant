<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">

    <?!= HtmlService.createHtmlOutputFromFile('style.css').getContent(); ?>

</head>
<body class="entry-app-layout entry-b-layout">
  <div id="entry-app-shell" class="entry-app-shell">
    <header id="entry-fixed-header" class="entry-fixed-header">
      <div class="entry-fixed-header-inner">
        <div class="entry-fixed-header-title-wrap">
          <h1 class="entry-fixed-header-title">設定</h1>
          <div id="entry-fixed-header-file" class="entry-fixed-header-file">SettingsForm.html</div>
        </div>
        <div id="entry-fixed-header-state" class="entry-fixed-header-state">入力</div>
      </div>
    </header>
    <main id="entry-scroll-body" class="entry-scroll-body">
  <div class="section">
    <h2 class="section-title">設定</h2>
    <div class="note-text">設定画面も統一テーブルUIで管理します（固定行）。</div>
    <div id="settings-table-area"></div>
    <div class="button-row">
      <button type="button" class="btn-main" onclick="saveSettings()">保存</button>
      <span id="settings-status"></span>
    </div>
  </div>
    </main>
    <footer id="entry-fixed-footer" class="entry-fixed-footer">
      <nav class="entry-bottom-nav" aria-label="Settings 操作">
        <button type="button" id="footer-home-btn" class="entry-bottom-nav-btn" onclick="handleFooterHomeClick()">
          <span class="entry-bottom-nav-icon">H</span>
          <span class="entry-bottom-nav-label">ホーム</span>
        </button>
        <button type="button" id="footer-display-btn" class="entry-bottom-nav-btn" onclick="handleFooterDisplaySettingsClick()">
          <span class="entry-bottom-nav-icon">UI</span>
          <span class="entry-bottom-nav-label">表示</span>
        </button>
        <button type="button" id="footer-detail-btn" class="entry-bottom-nav-btn is-placeholder" onclick="handleFooterPlaceholderClick()">
          <span class="entry-bottom-nav-icon">-</span>
          <span class="entry-bottom-nav-label"></span>
        </button>
        <button type="button" id="footer-tax-btn" class="entry-bottom-nav-btn is-placeholder" onclick="handleFooterPlaceholderClick()">
          <span class="entry-bottom-nav-icon">-</span>
          <span class="entry-bottom-nav-label"></span>
        </button>
        <button type="button" id="footer-individual-btn" class="entry-bottom-nav-btn" onclick="handleFooterPlaceholderClick()">
          <span class="entry-bottom-nav-icon">IND</span>
          <span class="entry-bottom-nav-label">個別</span>
        </button>
      </nav>
    </footer>
  </div>

  <script>
function uiEscapeHtml_(value) {
  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function uiBuildOpButtons_(idx, opts) {
  var o = opts || {};
  if (!o.show) {
    return '<div class="inline-value">固定</div>';
  }

  var addLabel = uiEscapeHtml_(o.addLabel || '＋行追加');
  var removeLabel = uiEscapeHtml_(o.removeLabel || '−削除');
  var addFn = String(o.onAdd || '');
  var removeFn = String(o.onRemove || '');

  var addBtn = addFn
    ? '<button type="button" class="btn-main" onclick="' + addFn + '(' + idx + ')">' + addLabel + '</button>'
    : '';
  var removeBtn = removeFn
    ? '<button type="button" class="btn-sub" onclick="' + removeFn + '(' + idx + ')">' + removeLabel + '</button>'
    : '';

  return '<div class="inline-actions">' + addBtn + removeBtn + '</div>';
}

function uiBuildInputTable_(config) {
  var c = config || {};
  var title = c.title ? '<div class="entry-line-title">' + uiEscapeHtml_(c.title) + '</div>' : '';
  var columns = Array.isArray(c.columns) ? c.columns : [];
  var includeOps = c.includeOps !== false;
  var bodyHtml = String(c.bodyHtml || '');
  var note = c.note ? '<div class="note-text" style="margin-top:0.45em;">' + uiEscapeHtml_(c.note) + '</div>' : '';

  var header = '<th class="col-no">No</th>';
  for (var i = 0; i < columns.length; i++) {
    var col = columns[i] || {};
    var cls = col.className ? ' ' + uiEscapeHtml_(col.className) : '';
    header += '<th class="' + cls.trim() + '">' + uiEscapeHtml_(col.label || '') + '</th>';
  }
  if (includeOps) {
    header += '<th class="col-action">操作</th>';
  }

  return '' +
    '<div class="entry-line-card unified-entry-card">' +
      title +
      '<div class="inline-scroll">' +
        '<table class="entry-inline-table unified-input-table">' +
          '<tr>' + header + '</tr>' +
          bodyHtml +
        '</table>' +
      '</div>' +
      note +
    '</div>';
}
  </script>
  <script>
const INVENTORY_MODE_DETAIL = '明細単位';
const INVENTORY_MODE_UNIT = '個体単位';
const TERMINOLOGY_MODE_JP = '日本対応';
const TERMINOLOGY_MODE_GLOBAL = '国際対応';
const SETTINGS_DISPLAY_SETTINGS_STORAGE_KEY_ = 'entryDisplaySettings.v1';
const SETTINGS_DISPLAY_SETTINGS_DEFAULTS_ = {
  h1FontPx: 22, h2FontPx: 28, thFontPx: 36, valueFontPx: 48, dropdownFontPx: 28, helperFontPx: 30,
  headerFontPx: 24, footerFontPx: 36, noteFontPx: 22, buttonFontPx: 48, borderWidth: 2, fontWeight: 500
};

let currentSettings = {
  terminologyMode: TERMINOLOGY_MODE_JP,
  inventoryIdMode: INVENTORY_MODE_DETAIL,
  terminologyOptions: []
};

window.onload = function() {
  initializeSettingsPageShell_();
  loadSettings();
};

function clampDisplaySetting_(value, min, max, fallback) {
  const n = Number(value);
  if (!Number.isFinite(n)) return fallback;
  return Math.max(min, Math.min(max, Math.round(n)));
}

function normalizeDisplaySettings_(input) {
  const src = input || {};
  return {
    h1FontPx: clampDisplaySetting_(src.h1FontPx, 12, 96, SETTINGS_DISPLAY_SETTINGS_DEFAULTS_.h1FontPx),
    h2FontPx: clampDisplaySetting_(src.h2FontPx, 12, 96, SETTINGS_DISPLAY_SETTINGS_DEFAULTS_.h2FontPx),
    thFontPx: clampDisplaySetting_(src.thFontPx, 10, 96, SETTINGS_DISPLAY_SETTINGS_DEFAULTS_.thFontPx),
    valueFontPx: clampDisplaySetting_(src.valueFontPx, 10, 96, SETTINGS_DISPLAY_SETTINGS_DEFAULTS_.valueFontPx),
    dropdownFontPx: clampDisplaySetting_(src.dropdownFontPx, 10, 96, SETTINGS_DISPLAY_SETTINGS_DEFAULTS_.dropdownFontPx),
    helperFontPx: clampDisplaySetting_(src.helperFontPx, 10, 96, SETTINGS_DISPLAY_SETTINGS_DEFAULTS_.helperFontPx),
    headerFontPx: clampDisplaySetting_(src.headerFontPx, 10, 96, SETTINGS_DISPLAY_SETTINGS_DEFAULTS_.headerFontPx),
    footerFontPx: clampDisplaySetting_(src.footerFontPx, 10, 96, SETTINGS_DISPLAY_SETTINGS_DEFAULTS_.footerFontPx),
    noteFontPx: clampDisplaySetting_(src.noteFontPx, 10, 96, SETTINGS_DISPLAY_SETTINGS_DEFAULTS_.noteFontPx),
    buttonFontPx: clampDisplaySetting_(src.buttonFontPx, 10, 96, SETTINGS_DISPLAY_SETTINGS_DEFAULTS_.buttonFontPx),
    borderWidth: clampDisplaySetting_(src.borderWidth, 1, 8, SETTINGS_DISPLAY_SETTINGS_DEFAULTS_.borderWidth),
    fontWeight: clampDisplaySetting_(src.fontWeight, 400, 700, SETTINGS_DISPLAY_SETTINGS_DEFAULTS_.fontWeight)
  };
}

function applyDisplaySettingsFromStorage_() {
  let settings = SETTINGS_DISPLAY_SETTINGS_DEFAULTS_;
  try {
    const raw = window.localStorage.getItem(SETTINGS_DISPLAY_SETTINGS_STORAGE_KEY_);
    if (raw) settings = Object.assign({}, settings, JSON.parse(raw));
  } catch (err) {}
  const s = normalizeDisplaySettings_(settings);
  const root = document.documentElement;
  root.style.setProperty('--entry-ui-border-width', s.borderWidth + 'px');
  root.style.setProperty('--entry-ui-font-weight', String(s.fontWeight));
  root.style.setProperty('--entry-ui-h1-font-px', s.h1FontPx + 'px');
  root.style.setProperty('--entry-ui-title-font-px', s.h2FontPx + 'px');
  root.style.setProperty('--entry-ui-summary-header-font-px', s.thFontPx + 'px');
  root.style.setProperty('--entry-ui-value-font-px', s.valueFontPx + 'px');
  root.style.setProperty('--entry-ui-helper-font-px', s.helperFontPx + 'px');
  root.style.setProperty('--entry-ui-note-font-px', s.noteFontPx + 'px');
  root.style.setProperty('--entry-ui-button-font-px', s.buttonFontPx + 'px');
  root.style.setProperty('--entry-ui-header-font-px', s.headerFontPx + 'px');
  root.style.setProperty('--entry-ui-footer-font-px', s.footerFontPx + 'px');
  root.style.setProperty('--entry-ui-dropdown-font-px', s.dropdownFontPx + 'px');
}

function initializeSettingsPageShell_() {
  applyDisplaySettingsFromStorage_();
}

function buildWebAppPageUrl_(page, params) {
  try {
    const url = new URL(window.location.href);
    url.searchParams.set('page', String(page || 'home'));
    const p = params || {};
    Object.keys(p).forEach(function(key) {
      const value = p[key];
      if (value === undefined || value === null || String(value).trim() === '') {
        url.searchParams.delete(key);
        return;
      }
      url.searchParams.set(key, String(value));
    });
    return url.toString();
  } catch (err) {
    return '';
  }
}

function navigateToWebAppPage_(page, params) {
  const url = buildWebAppPageUrl_(page, params || {});
  if (!url) return;
  window.location.href = url;
}

function handleFooterHomeClick() {
  navigateToWebAppPage_('home', {});
}

function handleFooterDisplaySettingsClick() {
  navigateToWebAppPage_('entry', { openDisplaySettings: '1', returnPage: 'settings' });
}

function handleFooterPlaceholderClick() {
  // 設定画面では未使用
}

function getInventoryOptionsByTerminology(terminologyMode) {
  if (String(terminologyMode || '') === TERMINOLOGY_MODE_GLOBAL) {
    return [
      { value: INVENTORY_MODE_DETAIL, label: 'line（1 line = 1 inventory ID）' },
      { value: INVENTORY_MODE_UNIT, label: 'unit（1 quantity = 1 inventory ID）' }
    ];
  }
  return [
    { value: INVENTORY_MODE_DETAIL, label: '明細単位（1行 = 1在庫ID）' },
    { value: INVENTORY_MODE_UNIT, label: '個体単位（数量1つ = 1在庫ID）' }
  ];
}

function loadSettings() {
  google.script.run
    .withSuccessHandler(function(res) {
      const settings = res || {};
      currentSettings.terminologyMode = String(settings.terminologyMode || TERMINOLOGY_MODE_JP);
      currentSettings.inventoryIdMode = String(settings.inventoryIdMode || INVENTORY_MODE_DETAIL);
      currentSettings.terminologyOptions = Array.isArray(settings.terminologyOptions) ? settings.terminologyOptions : [];
      renderSettingsTable();
    })
    .withFailureHandler(showError)
    .getErpSettingsForUi();
}

function onTerminologyChanged(value) {
  currentSettings.terminologyMode = String(value || TERMINOLOGY_MODE_JP);
  const available = getInventoryOptionsByTerminology(currentSettings.terminologyMode).map(function(v) { return v.value; });
  if (available.indexOf(currentSettings.inventoryIdMode) === -1) {
    currentSettings.inventoryIdMode = INVENTORY_MODE_DETAIL;
  }
  renderSettingsTable();
}

function onInventoryModeChanged(value) {
  currentSettings.inventoryIdMode = String(value || INVENTORY_MODE_DETAIL);
}

function renderSettingsTable() {
  const terminologyOptions = currentSettings.terminologyOptions.map(function(opt) {
    const selected = String(opt.value || '') === currentSettings.terminologyMode ? ' selected' : '';
    return '<option value="' + uiEscapeHtml_(opt.value || '') + '"' + selected + '>' + uiEscapeHtml_(opt.label || '') + '</option>';
  }).join('');

  const inventoryOptions = getInventoryOptionsByTerminology(currentSettings.terminologyMode).map(function(opt) {
    const selected = String(opt.value || '') === currentSettings.inventoryIdMode ? ' selected' : '';
    return '<option value="' + uiEscapeHtml_(opt.value || '') + '"' + selected + '>' + uiEscapeHtml_(opt.label || '') + '</option>';
  }).join('');

  const rowsHtml = '' +
    '<tr>' +
      '<td class="col-no">1</td>' +
      '<td class="col-item"><div class="inline-value">用語表示方式</div></td>' +
      '<td class="col-item"><select id="terminology-mode" class="inline-input" onchange="onTerminologyChanged(this.value)">' + terminologyOptions + '</select></td>' +
      '<td class="col-action"><div class="inline-value">固定</div></td>' +
    '</tr>' +
    '<tr>' +
      '<td class="col-no">2</td>' +
      '<td class="col-item"><div class="inline-value">在庫ID方式</div></td>' +
      '<td class="col-item"><select id="inventory-id-mode" class="inline-input" onchange="onInventoryModeChanged(this.value)">' + inventoryOptions + '</select></td>' +
      '<td class="col-action"><div class="inline-value">固定</div></td>' +
    '</tr>';

  document.getElementById('settings-table-area').innerHTML = uiBuildInputTable_({
    title: '設定入力（1行入力型UI）',
    columns: [
      { label: '項目名', className: 'col-item' },
      { label: '値', className: 'col-item' }
    ],
    includeOps: true,
    bodyHtml: rowsHtml
  });
}

function saveSettings() {
  const status = document.getElementById('settings-status');
  status.textContent = '保存中...';

  google.script.run
    .withSuccessHandler(function() {
      status.textContent = '保存しました';
      setTimeout(function() { status.textContent = ''; }, 1200);
    })
    .withFailureHandler(function(err) {
      status.textContent = '';
      showError(err);
    })
    .saveErpSettings({
      inventoryIdMode: currentSettings.inventoryIdMode,
      terminologyMode: currentSettings.terminologyMode
    });
}

function showError(err) {
  const msg = err && err.message ? err.message : String(err);
  alert('エラー: ' + msg);
}
  </script>
</body>
</html>
