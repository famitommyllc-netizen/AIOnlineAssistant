function uiEscapeHtml_(value) {
  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function uiBuildOpButtons_(idx, opts) {
  var o = opts || {};
  if (!o.show) {
    return '<div class="inline-value">固定</div>';
  }

  var addLabel = uiEscapeHtml_(o.addLabel || '＋行追加');
  var removeLabel = uiEscapeHtml_(o.removeLabel || '−削除');
  var addFn = String(o.onAdd || '');
  var removeFn = String(o.onRemove || '');

  var addBtn = addFn
    ? '<button type="button" class="btn-main" onclick="' + addFn + '(' + idx + ')">' + addLabel + '</button>'
    : '';
  var removeBtn = removeFn
    ? '<button type="button" class="btn-sub" onclick="' + removeFn + '(' + idx + ')">' + removeLabel + '</button>'
    : '';

  return '<div class="inline-actions">' + addBtn + removeBtn + '</div>';
}

function uiBuildInputTable_(config) {
  var c = config || {};
  var title = c.title ? '<div class="entry-line-title">' + uiEscapeHtml_(c.title) + '</div>' : '';
  var toolbar = c.toolbarHtml ? '<div class="entry-card-toolbar">' + String(c.toolbarHtml) + '</div>' : '';
  var head = (title || toolbar) ? '<div class="entry-card-head">' + title + toolbar + '</div>' : '';
  var columns = Array.isArray(c.columns) ? c.columns : [];
  var includeOps = c.includeOps !== false;
  var bodyHtml = String(c.bodyHtml || '');
  var note = c.note ? '<div class="note-text" style="margin-top:0.45em;">' + uiEscapeHtml_(c.note) + '</div>' : '';

  var includeNo = c.includeNo === true;
  var header = includeNo ? '<th class="col-no">No</th>' : '';
  for (var i = 0; i < columns.length; i++) {
    var col = columns[i] || {};
    var cls = col.className ? ' ' + uiEscapeHtml_(col.className) : '';
    header += '<th class="' + cls.trim() + '">' + uiEscapeHtml_(col.label || '') + '</th>';
  }
  if (includeOps) {
    header += '<th class="col-action">操作</th>';
  }

  return '' +
    '<div class="entry-line-card unified-entry-card">' +
      head +
      '<div class="inline-scroll">' +
        '<table class="entry-inline-table unified-input-table">' +
          '<tr>' + header + '</tr>' +
          bodyHtml +
        '</table>' +
      '</div>' +
      note +
    '</div>';
}
  </script>

function ensureEntryAsyncStatusEl_() {
  let el = document.getElementById('entry-async-status');
  if (el) return el;
  el = document.createElement('div');
  el.id = 'entry-async-status';
  el.className = 'entry-async-status';
  el.style.display = 'none';
  document.body.appendChild(el);
  return el;
}

function showEntryAsyncStatus_(text, kind) {
  const el = ensureEntryAsyncStatusEl_();
  if (!el) return;
  if (entryAsyncStatusHideTimer_) {
    window.clearTimeout(entryAsyncStatusHideTimer_);
    entryAsyncStatusHideTimer_ = 0;
  }
  el.textContent = String(text || '');
  el.classList.remove('is-saving', 'is-done', 'is-error');
  if (kind) {
    el.classList.add('is-' + String(kind));
  }
  el.style.display = 'block';
}

function hideEntryAsyncStatus_() {
  const el = document.getElementById('entry-async-status');
  if (!el) return;
  el.style.display = 'none';
}

function beginEntryAsyncStatus_(text, kind) {
  entryAsyncStatusCount_ += 1;
  showEntryAsyncStatus_(text || 'Now Loading...', kind || 'loading');
  return { closed: false };
}

function endEntryAsyncStatus_(ticket, doneText, doneKind) {
  if (!ticket || ticket.closed) return;
  ticket.closed = true;
  entryAsyncStatusCount_ = Math.max(0, entryAsyncStatusCount_ - 1);
  if (entryAsyncStatusCount_ > 0) return;
  if (!doneText) {
    hideEntryAsyncStatus_();
    return;
  }
  showEntryAsyncStatus_(doneText, doneKind || 'done');
  entryAsyncStatusHideTimer_ = window.setTimeout(function() {
    hideEntryAsyncStatus_();
    entryAsyncStatusHideTimer_ = 0;
  }, 1200);
}

window.addEventListener('resize', handleEntryInputStageViewportChange_);
window.addEventListener('scroll', handleEntryInputStageViewportChange_, true);

function getStageTriggerElementFromEventTarget_(target) {
  if (!target || typeof target.closest !== 'function') return null;
  const triggerEl = target.closest('.entry-stage-trigger');
  if (!triggerEl) return null;
  if (!triggerEl.hasAttribute('readonly')) return null;
  return triggerEl;
}

function openStageTriggerWithoutFocus_(triggerEl) {
  if (!triggerEl) return;
  if (triggerEl.dataset && triggerEl.dataset.stageTriggerOpening === '1') return;
  if (triggerEl.dataset) {
    triggerEl.dataset.stageTriggerOpening = '1';
  }
  window.setTimeout(function() {
    if (triggerEl.dataset) {
      delete triggerEl.dataset.stageTriggerOpening;
    }
    if (typeof triggerEl.blur === 'function') {
      try {
        triggerEl.blur();
      } catch (err) {
        // no-op
      }
    }
    if (typeof triggerEl.click === 'function') {
      triggerEl.click();
    }
  }, 0);
}

function handleStageTriggerPointerDown_(event) {
  if (!isStableStageInputMode_()) return;
  const triggerEl = getStageTriggerElementFromEventTarget_(event && event.target);
  if (!triggerEl) return;
  if (event && typeof event.preventDefault === 'function') {
    event.preventDefault();
  }
  openStageTriggerWithoutFocus_(triggerEl);
}

function handleStageTriggerTouchStart_(event) {
  if (!isStableStageInputMode_()) return;
  const triggerEl = getStageTriggerElementFromEventTarget_(event && event.target);
  if (!triggerEl) return;
  if (event && typeof event.preventDefault === 'function') {
    event.preventDefault();
  }
  openStageTriggerWithoutFocus_(triggerEl);
}

function clampDisplaySetting_(value, min, max, fallback) {
  const n = Number(value);
  if (!Number.isFinite(n)) return fallback;
  return Math.max(min, Math.min(max, Math.round(n)));
}

function normalizeDisplaySettings_(input) {
  const src = input || {};
  const out = {
    h1FontPx: clampDisplaySetting_(src.h1FontPx, 12, 96, ENTRY_DISPLAY_SETTINGS_DEFAULTS_.h1FontPx),
    h2FontPx: clampDisplaySetting_(src.h2FontPx, 12, 96, ENTRY_DISPLAY_SETTINGS_DEFAULTS_.h2FontPx),
    thFontPx: clampDisplaySetting_(src.thFontPx, 10, 96, ENTRY_DISPLAY_SETTINGS_DEFAULTS_.thFontPx),
    valueFontPx: clampDisplaySetting_(src.valueFontPx, 10, 96, ENTRY_DISPLAY_SETTINGS_DEFAULTS_.valueFontPx),
    dropdownFontPx: clampDisplaySetting_(src.dropdownFontPx, 10, 96, ENTRY_DISPLAY_SETTINGS_DEFAULTS_.dropdownFontPx),
    helperFontPx: clampDisplaySetting_(src.helperFontPx, 10, 96, ENTRY_DISPLAY_SETTINGS_DEFAULTS_.helperFontPx),
    headerFontPx: clampDisplaySetting_(src.headerFontPx, 10, 96, ENTRY_DISPLAY_SETTINGS_DEFAULTS_.headerFontPx),
    footerFontPx: clampDisplaySetting_(src.footerFontPx, 10, 96, ENTRY_DISPLAY_SETTINGS_DEFAULTS_.footerFontPx),
    noteFontPx: clampDisplaySetting_(src.noteFontPx, 10, 96, ENTRY_DISPLAY_SETTINGS_DEFAULTS_.noteFontPx),
    buttonFontPx: clampDisplaySetting_(src.buttonFontPx, 10, 96, ENTRY_DISPLAY_SETTINGS_DEFAULTS_.buttonFontPx),
    borderWidth: clampDisplaySetting_(src.borderWidth, 1, 8, ENTRY_DISPLAY_SETTINGS_DEFAULTS_.borderWidth),
    radiusScale: ENTRY_DISPLAY_SETTINGS_DEFAULTS_.radiusScale,
    fontWeight: clampDisplaySetting_(src.fontWeight, 400, 700, ENTRY_DISPLAY_SETTINGS_DEFAULTS_.fontWeight),
    colAction: ENTRY_DISPLAY_SETTINGS_DEFAULTS_.colAction,
    pointFormWidth: ENTRY_DISPLAY_SETTINGS_DEFAULTS_.pointFormWidth,
    productColItemPct: clampDisplaySetting_(src.productColItemPct, 40, 70, ENTRY_DISPLAY_SETTINGS_DEFAULTS_.productColItemPct),
    productColPricePct: clampDisplaySetting_(src.productColPricePct, 10, 30, ENTRY_DISPLAY_SETTINGS_DEFAULTS_.productColPricePct),
    productColQtyPct: clampDisplaySetting_(src.productColQtyPct, 8, 20, ENTRY_DISPLAY_SETTINGS_DEFAULTS_.productColQtyPct),
    productColCostPct: clampDisplaySetting_(src.productColCostPct, 10, 30, ENTRY_DISPLAY_SETTINGS_DEFAULTS_.productColCostPct),
    commonColPct: clampDisplaySetting_(src.commonColPct, 30, 34, ENTRY_DISPLAY_SETTINGS_DEFAULTS_.commonColPct)
  };
  const productTotal = out.productColItemPct + out.productColPricePct + out.productColQtyPct + out.productColCostPct;
  if (productTotal !== 100) {
    const diff = 100 - productTotal;
    out.productColItemPct = Math.max(40, Math.min(70, out.productColItemPct + diff));
  }
  return out;
}

function loadDisplaySettings_() {
  try {
    const raw = window.localStorage.getItem(ENTRY_DISPLAY_SETTINGS_STORAGE_KEY_);
    if (!raw) return normalizeDisplaySettings_(ENTRY_DISPLAY_SETTINGS_DEFAULTS_);
    return normalizeDisplaySettings_(Object.assign({}, ENTRY_DISPLAY_SETTINGS_DEFAULTS_, JSON.parse(raw)));
  } catch (err) {
    return normalizeDisplaySettings_(ENTRY_DISPLAY_SETTINGS_DEFAULTS_);
  }
}

function saveDisplaySettings_() {
  try {
    window.localStorage.setItem(ENTRY_DISPLAY_SETTINGS_STORAGE_KEY_, JSON.stringify(entryDisplaySettings_));
  } catch (err) {
    // no-op
  }
}

  root.style.setProperty('--entry-ui-expense-scale', '1');

  root.style.setProperty('--entry-ui-common-scale', '1');
  root.style.setProperty('--entry-ui-footer-scale', '1');

  root.style.setProperty('--entry-ui-summary-header-scale', '1');
  root.style.setProperty('--entry-ui-summary-value-scale', '1');
  root.style.setProperty('--entry-ui-point-form-width', ENTRY_DISPLAY_SETTINGS_DEFAULTS_.pointFormWidth + '%');
  root.style.setProperty('--entry-ui-product-row1-font-px', settings.valueFontPx + 'px');
  root.style.setProperty('--entry-ui-product-row2-font-px', settings.helperFontPx + 'px');
  root.style.setProperty('--entry-ui-expense-font-px', settings.valueFontPx + 'px');
  root.style.setProperty('--entry-ui-point-font-px', settings.valueFontPx + 'px');
  root.style.setProperty('--entry-ui-common-font-px', settings.valueFontPx + 'px');
  root.style.setProperty('--entry-ui-footer-font-px', settings.footerFontPx + 'px');
  root.style.setProperty('--entry-ui-title-font-px', settings.h2FontPx + 'px');
  root.style.setProperty('--entry-ui-summary-header-font-px', settings.thFontPx + 'px');

function initializeDisplaySettings_() {
  entryDisplaySettings_ = loadDisplaySettings_();

      entryDisplaySettings_.radiusScale = ENTRY_DISPLAY_SETTINGS_DEFAULTS_.radiusScale;
      window.localStorage.setItem(ENTRY_DISPLAY_SETTINGS_RADIUS_MIGRATION_KEY_, '1');
      saveDisplaySettings_();

  return ['<option value=""></option>'].concat(

      if (!name) return '';
      return '<option value="' + escapeHtml(name) + '"></option>';
    }).filter(function(v) { return !!v; })

}

function createDisplaySettingsTemplateSuggestionList_(inputValue) {

  const query = queryRaw.toLowerCase();
  const source = (entryDisplaySettingsTemplateList_ || []).map(function(item) {
    return String(item && item.templateName || '').trim();
  }).filter(function(v) { return !!v; });
  const seen = new Set();
  const startsWith = [];
  const includes = [];
  source.forEach(function(value) {
    const key = value.toLowerCase();
    if (seen.has(key)) return;
    seen.add(key);
    if (!query) {
      startsWith.push(value);
      return;
    }
    if (key.indexOf(query) === 0) {
      startsWith.push(value);
      return;
    }
    if (key.indexOf(query) >= 0) {
      includes.push(value);
    }
  });
  return startsWith.concat(includes).slice(0, 24);
}

function renderDisplaySettingsTemplateSuggestions_() {
  const listEl = document.getElementById('entry-display-settings-template-suggestions');
  if (!listEl) return;
  if (!entryDisplayTemplateSuggestionVisible_ || !entryDisplayTemplateSuggestions_.length) {
    listEl.innerHTML = '';
    listEl.style.display = 'none';
    return;
  }
  const itemsHtml = entryDisplayTemplateSuggestions_.map(function(item, idx) {
    const activeClass = idx === entryDisplayTemplateSuggestionActiveIndex_ ? ' is-active' : '';
    return '<button type="button" class="entry-input-stage-suggestion-item' + activeClass + '" onmousedown="onDisplaySettingsTemplateSuggestionPick(' + idx + ', event)">' + escapeHtml(item) + '</button>';
  }).join('');
  listEl.innerHTML = itemsHtml;
  listEl.style.display = 'flex';
}

function updateDisplaySettingsTemplateSuggestions_(value, opts) {
  const options = opts || {};
  const nextSuggestions = createDisplaySettingsTemplateSuggestionList_(value);
  entryDisplayTemplateSuggestions_ = nextSuggestions;
  const canShow = nextSuggestions.length > 0;
  entryDisplayTemplateSuggestionVisible_ = !!options.forceOpen ? canShow : (canShow && options.visible !== false);
  if (!entryDisplayTemplateSuggestionVisible_) {
    entryDisplayTemplateSuggestionActiveIndex_ = -1;
    renderDisplaySettingsTemplateSuggestions_();
    return;
  }
  if (options.resetActive) {
    entryDisplayTemplateSuggestionActiveIndex_ = -1;
  } else if (entryDisplayTemplateSuggestionActiveIndex_ >= nextSuggestions.length) {
    entryDisplayTemplateSuggestionActiveIndex_ = nextSuggestions.length - 1;
  }
  renderDisplaySettingsTemplateSuggestions_();
}

function closeDisplaySettingsTemplateSuggestions_() {
  entryDisplayTemplateSuggestions_ = [];
  entryDisplayTemplateSuggestionActiveIndex_ = -1;
  entryDisplayTemplateSuggestionVisible_ = false;
  renderDisplaySettingsTemplateSuggestions_();
}

function onDisplaySettingsTemplateSuggestionPick(index, event) {
  if (event && typeof event.preventDefault === 'function') {
    event.preventDefault();
  }
  const idx = Number(index);
  if (!Number.isFinite(idx) || idx < 0 || idx >= entryDisplayTemplateSuggestions_.length) return;
  const picked = entryDisplayTemplateSuggestions_[idx];
  const inputEl = getDisplaySettingsModalField_('template-select');
  if (inputEl) inputEl.value = picked;
  closeDisplaySettingsTemplateSuggestions_();
  applySelectedDisplayTemplate_();
}

function moveDisplaySettingsTemplateSuggestionSelection_(direction) {
  if (!entryDisplayTemplateSuggestionVisible_ || !entryDisplayTemplateSuggestions_.length) return false;
  const len = entryDisplayTemplateSuggestions_.length;
  if (entryDisplayTemplateSuggestionActiveIndex_ < 0) {
    entryDisplayTemplateSuggestionActiveIndex_ = direction > 0 ? 0 : len - 1;
  } else {
    entryDisplayTemplateSuggestionActiveIndex_ = (entryDisplayTemplateSuggestionActiveIndex_ + direction + len) % len;
  }
  renderDisplaySettingsTemplateSuggestions_();
  return true;
}

function onDisplaySettingsTemplateSelectFocus_() {
  const inputEl = getDisplaySettingsModalField_('template-select');
  updateDisplaySettingsTemplateSuggestions_(inputEl ? inputEl.value : '', { forceOpen: true, resetActive: true });
}

function onDisplaySettingsTemplateSelectInput_(value) {
  updateDisplaySettingsTemplateSuggestions_(value, { forceOpen: true, resetActive: true });
}

function onDisplaySettingsTemplateSelectBlur_() {
  window.setTimeout(function() {
    closeDisplaySettingsTemplateSuggestions_();
  }, 120);
}

function onDisplaySettingsTemplateSelectKeydown_(event) {
  if (!event) return;
  if (event.key === 'ArrowDown') {
    if (moveDisplaySettingsTemplateSuggestionSelection_(1)) {
      event.preventDefault();
      return;
    }
  }
  if (event.key === 'ArrowUp') {
    if (moveDisplaySettingsTemplateSuggestionSelection_(-1)) {
      event.preventDefault();
      return;
    }
  }
  if (event.key === 'Escape') {
    if (entryDisplayTemplateSuggestionVisible_) {
      event.preventDefault();
      closeDisplaySettingsTemplateSuggestions_();
      return;
    }
  }
  if (event.key !== 'Enter') return;
  if (entryDisplayTemplateSuggestionVisible_ && entryDisplayTemplateSuggestionActiveIndex_ >= 0 && entryDisplayTemplateSuggestionActiveIndex_ < entryDisplayTemplateSuggestions_.length) {
    event.preventDefault();
    onDisplaySettingsTemplateSuggestionPick(entryDisplayTemplateSuggestionActiveIndex_);
    return;
  }
  event.preventDefault();
  applySelectedDisplayTemplate_();
}

function getDisplaySettingsTemplateByName_(templateName, list) {
  const targetName = String(templateName || '').trim();
  if (!targetName) return null;
  const templates = Array.isArray(list) ? list : [];
  for (let i = 0; i < templates.length; i++) {
    const item = templates[i] || {};
    if (String(item.templateName || '').trim() === targetName) return item;
  }
  return null;
}

function getDisplaySettingsActiveTemplateName_(list) {
  const activeId = String(entryDisplaySettingsActiveTemplateId_ || '').trim();
  if (!activeId) return '';
  const templates = Array.isArray(list) ? list : [];
  for (let i = 0; i < templates.length; i++) {
    const item = templates[i] || {};
    if (String(item.templateId || '').trim() !== activeId) continue;
    return String(item.templateName || '').trim();
  }
  return '';
}

function renderDisplaySettingsTemplateDatalist_(list) {
  const inputEl = getDisplaySettingsModalField_('template-select');
  if (!inputEl) return;
  updateDisplaySettingsTemplateSuggestions_(inputEl.value, { visible: entryDisplayTemplateSuggestionVisible_, resetActive: true });
}

function loadDisplaySettingsTemplateList_(callback) {

      endEntryAsyncStatus_(ticket);
      if (typeof callback === 'function') callback(entryDisplaySettingsTemplateList_);

      showError(err);
      entryDisplaySettingsTemplateList_ = [];
      endEntryAsyncStatus_(ticket, '読み込みに失敗しました', 'error');
      if (typeof callback === 'function') callback([]);

function saveCurrentDisplaySettingsAsTemplate_() {
  readDisplaySettingsFromModal_();
  const nameField = getDisplaySettingsModalField_('template-name');
  const name = String((nameField && nameField.value) || '').trim();
  if (!name) {
    alert('テンプレート名を入力してください');
    return;
  }
  const payload = {
    templateId: String(entryDisplaySettingsActiveTemplateId_ || '').trim(),
    templateName: name,
    settings: normalizeDisplaySettings_(entryDisplaySettings_ || ENTRY_DISPLAY_SETTINGS_DEFAULTS_)
  };
  const ticket = beginEntryAsyncStatus_('現在保存中...', 'saving');
  google.script.run
    .withSuccessHandler(function(saved) {
      entryDisplaySettingsActiveTemplateId_ = String(saved && saved.templateId || '').trim();
      const savedName = String(saved && saved.templateName || name).trim();
      const selectEl = getDisplaySettingsModalField_('template-select');
      const nameEl = getDisplaySettingsModalField_('template-name');
      if (selectEl) selectEl.value = savedName;
      if (nameEl) nameEl.value = savedName;
      loadDisplaySettingsTemplateList_(function(list) {
        renderDisplaySettingsTemplateDatalist_(list);
        endEntryAsyncStatus_(ticket, '保存しました', 'done');
      });
    })
    .withFailureHandler(function(err) {
      showError(err);
      endEntryAsyncStatus_(ticket, '保存に失敗しました', 'error');

}

      if (nameEl) nameEl.value = String(template && template.templateName || '').trim();
      endEntryAsyncStatus_(ticket, '適用しました', 'done');
    })
    .withFailureHandler(function(err) {
      showError(err);
      endEntryAsyncStatus_(ticket, '適用に失敗しました', 'error');
    })

function deleteSelectedDisplayTemplate_() {

function navigateToWebAppPage_(page, params) {
  const fallbackUrl = String(buildWebAppPageUrl_(page, params || {}) || '').trim();
  if (isWebAppRuntimeUrl_()) {
    if (!fallbackUrl) {
      showError(new Error('ページ遷移URLを作成できませんでした。'));
      return;
    }
    window.location.href = fallbackUrl;
    return;
  }
  const canUseGasRun = (typeof google !== 'undefined') &&
    google &&
    google.script &&
    google.script.run &&
    typeof google.script.run.getWebAppPageUrl === 'function';
  if (!canUseGasRun) {
    if (!fallbackUrl) {
      showError(new Error('ページ遷移URLを作成できませんでした。'));
      return;
    }
    window.location.href = fallbackUrl;
    return;
  }
  google.script.run
    .withSuccessHandler(function(url) {
      const resolvedUrl = String(url || '').trim();
      const targetUrl = resolvedUrl || fallbackUrl;
      if (!targetUrl) {
        showError(new Error('ページ遷移URLを取得できませんでした。'));
        return;
      }
      try {
        if (window.top && window.top !== window.self) {
          window.top.location.href = targetUrl;
          return;
        }
      } catch (err) {
        // no-op
      }
      window.location.href = targetUrl;
    })
    .withFailureHandler(function(err) {
      if (fallbackUrl) {
        window.location.href = fallbackUrl;
        return;
      }
      showError(err || new Error('ページ遷移URLを取得できませんでした。'));
    })
    .getWebAppPageUrl(page, params || {});
}

function applyEntryInputStagePosition_(stageEl) {
  if (!stageEl) return;
  const panelEl = stageEl.querySelector('.entry-input-stage-panel');
  if (!panelEl) return;
  const vv = window.visualViewport;
  const viewportScale = vv ? (Number(vv.scale) || 1) : 1;
  // ズーム時のみ visualViewport のオフセットを使う（通常倍率では座標系を単純化）
  const useViewportOffset = viewportScale !== 1;
  const viewportOffsetLeft = (vv && useViewportOffset) ? (Number(vv.offsetLeft) || 0) : 0;
  const viewportOffsetTop = (vv && useViewportOffset) ? (Number(vv.offsetTop) || 0) : 0;
  const viewportWidth = vv ? Math.max(0, vv.width) : Math.max(0, window.innerWidth);
  const viewportHeight = vv ? Math.max(0, vv.height) : window.innerHeight;
  const isMobile = viewportWidth <= 768;
  const panelWidth = Math.max(0, viewportWidth * 0.98);
  const horizontalMargin = Math.max(0, (viewportWidth - panelWidth) / 2);

  if (isMobile) {
    stageEl.style.inset = 'auto';
    stageEl.style.left = viewportOffsetLeft + 'px';
    stageEl.style.top = viewportOffsetTop + 'px';
    stageEl.style.width = viewportWidth + 'px';
    stageEl.style.height = viewportHeight + 'px';
    stageEl.style.setProperty('--entry-stage-height', Math.round(viewportHeight) + 'px');

    const left = Math.round(viewportWidth / 2);
    const top = 8;
    const panelMaxHeight = Math.max(0, viewportHeight - 16);

    panelEl.style.left = left + 'px';
    panelEl.style.top = top + 'px';
    panelEl.style.width = panelWidth + 'px';
    panelEl.style.maxHeight = panelMaxHeight + 'px';
    panelEl.style.transform = 'translateX(-50%)';
    emitEntryStageDebugInfo_({
      branch: 'mobile',
      viewportWidth: viewportWidth,
      viewportHeight: viewportHeight,
      viewportScale: viewportScale,
      viewportOffsetLeft: viewportOffsetLeft,
      viewportOffsetTop: viewportOffsetTop,
      panelWidthCalc: panelWidth,
      panelStyleWidth: panelEl.style.width
    });
    return;
  }
  stageEl.style.removeProperty('inset');
  stageEl.style.removeProperty('left');
  stageEl.style.removeProperty('top');
  stageEl.style.removeProperty('width');
  stageEl.style.removeProperty('height');
  stageEl.style.setProperty('--entry-stage-height', '100dvh');
  panelEl.style.removeProperty('left');
  panelEl.style.removeProperty('top');
  panelEl.style.removeProperty('width');
  panelEl.style.removeProperty('max-height');
  panelEl.style.removeProperty('transform');

  const anchorEl = getEntryInputStageAnchorElement_();
  const anchorRect = captureStageRect_(anchorEl) || {
    left: 8,
    top: 8,
    width: Math.max(0, viewportWidth - 16),
    height: 0
  };
  const rootStyles = window.getComputedStyle(document.documentElement);
  const topOffsetRaw = parseFloat(String(rootStyles.getPropertyValue('--entry-top-offset') || '').trim());
  const topOffset = Number.isFinite(topOffsetRaw) ? topOffsetRaw : 0;
  const safeMargin = horizontalMargin;
  const left = clampStageValue_(
    anchorRect.left + ((anchorRect.width - panelWidth) / 2),
    safeMargin,
    Math.max(safeMargin, viewportWidth - panelWidth - safeMargin)
  );
  const top = clampStageValue_(
    anchorRect.top + 8 + topOffset,
    safeMargin,
    Math.max(safeMargin, viewportHeight - 260)
  );
  const originRect = entryInputStageState_.originRect || anchorRect;
  const fromX = (originRect.left + (originRect.width / 2)) - (left + (panelWidth / 2));
  const fromY = (originRect.top + (originRect.height / 2)) - (top + 20);

  stageEl.style.setProperty('--entry-panel-left', left + 'px');
  stageEl.style.setProperty('--entry-panel-top', top + 'px');
  stageEl.style.setProperty('--entry-panel-width', panelWidth + 'px');
  stageEl.style.setProperty('--entry-from-x', Math.round(fromX) + 'px');
  stageEl.style.setProperty('--entry-from-y', Math.round(fromY) + 'px');
  emitEntryStageDebugInfo_({
    branch: 'desktop',
    viewportWidth: viewportWidth,
    viewportHeight: viewportHeight,
    viewportScale: viewportScale,
    viewportOffsetLeft: viewportOffsetLeft,
    viewportOffsetTop: viewportOffsetTop,
    panelWidthCalc: panelWidth,
    panelStyleWidth: panelEl.style.width
  });
}

function emitEntryStageDebugInfo_(meta) {
  if (!ENTRY_STAGE_DEBUG_ENABLED_) return;
  const stageEl = document.getElementById('entry-input-stage');
  const panelEl = stageEl ? stageEl.querySelector('.entry-input-stage-panel') : null;
  if (!panelEl) return;
  const vv = window.visualViewport;
  const rect = panelEl.getBoundingClientRect();
  const cs = window.getComputedStyle(panelEl);
  const payload = {
    branch: String((meta && meta.branch) || ''),
    innerWidth: window.innerWidth,
    innerHeight: window.innerHeight,
    visualViewportWidth: vv ? vv.width : null,
    visualViewportHeight: vv ? vv.height : null,
    visualViewportScale: vv ? vv.scale : null,
    panelWidthCalc: meta ? meta.panelWidthCalc : null,
    panelStyleWidth: panelEl.style.width,
    panelRectWidth: rect.width,
    panelComputedWidth: cs.width,
    panelComputedMaxWidth: cs.maxWidth,
    panelComputedTransform: cs.transform,
    panelComputedBoxSizing: cs.boxSizing
  };
  renderEntryStageDebugOverlay_(payload);
  if (typeof console !== 'undefined' && console && typeof console.log === 'function') {
    console.log('[entry-stage-debug]', payload);
  }
}

function isEntryInputStageDateField_(scope, step) {
  return normalizeEntryInputStageScope_(scope) === 'common' && normalizeEntryInputStageStep_('common', step) === 'date';
}

function isEntryInputStageAutocompleteField_(scope, step) {
  const targetScope = normalizeEntryInputStageScope_(scope);
  const targetStep = normalizeEntryInputStageStep_(targetScope, step);
  if (targetScope === 'template' && targetStep === 'name') return true;
  if (targetScope === 'product' && targetStep === 'name') return true;
  if (targetScope === 'expense' && targetStep === 'name') return true;
  if (targetScope === 'common' && (targetStep === 'supplier' || targetStep === 'payment')) return true;
  return false;
}

function getEntryInputStageAutocompleteSource_(scope, step) {
  const targetScope = normalizeEntryInputStageScope_(scope);
  const targetStep = normalizeEntryInputStageStep_(targetScope, step);
  if (targetScope === 'template' && targetStep === 'name') {
    return (entryProductTemplateState_.list || [])
      .map(function(item) { return String(item && item.templateName || '').trim(); })
      .filter(function(v) { return !!v; });
  }
  if (targetScope === 'product' && targetStep === 'name') {
    const out = [];
    const seen = new Set();
    (productCandidates || []).forEach(function(item) {
      if (!item) return;
      const values = [item.label, item.name, item.productNo, item.jan];
      values.forEach(function(v) {
        const val = String(v || '').trim();
        if (!val) return;
        if (seen.has(val)) return;
        seen.add(val);
        out.push(val);
      });
    });
    return out;
  }
  if (targetScope === 'expense' && targetStep === 'name') {
    return (expenseCandidates || []).map(function(v) { return String(v || '').trim(); }).filter(function(v) { return !!v; });
  }
  if (targetScope === 'common' && targetStep === 'supplier') {
    return (supplierCandidates || []).map(function(v) { return String(v || '').trim(); }).filter(function(v) { return !!v; });
  }
  if (targetScope === 'common' && targetStep === 'payment') {
    return (paymentCandidates || []).map(function(v) { return String(v || '').trim(); }).filter(function(v) { return !!v; });
  }
  return [];
}

function createEntryInputStageSuggestionList_(scope, step, inputValue) {
  if (!isEntryInputStageAutocompleteField_(scope, step)) return [];
  const queryRaw = String(inputValue || '').trim();
  const query = queryRaw.toLowerCase();
  const source = getEntryInputStageAutocompleteSource_(scope, step);
  const seen = new Set();
  const startsWith = [];
  const includes = [];
  source.forEach(function(item) {
    const value = String(item || '').trim();
    if (!value) return;
    const key = value.toLowerCase();
    if (seen.has(key)) return;
    seen.add(key);
    if (!query) {
      startsWith.push(value);
      return;
    }
    const lower = value.toLowerCase();
    if (lower.indexOf(query) === 0) {
      startsWith.push(value);
      return;
    }
    if (lower.indexOf(query) >= 0) {
      includes.push(value);
    }
  });
  return startsWith.concat(includes).slice(0, 12);
}

function renderEntryInputStageSuggestions_() {
  const listEl = document.getElementById('entry-input-stage-suggestions');
  if (!listEl) return;
  if (!entryInputStageSuggestionVisible_ || !entryInputStageSuggestions_.length) {
    listEl.innerHTML = '';
    listEl.style.display = 'none';
    return;
  }
  const itemsHtml = entryInputStageSuggestions_.map(function(item, idx) {
    const activeClass = idx === entryInputStageSuggestionActiveIndex_ ? ' is-active' : '';
    const escaped = escapeHtml(item);
    return `<button type="button" class="entry-input-stage-suggestion-item${activeClass}" onmousedown="onEntryInputStageSuggestionPick(${idx}, event)">${escaped}</button>`;
  }).join('');
  listEl.innerHTML = itemsHtml;
  listEl.style.display = 'flex';
}

function updateEntryInputStageSuggestions_(scope, step, value, opts) {
  const options = opts || {};
  if (!isEntryInputStageAutocompleteField_(scope, step)) {
    entryInputStageSuggestions_ = [];
    entryInputStageSuggestionActiveIndex_ = -1;
    entryInputStageSuggestionVisible_ = false;
    renderEntryInputStageSuggestions_();
    return;
  }
  const nextSuggestions = createEntryInputStageSuggestionList_(scope, step, value);
  entryInputStageSuggestions_ = nextSuggestions;
  entryInputStageSuggestionVisible_ = nextSuggestions.length > 0;
  if (!entryInputStageSuggestionVisible_) {
    entryInputStageSuggestionActiveIndex_ = -1;
    renderEntryInputStageSuggestions_();
    return;
  }
  if (options.resetActive) {
    entryInputStageSuggestionActiveIndex_ = -1;
  } else if (entryInputStageSuggestionActiveIndex_ >= nextSuggestions.length) {
    entryInputStageSuggestionActiveIndex_ = nextSuggestions.length - 1;
  }
  renderEntryInputStageSuggestions_();
}

function closeEntryInputStageSuggestions_() {
  entryInputStageSuggestions_ = [];
  entryInputStageSuggestionActiveIndex_ = -1;
  entryInputStageSuggestionVisible_ = false;
  renderEntryInputStageSuggestions_();
}

function onEntryInputStageSuggestionPick(index, event) {
  if (event && typeof event.preventDefault === 'function') {
    event.preventDefault();
  }
  const idx = Number(index);
  if (!Number.isFinite(idx) || idx < 0 || idx >= entryInputStageSuggestions_.length) return;
  const picked = entryInputStageSuggestions_[idx];
  const inputEl = document.getElementById('entry-input-stage-field');
  if (inputEl) {
    inputEl.value = picked;
    if (typeof inputEl.focus === 'function') {
      try {
        inputEl.focus({ preventScroll: true });
      } catch (err) {
        inputEl.focus();
      }
    }
  }
  onEntryInputStageInput(picked);
  closeEntryInputStageSuggestions_();
  const scope = normalizeEntryInputStageScope_(entryInputStageState_.scope);
  if (scope === 'template') {
    onEntryInputStageAction();
  }
}

function moveEntryInputStageSuggestionSelection_(direction) {
  if (!entryInputStageSuggestionVisible_ || !entryInputStageSuggestions_.length) return false;
  const len = entryInputStageSuggestions_.length;
  if (entryInputStageSuggestionActiveIndex_ < 0) {
    entryInputStageSuggestionActiveIndex_ = direction > 0 ? 0 : len - 1;
  } else {
    entryInputStageSuggestionActiveIndex_ = (entryInputStageSuggestionActiveIndex_ + direction + len) % len;
  }
  renderEntryInputStageSuggestions_();
  return true;
}

  if (normalizeEntryInputStageScope_(scope) === 'product' && normalizeEntryInputStageStep_('product', step) === 'price') {
    const discountRaw = getEntryInputStageValue_('product', 'itemDiscount');
    const discountValue = escapeHtml(String(discountRaw || ''));
    return `

  return `

      ${inputHtml}

            <line x1="8" y1="3.5" x2="8" y2="8"></line>
            <line x1="16" y1="3.5" x2="16" y2="8"></line>
            <line x1="4" y1="9" x2="20" y2="9"></line>
          </svg>
        </span>
      </span>
      <!-- 実クリック対象の date input -->
      <input type="date" id="entry-input-stage-date-picker" class="entry-input-stage-date-native" aria-label="日付を選択" onclick="syncEntryInputStageDatePicker_()" onfocus="syncEntryInputStageDatePicker_()" oninput="onEntryInputStageDatePickerChange_()" onchange="onEntryInputStageDatePickerChange_()">
    </div>

function focusEntryInputStage_() {
  if (isStableStageInputMode_()) return;
  window.setTimeout(function() {
    const inputEl = document.getElementById('entry-input-stage-field');
    if (!inputEl) return;
    try {
      inputEl.focus({ preventScroll: true });
    } catch (err) {
      try {
        inputEl.focus();
      } catch (err2) {
        // no-op
      }
    }
    if (typeof inputEl.setSelectionRange === 'function') {
      const len = String(inputEl.value || '').length;
      try {
        inputEl.setSelectionRange(len, len);
      } catch (err3) {
        // no-op
      }
    }
  }, 0);
}

function handleEntryInputStageFieldFocus_() {
  if (entryInputStageState_.active) {
    const scope = normalizeEntryInputStageScope_(entryInputStageState_.scope);
    const step = normalizeEntryInputStageStep_(scope, entryInputStageState_.step);
    const inputEl = document.getElementById('entry-input-stage-field');
    updateEntryInputStageSuggestions_(scope, step, inputEl ? inputEl.value : '', { resetActive: true });
  }
  if (!isStableStageInputMode_()) return;
  handleEntryInputStageViewportChange_();
  window.setTimeout(function() {
    handleEntryInputStageViewportChange_();
  }, 120);
}

function handleEntryInputStageFieldBlur_() {
  window.setTimeout(function() {
    closeEntryInputStageSuggestions_();
  }, 120);
  if (!isStableStageInputMode_()) return;
  handleEntryInputStageViewportChange_();
}

  document.body.style.position = '';
  document.body.style.left = '';
  document.body.style.right = '';
  document.body.style.width = '';
  if (window.innerWidth > 768) return;
  if (isStableStageInputMode_()) return;
  let restoreY = entryStageBodyLockScrollY_;
  if (top) {
    const parsed = Math.abs(parseInt(top, 10));
    if (Number.isFinite(parsed)) {
      restoreY = parsed;
    }
  }
  window.scrollTo(0, restoreY);
  entryStageBodyLockScrollY_ = 0;
}

function closeEntryInputStage_() {
  entryInputStageState_.active = false;
  entryInputStageState_.scope = 'product';
  entryInputStageState_.currentRow = -1;
  entryInputStageState_.expenseIdx = -1;
  entryInputStageState_.step = 'name';
  entryInputStageState_.tempData = null;
  entryInputStageState_.originRect = null;
  closeEntryInputStageSuggestions_();
  unlockEntryStageBodyForMobile_();
  document.body.classList.remove('entry-stage-active');
  document.body.classList.remove('entry-stage-mobile');
  const stageEl = document.getElementById('entry-input-stage');
  if (!stageEl) return;
  stageEl.classList.remove('is-open');
  stageEl.style.display = 'none';
  stageEl.style.removeProperty('inset');
  stageEl.style.removeProperty('left');
  stageEl.style.removeProperty('top');
  stageEl.style.removeProperty('width');
  stageEl.style.removeProperty('height');
  stageEl.style.setProperty('--entry-stage-height', '100dvh');
  stageEl.innerHTML = '';
}

function renderEntryInputStage_() {
  const stageEl = document.getElementById('entry-input-stage');
  if (!stageEl) return;
  if (!entryInputStageState_.active) {
    closeEntryInputStage_();
    return;
  }

  const scope = normalizeEntryInputStageScope_(entryInputStageState_.scope);
  entryInputStageState_.scope = scope;
  const step = normalizeEntryInputStageStep_(scope, entryInputStageState_.step);
  entryInputStageState_.step = step;
  if (scope === 'product') {
    if (entryInputStageState_.currentRow < 0 || entryInputStageState_.currentRow >= entryRows.length) {
      closeEntryInputStage_();
      return;
    }
  }
  if (scope === 'expense') {
    if (entryInputStageState_.expenseIdx < 0 || entryInputStageState_.expenseIdx >= expenseList.length) {
      closeEntryInputStage_();
      return;
    }
  }
  if (scope === 'lineItem') {
    if (entryInputStageState_.currentRow < 0 || entryInputStageState_.currentRow >= entryRows.length) {
      closeEntryInputStage_();
      return;
    }
  }
  if (scope === 'common') {
    const isPaymentField = step === 'payment';
    if (isPaymentField && isLineItemIndividualMode_()) {
      closeEntryInputStage_();
      return;
    }
  }

  const label = getEntryInputStageLabel_(scope, step);
  const actionLabel = getEntryInputStageActionLabel_(scope, step);
  const value = escapeHtml(getEntryInputStageValue_(scope, step));
  const placeholder = getEntryInputStagePlaceholder_(scope, step);
  const inputClass = getEntryInputStageInputClass_(scope, step);
  const inputAttrs = getEntryInputStageInputAttrs_(scope, step);
  const fieldHtml = buildEntryInputStageFieldHtml_(scope, step, inputClass, inputAttrs, value, placeholder);

  stageEl.innerHTML = `
    <div class="entry-input-stage-panel" role="group" aria-label="${label}">
      <div class="entry-input-stage-head">
        <label class="entry-input-stage-label" for="entry-input-stage-field">${label}</label>
        <button type="button" class="entry-input-stage-close" aria-label="ステージ入力を閉じる" onclick="closeEntryInputStage_()">×</button>
      </div>
      ${fieldHtml}
      <div class="entry-input-stage-actions">
        <button type="button" class="btn-sub" onclick="onEntryInputStageBack()">戻る</button>
        <button type="button" class="btn-main" onclick="onEntryInputStageAction()">${actionLabel}</button>
      </div>
    </div>
  `;
  updateEntryInputStageSuggestions_(scope, step, getEntryInputStageValue_(scope, step), { resetActive: true });
  if (isEntryInputStageDateField_(scope, step)) syncEntryInputStageDatePicker_();
  applyEntryInputStagePosition_(stageEl);
  stageEl.style.display = 'flex';
  stageEl.classList.add('is-open');
  lockEntryStageBodyForMobile_();
  document.body.classList.add('entry-stage-active');
  document.body.classList.toggle('entry-stage-mobile', isStableStageInputMode_() && window.innerWidth <= 768);
  focusEntryInputStage_();
}

function onEntryInputStageInput(value) {
  if (!entryInputStageState_.active) return;
  const scope = normalizeEntryInputStageScope_(entryInputStageState_.scope);
  const step = normalizeEntryInputStageStep_(scope, entryInputStageState_.step);
  const nextValue = String(value || '');
  setEntryInputStageValue_(scope, step, nextValue);
  updateEntryInputStageSuggestions_(scope, step, nextValue, { resetActive: true });
  if (scope === 'template' && step === 'name') {
    const exact = (entryProductTemplateState_.list || []).some(function(item) {
      return String(item && item.templateName || '').trim() === nextValue.trim();
    });
    if (exact) {
      applySelectedProductTemplateByName_(nextValue);
      closeEntryInputStage_();
    }
  }
}

function onEntryInputStageItemDiscountInput(value) {
  if (!entryInputStageState_.active) return;
  const scope = normalizeEntryInputStageScope_(entryInputStageState_.scope);
  const step = normalizeEntryInputStageStep_(scope, entryInputStageState_.step);
  if (!(scope === 'product' && step === 'price')) return;
  setEntryInputStageValue_('product', 'itemDiscount', String(value || ''));
}

function onEntryInputStageItemDiscountKeydown(event) {
  if (!event || event.key !== 'Enter') return;
  event.preventDefault();
  onEntryInputStageAction();
}

function onEntryInputStageKeydown(event) {
  if (!event) return;
  if (event.key === 'ArrowDown') {
    if (moveEntryInputStageSuggestionSelection_(1)) {
      event.preventDefault();
      return;
    }
  }
  if (event.key === 'ArrowUp') {
    if (moveEntryInputStageSuggestionSelection_(-1)) {
      event.preventDefault();
      return;
    }
  }
  if (event.key === 'Escape') {
    if (entryInputStageSuggestionVisible_) {
      event.preventDefault();
      closeEntryInputStageSuggestions_();
      return;
    }
  }
  if (event.key !== 'Enter') return;
  if (entryInputStageSuggestionVisible_ && entryInputStageSuggestionActiveIndex_ >= 0 && entryInputStageSuggestionActiveIndex_ < entryInputStageSuggestions_.length) {
    event.preventDefault();
    onEntryInputStageSuggestionPick(entryInputStageSuggestionActiveIndex_);
    return;
  }
  event.preventDefault();
  onEntryInputStageAction();
}

function commitEntryInputStageStep_() {
  if (!entryInputStageState_.active) return;
  const scope = normalizeEntryInputStageScope_(entryInputStageState_.scope);
  const step = normalizeEntryInputStageStep_(scope, entryInputStageState_.step);
  const inputEl = document.getElementById('entry-input-stage-field');
  const value = inputEl ? String(inputEl.value || '') : getEntryInputStageValue_(scope, step);
  setEntryInputStageValue_(scope, step, value);

  if (scope === 'template') {
    const normalizedValue = String(value || '').trim();
    setEntryInputStageValue_(scope, 'name', normalizedValue);
    applySelectedProductTemplateByName_(normalizedValue);
    return;
  }

  if (scope === 'product') {
    const idx = entryInputStageState_.currentRow;
    const row = entryRows[idx];
    if (!row) return;
    if (step === 'name') {
      onProductInput(idx, value);
      return;
    }
    if (step === 'price') {
      const itemDiscountEl = document.getElementById('entry-input-stage-item-discount');
      const itemDiscountValue = itemDiscountEl
        ? String(itemDiscountEl.value || '')
        : getEntryInputStageValue_('product', 'itemDiscount');
      setEntryInputStageValue_('product', 'itemDiscount', itemDiscountValue);
      row.price = Math.max(0, roundYen(value));
      row.itemDiscount = Math.max(0, roundYen(itemDiscountValue));
      recalculateCosts();
      return;
    }
    onQtyInput(idx, value);
    return;
  }

  if (scope === 'expense') {
    const idx = entryInputStageState_.expenseIdx;
    const row = expenseList[idx];
    if (!row) return;
    if (step === 'name') {
      onExpenseNameInput(idx, value);
      renderExpenseArea();
      return;
    }
    onExpenseAmountBlur(idx, value);
    renderExpenseArea();
    return;
  }

  if (scope === 'lineItem') {
    const idx = entryInputStageState_.currentRow;
    const row = entryRows[idx];
    if (!row) return;
    if (step === 'point') {
      onPointInput(idx, value);
      return;
    }
    if (step === 'expense') {
      onExpenseAllocInput(idx, value);
      return;
    }
    onRowPaymentInput(idx, value);
    return;
  }

  if (scope === 'common') {
    const target = normalizeEntryInputStageStep_('common', step);
    const normalizedValue = target === 'date'
      ? normalizeDateDigits_(value)
      : String(value || '').trim();
    setEntryInputStageValue_(scope, target, normalizedValue);
    if (target === 'date') {
      const dateInput = document.getElementById('common-date');
      if (dateInput) dateInput.value = normalizedValue;
      syncDatePickerFromText_('common-date', 'common-date-picker');
      return;
    }
    if (target === 'supplier') {
      const supplierInput = document.getElementById('common-supplier');
      if (supplierInput) supplierInput.value = normalizedValue;
      return;
    }
    const paymentInput = document.getElementById('common-payment');
    if (paymentInput) paymentInput.value = normalizedValue;
    return;
  }

  pointTotal = Math.max(0, roundYen(value || 0));
  recalculateCosts();
  renderPointArea();
}

function onEntryInputStageAction() {
  if (!entryInputStageState_.active) return;
  const scope = normalizeEntryInputStageScope_(entryInputStageState_.scope);
  const step = normalizeEntryInputStageStep_(scope, entryInputStageState_.step);
  if (scope === 'template') {
    const inputEl = document.getElementById('entry-input-stage-field');
    const nextName = String(inputEl && inputEl.value || '').trim();
    if (!nextName) {
      applySelectedProductTemplateByName_('');
      closeEntryInputStage_();
      return;
    }
    const exact = (entryProductTemplateState_.list || []).some(function(item) {
      return String(item && item.templateName || '').trim() === nextName;
    });
    if (!exact) {
      alert('候補からテンプレートを選択してください。');
      return;
    }
    commitEntryInputStageStep_();
    closeEntryInputStage_();
    return;
  }
  commitEntryInputStageStep_();

  if (scope === 'product') {
    if (step === 'name') {
      entryInputStageState_.step = 'price';
      renderEntryInputStage_();
      return;
    }
    if (step === 'price') {
      entryInputStageState_.step = 'qty';
      renderEntryInputStage_();
      return;
    }
    closeEntryInputStage_();
    return;
  }

  if (scope === 'expense') {
    if (step === 'name') {
      entryInputStageState_.step = 'amount';
      renderEntryInputStage_();
      return;
    }
    closeEntryInputStage_();
    return;
  }

  if (scope === 'lineItem') {
    if (step === 'point') {
      entryInputStageState_.step = 'expense';
      renderEntryInputStage_();
      return;
    }
    if (step === 'expense') {
      entryInputStageState_.step = 'payment';
      renderEntryInputStage_();
      return;
    }
    closeEntryInputStage_();
    return;
  }

  if (scope === 'common') {
    if (step === 'date') {
      entryInputStageState_.step = 'supplier';
      renderEntryInputStage_();
      return;
    }
    if (step === 'supplier' && !isLineItemIndividualMode_()) {
      entryInputStageState_.step = 'payment';
      renderEntryInputStage_();
      return;
    }
    closeEntryInputStage_();
    return;
  }

  closeEntryInputStage_();
}

function onEntryInputStageBack() {
  if (!entryInputStageState_.active) return;
  const scope = normalizeEntryInputStageScope_(entryInputStageState_.scope);
  const step = normalizeEntryInputStageStep_(scope, entryInputStageState_.step);

  if (scope === 'template') {
    closeEntryInputStage_();
    return;
  }

  if (scope === 'product') {
    if (step === 'qty') {
      entryInputStageState_.step = 'price';
      renderEntryInputStage_();
      return;
    }
    if (step === 'price') {
      entryInputStageState_.step = 'name';
      renderEntryInputStage_();
      return;
    }
    closeEntryInputStage_();
    return;
  }

  if (scope === 'expense') {
    if (step === 'amount') {
      entryInputStageState_.step = 'name';
      renderEntryInputStage_();
      return;
    }
    closeEntryInputStage_();
    return;
  }

  if (scope === 'lineItem') {
    if (step === 'payment') {
      entryInputStageState_.step = 'expense';
      renderEntryInputStage_();
      return;
    }
    if (step === 'expense') {
      entryInputStageState_.step = 'point';
      renderEntryInputStage_();
      return;
    }
    closeEntryInputStage_();
    return;
  }

  if (scope === 'common') {
    if (step === 'payment') {
      entryInputStageState_.step = 'supplier';
      renderEntryInputStage_();
      return;
    }
    if (step === 'supplier') {
      entryInputStageState_.step = 'date';
      renderEntryInputStage_();
      return;
    }
    closeEntryInputStage_();
    return;
  }

  closeEntryInputStage_();
}

function createEmptyExpenseRow() {
  return {
    name: '',
    amount: '',
    memo: ''
  };
}

function toNumber(v) {
  const n = Number(v);
  return Number.isFinite(n) ? n : 0;
}

function roundYen(v) {
  return Math.round(toNumber(v));
}

function escapeHtml(value) {
  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function formatWithComma_(value) {
  return String(Math.round(toNumber(value))).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

function formatYen_(value) {
  return formatWithComma_(value) + '円';
}

function getQueryParam_(name) {
  try {
    const url = new URL(window.location.href);
    return String(url.searchParams.get(name) || '').trim();
  } catch (err) {
    const query = String(window.location.search || '').replace(/^\?/, '');
    if (!query) return '';
    const pairs = query.split('&');
    for (let i = 0; i < pairs.length; i++) {
      const parts = pairs[i].split('=');
      if (decodeURIComponent(parts[0] || '') !== String(name || '')) continue;
      return decodeURIComponent(parts[1] || '').trim();
    }
    return '';
  }
}

function buildWebAppPageUrl_(page, params) {
  try {
    const url = new URL(window.location.href);
    url.searchParams.set('page', String(page || 'entry'));
    const p = params || {};
    Object.keys(p).forEach(key => {
      if (p[key] === undefined || p[key] === null || String(p[key]).trim() === '') {
        url.searchParams.delete(key);
        return;
      }
      url.searchParams.set(key, String(p[key]));
    });
    return url.toString();
  } catch (err) {
    const p = params || {};
    const query = ['page=' + encodeURIComponent(String(page || 'entry'))];
    Object.keys(p).forEach(key => {
      if (p[key] === undefined || p[key] === null || String(p[key]).trim() === '') return;
      query.push(encodeURIComponent(key) + '=' + encodeURIComponent(String(p[key])));
    });
    return String(window.location.pathname || '') + '?' + query.join('&');
  }
}

function isPointAllocationMode_() {
  return pointInputMode !== 'individual';
}

function isExpenseAllocationMode_() {
  return expenseInputMode !== 'individual';
}

function isLineItemIndividualMode_() {
  return !isPointAllocationMode_() && !isExpenseAllocationMode_();
}

function isVerticalConfirmLayout_() {
  return true;
}

function getPointModeLabel_() {
  return isPointAllocationMode_() ? '分配モード' : '個別入力モード';
}

function getExpenseModeLabel_() {
  return isExpenseAllocationMode_() ? '分配モード' : '個別入力モード';
}

  detailPanelState = {
    expense: false,
    point: false,
    tax: false
  };
  applyDetailPanelVisibility_();
  updateTopHelperButtons_();
}

function applyDetailPanelVisibility_() {
  const expenseEl = document.getElementById('expense-area');
  const pointEl = document.getElementById('point-area');
  if (!expenseEl || !pointEl) return;
  expenseEl.style.display = detailPanelState.expense ? 'block' : 'none';
  pointEl.style.display = detailPanelState.point ? 'block' : 'none';
}

function toggleExpensePanelVisibility_() {
  detailPanelState.expense = !detailPanelState.expense;
  renderExpenseArea();
}

function togglePointPanelVisibility_() {
  detailPanelState.point = !detailPanelState.point;
  renderPointArea();
}

function updateTopHelperButtons_() {
  const individualBtn = document.getElementById('helper-individual-btn');
  const taxBtn = document.getElementById('helper-tax-btn');
  const footerHomeBtn = document.getElementById('footer-home-btn');
  const footerDisplayBtn = document.getElementById('footer-display-btn');
  const footerDetailBtn = document.getElementById('footer-detail-btn');
  const footerTaxBtn = document.getElementById('footer-tax-btn');
  const footerIndividualBtn = document.getElementById('footer-individual-btn');
  const isIndividual = isLineItemIndividualMode_();
  const detailsOpen = !!detailPanelState.expense || !!detailPanelState.point;
  const currentScreen = String(document.body.getAttribute('data-entry-screen') || 'entry').trim() || 'entry';

  if (individualBtn) {
    individualBtn.textContent = '個別モード：' + (isIndividual ? 'ON' : 'OFF');
    individualBtn.classList.toggle('is-open', isIndividual);
    individualBtn.setAttribute('aria-pressed', isIndividual ? 'true' : 'false');
  }
  if (taxBtn) {
    taxBtn.textContent = '外税：' + (detailPanelState.tax ? 'ON' : 'OFF');
    taxBtn.classList.toggle('is-open', detailPanelState.tax);
    taxBtn.classList.toggle('is-on', detailPanelState.tax);
    taxBtn.setAttribute('aria-pressed', detailPanelState.tax ? 'true' : 'false');
  }

  if (footerHomeBtn) {
    footerHomeBtn.classList.toggle('is-active', currentScreen === 'entry');
    footerHomeBtn.setAttribute('aria-pressed', currentScreen === 'entry' ? 'true' : 'false');
  }
  if (footerDisplayBtn) {
    footerDisplayBtn.classList.remove('is-active');
    footerDisplayBtn.setAttribute('aria-pressed', 'false');
    footerDisplayBtn.setAttribute('title', '表示設定（準備中）');
  }
  if (footerDetailBtn) {
    footerDetailBtn.classList.toggle('is-active', detailsOpen);
    footerDetailBtn.setAttribute('aria-pressed', detailsOpen ? 'true' : 'false');
    footerDetailBtn.setAttribute('title', detailsOpen ? '経費/ポイントを閉じる' : '経費/ポイントを開く');
  }
  if (footerTaxBtn) {
    footerTaxBtn.classList.toggle('is-active', detailPanelState.tax);
    footerTaxBtn.setAttribute('aria-pressed', detailPanelState.tax ? 'true' : 'false');
  }
  if (footerIndividualBtn) {
    footerIndividualBtn.classList.toggle('is-active', isIndividual);
    footerIndividualBtn.setAttribute('aria-pressed', isIndividual ? 'true' : 'false');
  }
}

function setLineItemIndividualMode_(enabled) {
  const wasLineItemIndividualMode = isLineItemIndividualMode_();
  const currentDate = normalizeDateDigits_(String((document.getElementById('common-date') && document.getElementById('common-date').value) || '').trim());
  const currentSupplier = String((document.getElementById('common-supplier') && document.getElementById('common-supplier').value) || '').trim();
  const currentPayment = String((document.getElementById('common-payment') && document.getElementById('common-payment').value) || '').trim();

  const shouldUseIndividual = !!enabled;
  if (!wasLineItemIndividualMode && shouldUseIndividual) {
    commonPaymentCache = currentPayment;
  }
  pointInputMode = shouldUseIndividual ? 'individual' : 'allocation';
  expenseInputMode = shouldUseIndividual ? 'individual' : 'allocation';

  if (shouldUseIndividual) {
    entryRows.forEach(function(row) {
      row.point = 0;
      row.expenseAlloc = 0;
    });
    detailPanelState.expense = false;
    detailPanelState.point = false;
  } else {
    pointTotal = entryRows.reduce(function(sum, row) {
      if (!String(row.name || '').trim() || roundYen(row.price) <= 0) return sum;
      return sum + Math.max(0, roundYen(row.point || 0));
    }, 0);
  }

  recalculateCosts();
  renderPointArea();
  renderExpenseArea();
  renderCommonInfo();
  const dateInput = document.getElementById('common-date');
  const datePicker = document.getElementById('common-date-picker');
  const supplierInput = document.getElementById('common-supplier');
  const paymentInput = document.getElementById('common-payment');
  if (dateInput) dateInput.value = currentDate;
  if (dateInput && datePicker) syncDatePickerFromText_('common-date', 'common-date-picker');
  if (supplierInput) supplierInput.value = currentSupplier;
  if (paymentInput) {
    paymentInput.value = shouldUseIndividual ? '' : (currentPayment || commonPaymentCache);
  }
  updateTopHelperButtons_();
}

function handleIndividualModeToggleClick() {
  const nextIndividual = !isLineItemIndividualMode_();
  const nextLabel = nextIndividual ? 'ON' : 'OFF';
  const shouldSwitch = confirm('個別モードを「' + nextLabel + '」に切り替えますか？');
  if (!shouldSwitch) return;
  setLineItemIndividualMode_(nextIndividual);
  applyDetailPanelVisibility_();
}

function handleExpenseToggleClick() {
  handleIndividualModeToggleClick();
}

function handlePointToggleClick() {
  handleIndividualModeToggleClick();
}

function handleTaxToggleClick() {
  if (!detailPanelState.tax) {
    const shouldApply = confirm('外税を適用しますか？');
    if (!shouldApply) return;
    const applied = applyTaxToAll_();
    if (!applied) return;
    detailPanelState.tax = true;
    updateTopHelperButtons_();
    return;
  }

  const shouldRemove = confirm('外税を解除しますか？');
  if (!shouldRemove) return;
  removeTaxFromAll_();
  detailPanelState.tax = false;
  updateTopHelperButtons_();
}

function loadProductCandidates() {
  const ticket = beginEntryAsyncStatus_('Now Loading...');
  google.script.run
    .withSuccessHandler(function(list) {
      productCandidates = Array.isArray(list) ? list : [];
      const dl = document.getElementById('product-options');
      if (dl) {
        dl.innerHTML = productCandidates
          .map(item => `<option value="${escapeHtml(item.label || '')}"></option>`)
          .join('');
      }
      renderEntryRows();
      endEntryAsyncStatus_(ticket);
    })
    .withFailureHandler(function(err) {

function resolveProductByInput(input) {
  const text = String(input || '').trim();
  if (!text) return null;

  for (let i = 0; i < productCandidates.length; i++) {
    const item = productCandidates[i];
    const label = String(item.label || '').trim();
    const no = String(item.productNo || '').trim();
    const jan = String(item.jan || '').trim();
    const name = String(item.name || '').trim();
    if (text === label || text === name || (no && text === no) || (jan && text === jan)) {
      return {
        productNo: no,
        name: name,
        label: label || name,
        isKnown: true
      };
    }
  }

  const split = text.split('：');
  if (split.length >= 2) {
    const tokenPart = split[0].trim();
    const namePart = split.slice(1).join('：').trim();
    for (let j = 0; j < productCandidates.length; j++) {
      const item2 = productCandidates[j];
      const itemNo = String(item2.productNo || '').trim();
      const itemJan = String(item2.jan || '').trim();
      if ((itemNo === tokenPart || itemJan === tokenPart) && String(item2.name || '').trim() === namePart) {
        return {
          productNo: itemNo,
          name: namePart,
          label: String(item2.label || text),
          isKnown: true
        };
      }
    }
  }

  return {
    productNo: '',
    name: text,
    label: text,
    isKnown: false
  };
}

function onProductInput(idx, value) {
  const row = entryRows[idx];
  if (!row) return;

  row.productInput = String(value || '').trim();
  const matched = resolveProductByInput(row.productInput);
  if (!matched) {
    row.productNo = '';
    row.name = '';
  } else {
    row.productNo = matched.productNo;
    row.name = matched.name;
  }
  recalculateCosts();
}

function recalculateCostsWithFocusId_(focusId, cursorPos) {
  recalculateCosts();
  if (!focusId) return;
  window.setTimeout(function() {
    const el = document.getElementById(String(focusId));
    if (!el) return;
    try {
      el.focus({ preventScroll: true });
    } catch (err) {
      try {
        el.focus();
      } catch (err2) {
        // no-op
      }
    }
    if (typeof cursorPos === 'number' && typeof el.setSelectionRange === 'function') {
      const len = String(el.value || '').length;
      const pos = Math.max(0, Math.min(cursorPos, len));
      try {
        el.setSelectionRange(pos, pos);
      } catch (err3) {
        // no-op
      }
    }
  }, 0);
}

  entryRows.splice(pos, 0, createEmptyEntryRow());
  if (entryInputStageState_.active && entryInputStageState_.currentRow >= pos) {
    entryInputStageState_.currentRow += 1;
  }
  renderEntryRows();
  recalculateCosts();

function removeEntryRow(idx) {
  const removingActive = entryInputStageState_.active && entryInputStageState_.currentRow === idx;
  if (entryRows.length <= 1) {
    entryRows[0] = createEmptyEntryRow();
    if (removingActive) {
      closeEntryInputStage_();
    }
  } else {
    entryRows.splice(idx, 1);
    if (removingActive) {
      closeEntryInputStage_();
    } else if (entryInputStageState_.active && entryInputStageState_.currentRow > idx) {
      entryInputStageState_.currentRow -= 1;
    }
  }
  if (entryRows.length <= 1) {
    entryRowDeleteMode_ = false;

  renderEntryRows();
  recalculateCosts();
}

function applyProductTemplateInputValues_(inputValues) {
  const values = inputValues || {};
  const templateRows = Array.isArray(values.entryRows) ? values.entryRows : [];
  entryRows = templateRows.map(function(raw) {
    const r = createEmptyEntryRow();
    const src = raw || {};
    r.productInput = String(src.productInput || '').trim();
    r.price = Math.max(0, roundYen(src.priceBase || 0));
    r.qty = Math.max(1, roundYen(src.qty || 1));
    r.itemDiscount = Math.max(0, roundYen(src.itemDiscount || 0));
    r.point = Math.max(0, roundYen(src.point || 0));
    r.expenseAlloc = Math.max(0, roundYen(src.expenseAlloc || 0));
    r.paymentMethod = String(src.paymentMethod || '').trim();
    const resolved = resolveProductByInput(r.productInput);
    if (resolved) {
      r.productNo = String(resolved.productNo || '').trim();
      r.name = String(resolved.name || '').trim();
    }
    return r;
  });
  if (!entryRows.length) {
    entryRows = [createEmptyEntryRow()];
  }
  const templateExpenses = Array.isArray(values.expenseList) ? values.expenseList : [];
  expenseList = templateExpenses.map(function(ex) {
    const src = ex || {};
    return {
      name: String(src.name || '').trim(),
      amount: Math.max(0, roundYen(src.amount || 0)),
      memo: String(src.memo || '').trim()
    };
  });
  if (!expenseList.length) {
    expenseList = [createEmptyExpenseRow()];
  }
  pointTotal = Math.max(0, roundYen(values.pointTotal || 0));
  pointInputMode = String(values.pointMode || 'allocation') === 'individual' ? 'individual' : 'allocation';
  expenseInputMode = String(values.expenseMode || 'allocation') === 'individual' ? 'individual' : 'allocation';
  detailPanelState.expense = false;
  detailPanelState.point = false;
  detailPanelState.tax = false;
  recalculateCosts();
  if (values.taxEnabled) {
    const hasTaxTargets = entryRows.some(function(row) {
      return !!String(row && row.name || '').trim() && roundYen(row && row.price || 0) > 0;
    });
    if (hasTaxTargets) {
      applyTaxToAll_();
    }
    detailPanelState.tax = true;
  }
  renderEntryRows();
  renderExpenseArea();
  renderPointArea();
  renderSummary();
  renderCommonInfo();
  const info = values.commonInfo || {};
  const dateInput = document.getElementById('common-date');
  const supplierInput = document.getElementById('common-supplier');
  const paymentInput = document.getElementById('common-payment');
  if (dateInput) dateInput.value = normalizeDateDigits_(String(info.date || '').trim());
  if (supplierInput) supplierInput.value = String(info.supplier || '').trim();
  if (paymentInput) paymentInput.value = String(info.payment || '').trim();
  applyDetailPanelVisibility_();
  updateTopHelperButtons_();
}

function getActiveEntryRows() {
  const lineItemIndividualMode = isLineItemIndividualMode_();
  const active = [];
  for (let i = 0; i < entryRows.length; i++) {
    const row = entryRows[i];
    const hasAnyInput = !!String(row.productInput || '').trim() || roundYen(row.price) > 0;
    if (!hasAnyInput) continue;

    if (!String(row.name || '').trim()) {
      throw new Error(`商品${i + 1} の商品名を入力してください`);
    }
    if (roundYen(row.price) <= 0) {
      throw new Error(`商品${i + 1} の基準売価を入力してください`);
    }
    if (roundYen(row.qty) <= 0) {
      throw new Error(`商品${i + 1} の個数を入力してください`);
    }
    if (lineItemIndividualMode && !String(row.paymentMethod || '').trim()) {
      throw new Error(`商品${i + 1} の支払い方法を入力してください`);
    }

    active.push(row);
  }
  if (!active.length) {
    throw new Error('商品行が空です');
  }
  return active;
}

function getActiveExpenseRows_() {
  return expenseList.filter(ex => String(ex.name || '').trim() && roundYen(ex.amount) > 0);
}

function recalculateCosts() {
  const pointAllocation = isPointAllocationMode_();
  const expenseAllocation = isExpenseAllocationMode_();
  const taxEnabled = !!detailPanelState.tax;
  const taxRate = taxEnabled ? Math.max(0, getTaxRate_()) : 0;

  entryRows.forEach(row => {
    row.price = Math.max(0, roundYen(row.price));
    row.itemDiscount = Math.max(0, roundYen(row.itemDiscount || 0));
    if (row.itemDiscount > row.price) {
      row.itemDiscount = row.price;
    }
    row.qty = Math.max(1, roundYen(row.qty || 1));
    if (pointAllocation) {
      row.point = 0;
    } else {
      row.point = Math.max(0, roundYen(row.point || 0));
    }
    if (expenseAllocation) {
      row.expenseAlloc = 0;
    } else {
      row.expenseAlloc = Math.max(0, roundYen(row.expenseAlloc || 0));
    }
    const unitAfterItemDiscount = Math.max(0, row.price - row.itemDiscount);
    const lineBase = Math.max(0, roundYen(unitAfterItemDiscount * row.qty));
    const lineAfterTax = taxEnabled ? Math.max(0, Math.floor(lineBase * (1 + taxRate))) : lineBase;
    row.grossPrice = lineAfterTax;
    row.taxAmount = Math.max(0, lineAfterTax - lineBase);
    row.baseCost = lineAfterTax;
    row.cost = lineAfterTax;
    row.unitPrice = row.qty > 0 ? Math.round(row.cost / row.qty) : row.cost;
  });

  const targetRows = entryRows.filter(row => String(row.name || '').trim() && row.price > 0);
  if (!targetRows.length) {
    renderEntryRows();
    if (!pointAllocation) {
      renderPointArea();
    }
    renderSummary();
    return;
  }

  if (pointAllocation) {
    pointTotal = Math.max(0, roundYen(pointTotal || 0));
    const totalPrice = targetRows.reduce((sum, row) => sum + roundYen(row.grossPrice || 0), 0);
    let remainPoint = pointTotal;

    targetRows.forEach((row, idx) => {
      let pointAlloc = 0;
      if (totalPrice > 0 && remainPoint > 0) {
        if (idx === targetRows.length - 1) {
          pointAlloc = remainPoint;
        } else {
          pointAlloc = Math.round(pointTotal * ((row.grossPrice || 0) / totalPrice));
          pointAlloc = Math.min(pointAlloc, remainPoint);
        }
      }
      remainPoint -= pointAlloc;
      row.point = pointAlloc;
      row.baseCost = Math.max(0, roundYen(row.grossPrice || 0) - pointAlloc);
    });
  } else {
    targetRows.forEach(row => {
      row.point = Math.max(0, roundYen(row.point || 0));
      row.baseCost = Math.max(0, roundYen(row.grossPrice || 0) - row.point);
    });
    pointTotal = targetRows.reduce((sum, row) => sum + roundYen(row.point), 0);
  }

  const totalExpenseInput = getActiveExpenseRows_().reduce((sum, ex) => sum + roundYen(ex.amount), 0);
  if (expenseAllocation) {
    const totalBaseCost = targetRows.reduce((sum, row) => sum + roundYen(row.baseCost), 0);
    let remainExpense = totalExpenseInput;

    targetRows.forEach((row, idx) => {
      let alloc = 0;
      if (totalExpenseInput > 0 && totalBaseCost > 0) {
        if (idx === targetRows.length - 1) {
          alloc = remainExpense;
        } else {
          alloc = Math.round(totalExpenseInput * (row.baseCost / totalBaseCost));
          alloc = Math.min(alloc, remainExpense);
        }
      }
      remainExpense -= alloc;
      row.expenseAlloc = alloc;
      row.cost = Math.max(0, roundYen(row.baseCost) + alloc);
      row.unitPrice = row.qty > 0 ? Math.round(row.cost / row.qty) : row.cost;
    });
  } else {
    targetRows.forEach(row => {
      row.expenseAlloc = Math.max(0, roundYen(row.expenseAlloc || 0));
      row.cost = Math.max(0, roundYen(row.baseCost) + row.expenseAlloc);
      row.unitPrice = row.qty > 0 ? Math.round(row.cost / row.qty) : row.cost;
    });
  }

  renderEntryRows();
  if (!pointAllocation) {
    renderPointArea();
  }
  renderSummary();
}

function getTaxRate_() {
  const rateInput = document.getElementById('tax-rate');
  return toNumber((rateInput && rateInput.value) || '10') / 100;
}

function applyTaxToAll_() {
  const targets = entryRows.filter(row => String(row.name || '').trim() && roundYen(row.price) > 0);
  if (!targets.length) {
    alert('税加算対象の商品がありません');
    return false;
  }
  // 再計算前に外税フラグをONにして、適用方向の計算を確実に行う
  detailPanelState.tax = true;
  recalculateCosts();
  return true;
}

function removeTaxFromAll_() {
  // 再計算前に外税フラグをOFFにして、解除方向の計算を確実に行う
  detailPanelState.tax = false;
  recalculateCosts();
}

  }, 0);
  if (!isPointAllocationMode_()) {
    pointTotal = pointTotalFromRows;
  }

  const pointPanelOpen = !!detailPanelState.point;
  if (entryInputStageState_.active && entryInputStageState_.scope === 'point' && !pointPanelOpen) {
    closeEntryInputStage_();
  }
  const pointToggleBtnClass = pointPanelOpen ? 'btn-icon btn-icon-minus panel-head-toggle' : 'btn-icon btn-icon-plus panel-head-toggle';
  const pointToggleLabel = pointPanelOpen ? 'ポイント入力エリアを閉じる' : 'ポイント入力エリアを開く';
  let modeContent = '';
  if (pointPanelOpen && isPointAllocationMode_()) {
    modeContent = `
      <div class="entry-line-card section-card section-tone-point">
        <div class="point-input-row b-panel-input-row">
          <input type="text" id="point-total-display" class="inline-number point-stage-trigger entry-stage-trigger" inputmode="numeric" pattern="\\d*" value="${pointTotal || ''}" readonly onfocus="this.blur(); openPointInputStage(this)" onclick="openPointInputStage(this)" aria-label="ポイント/割引入力">
          <span class="point-input-unit">pt / 円</span>
        </div>
      </div>
    `;
  } else if (pointPanelOpen) {
    modeContent = `
      <div class="entry-line-card section-card section-tone-point">
        <div class="entry-line-title">ポイント個別入力</div>
        <div class="note-text">商品入力テーブルの2行目（補助情報）で入力してください。</div>
        <div class="note-text b-panel-note">現在のポイント合計: ${formatYen_(pointTotalFromRows)}</div>
      </div>
    `;
  } else {
    modeContent = '';

  const headerHtml = '<h2 class="mid-title panel-head-title">ポイント/割引</h2>';

  const pointAlignedContent = modeContent

  updateTopHelperButtons_();
}

function updatePointTotal() {
  const input = document.getElementById('point-total') || document.getElementById('point-total-display');
  if (!input) return;
  pointTotal = Math.max(0, roundYen(input.value || 0));
  recalculateCosts();
}

function onPointModeChange(mode) {
  const useIndividual = String(mode || 'allocation') === 'individual';
  setLineItemIndividualMode_(useIndividual);
}

function renderExpenseArea() {
  if (!expenseList.length) {
    expenseList = [createEmptyExpenseRow()];
  }
  const canDeleteExpenseRows = expenseList.length > 1;
  if (!canDeleteExpenseRows && expenseRowDeleteMode_) {
    expenseRowDeleteMode_ = false;
  }
  if (entryInputStageState_.active && entryInputStageState_.scope === 'expense') {
    if (entryInputStageState_.expenseIdx < 0 || entryInputStageState_.expenseIdx >= expenseList.length) {
      closeEntryInputStage_();
    }
  }
  const expensePanelOpen = !!detailPanelState.expense;
  if (entryInputStageState_.active && entryInputStageState_.scope === 'expense' && !expensePanelOpen) {
    closeEntryInputStage_();
  }
  const expenseToggleBtnClass = expensePanelOpen ? 'btn-icon btn-icon-minus panel-head-toggle' : 'btn-icon btn-icon-plus panel-head-toggle';
  const expenseToggleLabel = expensePanelOpen ? '経費入力エリアを閉じる' : '経費入力エリアを開く';
  const addExpenseButtonHtml = `<button type="button" class="btn-append-row" onclick="addExpenseRow(${Math.max(0, expenseList.length - 1)})" aria-label="経費行を追加">＋</button>`;
  const deleteExpenseModeClass = expenseRowDeleteMode_ ? 'btn-delete-mode is-active' : 'btn-delete-mode';
  const deleteExpenseButtonHtml = canDeleteExpenseRows
    ? `<button type="button" class="${deleteExpenseModeClass}" onclick="toggleExpenseRowDeleteMode()" aria-label="経費行削除モード切替">−</button>`
    : '';
  const expenseTitleActionsHtml = (expensePanelOpen && isExpenseAllocationMode_())
    ? `<div class="entry-lines-title-actions">${addExpenseButtonHtml}${deleteExpenseButtonHtml}</div>`
    : '';
  const expenseInputTotal = getActiveExpenseRows_().reduce((sum, ex) => sum + roundYen(ex.amount), 0);
  const expenseAllocTotal = entryRows.reduce((sum, row) => {
    if (!String(row.name || '').trim() || roundYen(row.price) <= 0) return sum;
    return sum + roundYen(row.expenseAlloc || 0);
  }, 0);
  let options = '';
  expenseCandidates.forEach(name => {
    options += `<option value="${escapeHtml(name)}"></option>`;
  });

  let rows = '';
  if (expensePanelOpen) {
    expenseList.forEach((ex, idx) => {
      const canRemoveRow = canDeleteExpenseRows && idx > 0;
      const rowClass = 'entry-main-row entry-swipe-delete-row';
      const removeBtn = (expenseRowDeleteMode_ && canRemoveRow)
        ? `<button type="button" class="entry-row-remove" onclick="removeExpenseRow(${idx})" aria-label="経費${idx + 1}を削除">−</button>`
        : '';
      rows += `
        <tr class="${rowClass}" data-expense-row-index="${idx}">
          <td class="col-item">
            <input type="text" class="inline-input entry-stage-trigger" list="expense-items" autocomplete="off" value="${escapeHtml(ex.name || '')}" readonly onfocus="this.blur(); openExpenseInputStage(${idx}, 'name', this)" onclick="openExpenseInputStage(${idx}, 'name', this)" placeholder="経費名">
          </td>
          <td class="col-num">
            <input type="text" class="inline-number entry-stage-trigger" inputmode="numeric" pattern="\\d*" value="${escapeHtml(ex.amount || '')}" readonly onfocus="this.blur(); openExpenseInputStage(${idx}, 'amount', this)" onclick="openExpenseInputStage(${idx}, 'amount', this)" placeholder="経費金額">
          </td>
          <td class="col-action">${removeBtn}</td>
        </tr>
      `;
    });
  }

  let modeContent = '';
  if (expensePanelOpen && isExpenseAllocationMode_()) {
    const expenseTableClass = 'entry-inline-table entry-expense-table entry-swipe-table' + (expenseRowDeleteMode_ ? ' is-delete-mode' : '');
    modeContent =
      `<datalist id="expense-items">${options}</datalist>` +
      `<div class="entry-line-card section-card section-tone-expense">` +
        `<table class="${expenseTableClass}">` +
          `<tr>` +
            `<th class="col-item">経費名</th>` +
            `<th class="col-num">金額</th>` +
            `<th class="col-action"></th>` +
          `</tr>` +
          rows +
        `</table>` +
      `</div>`;
  } else if (expensePanelOpen) {
    modeContent = `
      <div class="entry-line-card section-card section-tone-expense">
        <div class="entry-line-title">経費個別入力</div>
        <div class="note-text">商品入力テーブルの2行目（補助情報）で入力してください。</div>
        <div class="note-text b-panel-note">現在の経費反映合計: ${formatYen_(expenseAllocTotal)}</div>
      </div>
    `;
  } else {
    modeContent = '';
  }

  const headerHtml = `<div class="entry-lines-title-row"><h2 class="mid-title">経費</h2>${expenseTitleActionsHtml}</div>`;

  document.getElementById('expense-area').innerHTML = headerHtml + modeContent;
  applyDetailPanelVisibility_();
  updateTopHelperButtons_();
}

function cacheExpenseField(idx, key, value) {
  const row = expenseList[idx];
  if (!row) return;
  row[key] = String(value || '');
}

function onExpenseNameInput(idx, value) {
  const row = expenseList[idx];
  if (!row) return;
  row.name = String(value || '');
  recalculateCosts();
}

function onExpenseAmountInput(idx, value) {
  const row = expenseList[idx];
  if (!row) return;
  row.amount = String(value || '');
  recalculateCosts();
}

function onExpenseAmountBlur(idx, value) {
  const row = expenseList[idx];
  if (!row) return;
  row.amount = Math.max(0, roundYen(value));
  recalculateCosts();
}

function addExpenseRow(afterIdx) {
  const pos = Math.max(0, Math.min(afterIdx + 1, expenseList.length));
  expenseList.splice(pos, 0, createEmptyExpenseRow());
  if (entryInputStageState_.active && entryInputStageState_.scope === 'expense' && entryInputStageState_.expenseIdx >= pos) {
    entryInputStageState_.expenseIdx += 1;
  }
  renderExpenseArea();
}

function removeExpenseRow(idx) {
  const removingActive = entryInputStageState_.active &&
    entryInputStageState_.scope === 'expense' &&
    entryInputStageState_.expenseIdx === idx;
  if (expenseList.length <= 1) {
    expenseList[0] = createEmptyExpenseRow();
    if (removingActive) {
      closeEntryInputStage_();
    }
  } else {
    expenseList.splice(idx, 1);
    if (removingActive) {
      closeEntryInputStage_();
    } else if (entryInputStageState_.active && entryInputStageState_.scope === 'expense' && entryInputStageState_.expenseIdx > idx) {
      entryInputStageState_.expenseIdx -= 1;
    }
  }
  if (expenseList.length <= 1) {
    expenseRowDeleteMode_ = false;
  }
  renderExpenseArea();
  recalculateCosts();
}

function onExpenseModeChange(mode) {
  const useIndividual = String(mode || 'allocation') === 'individual';
  setLineItemIndividualMode_(useIndividual);
}

function loadExpenseItems() {
  const ticket = beginEntryAsyncStatus_('Now Loading...');
  google.script.run
    .withSuccessHandler(function(list) {
      expenseCandidates = (list || []).slice();
      renderExpenseArea();
      endEntryAsyncStatus_(ticket);
    })
    .withFailureHandler(function(err) {
      showError(err);
      endEntryAsyncStatus_(ticket, '読み込みに失敗しました', 'error');
    })
    .getExpenseItems();
}

function renderSummary() {
  let totalCount = 0;
  let totalPrice = 0;
  let totalPoint = 0;
  let totalExpenseAlloc = 0;
  let totalCost = 0;
  let totalExpenseInput = 0;

  entryRows.forEach(row => {
    if (!String(row.name || '').trim() || roundYen(row.price) <= 0) return;
    totalCount += roundYen(row.qty);
    totalPrice += Math.max(0, roundYen(row.grossPrice || 0));
    totalPoint += roundYen(row.point);
    totalExpenseAlloc += roundYen(row.expenseAlloc);
    totalCost += roundYen(row.cost);
  });

  getActiveExpenseRows_().forEach(ex => {
    totalExpenseInput += roundYen(ex.amount);
  });

  const summaryExpenseTotal = isExpenseAllocationMode_() ? totalExpenseInput : totalExpenseAlloc;

  document.getElementById('summary-area').innerHTML = `
    <h2 class="mid-title">集計</h2>
    <div class="entry-line-card section-card section-tone-summary">
      <table class="entry-inline-table entry-summary-table">
        <tr>
          <th>商品数</th>
          <th>総基準売価</th>
          <th>ポイント合計</th>
          <th>経費合計</th>
          <th>原価合計</th>
        </tr>
        <tr class="entry-main-row summary-value-row">
          <td class="count-cell">${formatWithComma_(totalCount)}</td>
          <td>${formatYen_(totalPrice)}</td>
          <td>${formatYen_(totalPoint)}</td>
          <td>${formatYen_(summaryExpenseTotal)}</td>
          <td class="is-emphasis">${formatYen_(Math.max(0, totalCost))}</td>
        </tr>
      </table>
    </div>
  `;
}
