function uiEscapeHtml_(value) {
  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function uiBuildOpButtons_(idx, opts) {
  var o = opts || {};
  if (!o.show) {
    return '<div class="inline-value">固定</div>';
  }

  var addLabel = uiEscapeHtml_(o.addLabel || '＋行追加');
  var removeLabel = uiEscapeHtml_(o.removeLabel || '−削除');
  var addFn = String(o.onAdd || '');
  var removeFn = String(o.onRemove || '');

  var addBtn = addFn
    ? '<button type="button" class="btn-main" onclick="' + addFn + '(' + idx + ')">' + addLabel + '</button>'
    : '';
  var removeBtn = removeFn
    ? '<button type="button" class="btn-sub" onclick="' + removeFn + '(' + idx + ')">' + removeLabel + '</button>'
    : '';

  return '<div class="inline-actions">' + addBtn + removeBtn + '</div>';
}

function uiBuildInputTable_(config) {
  var c = config || {};
  var title = c.title ? '<div class="entry-line-title">' + uiEscapeHtml_(c.title) + '</div>' : '';
  var toolbar = c.toolbarHtml ? '<div class="entry-card-toolbar">' + String(c.toolbarHtml) + '</div>' : '';
  var head = (title || toolbar) ? '<div class="entry-card-head">' + title + toolbar + '</div>' : '';
  var columns = Array.isArray(c.columns) ? c.columns : [];
  var includeOps = c.includeOps !== false;
  var bodyHtml = String(c.bodyHtml || '');
  var note = c.note ? '<div class="note-text" style="margin-top:0.45em;">' + uiEscapeHtml_(c.note) + '</div>' : '';

  var header = '<th class="col-no">No</th>';
  for (var i = 0; i < columns.length; i++) {
    var col = columns[i] || {};
    var cls = col.className ? ' ' + uiEscapeHtml_(col.className) : '';
    header += '<th class="' + cls.trim() + '">' + uiEscapeHtml_(col.label || '') + '</th>';
  }
  if (includeOps) {
    header += '<th class="col-action">操作</th>';
  }

  return '' +
    '<div class="entry-line-card unified-entry-card">' +
      head +
      '<div class="inline-scroll">' +
        '<table class="entry-inline-table unified-input-table">' +
          '<tr>' + header + '</tr>' +
          bodyHtml +
        '</table>' +
      '</div>' +
      note +
    '</div>';
}
  </script>
<script>
let entryRows = [];
let expenseList = [];
let pointTotal = 0;
let productCandidates = [];
let expenseCandidates = [];
let supplierCandidates = [];
let paymentCandidates = [];
let commonPaymentCache = '';
let pendingPayload = null;
let postSubmitSlipData = null;
let entryViewVariant = 'A';
let pointInputMode = 'allocation';   // allocation | individual
let expenseInputMode = 'allocation'; // allocation | individual
let detailPanelState = {
  expense: false,
  point: false,
  tax: false
};
const ENTRY_INPUT_STAGE_SCOPE_STEPS_ = {
  product: ['name', 'price', 'qty'],
  expense: ['name', 'amount'],
  point: ['value'],
  common: ['date', 'supplier', 'payment'],
  lineItem: ['point', 'expense', 'payment']
};
let entryInputStageState_ = {
  active: false,
  scope: 'product',
  currentRow: -1,
  expenseIdx: -1,
  step: 'name',
  tempData: null,
  originRect: null
};
let entryInputStageSuggestions_ = [];
let entryInputStageSuggestionActiveIndex_ = -1;
let entryInputStageSuggestionVisible_ = false;
const ENTRY_VIEW_VARIANT_STORAGE_KEY_ = 'erp.entryForm.viewVariant';
const ENTRY_PAGE_DEFAULT_VARIANT_ = 'B';
const ENTRY_PAGE_ROUTE_ = 'entry_b';
const ENTRY_ALT_PAGE_ROUTE_ = 'entry_a';
let entryInputStageViewportRaf_ = 0;
let entryStageBodyLockScrollY_ = 0;
let entrySwipeDeleteTouchState_ = {
  touchId: null,
  rowEl: null,
  startX: 0,
  startY: 0,
  deltaX: 0,
  moved: false
};
let entryListDeleteModeState_ = {
  product: false,
  expense: false
};

window.onload = function() {
  try {
    if (typeof uiBuildInputTable_ !== 'function') {
      throw new Error('共通UI関数が読み込まれていません');
    }

    initializeEntryViewVariant_();
    entryRows = [createEmptyEntryRow()];
    expenseList = [createEmptyExpenseRow()];
    initializeDetailPanels_();
    renderEntryRows();
    renderPointArea();
    renderExpenseArea();
    renderSummary();
    renderCommonInfo();
    loadProductCandidates();
    loadExpenseItems();
    loadSupplierPaymentOptions();
    restoreDraftIfNeeded_();
    setEntryScreenState_('entry');
    applyDetailPanelVisibility_();
    updateTopHelperButtons_();
    const scrollBodyEl = document.getElementById('entry-scroll-body');
    if (scrollBodyEl) {
      scrollBodyEl.addEventListener('scroll', handleEntryInputStageViewportChange_, { passive: true });
    }
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', handleEntryInputStageViewportChange_, { passive: true });
      window.visualViewport.addEventListener('scroll', handleEntryInputStageViewportChange_, { passive: true });
    }
    document.addEventListener('pointerdown', handleStageTriggerPointerDown_, true);
    document.addEventListener('touchstart', handleStageTriggerTouchStart_, { passive: false, capture: true });
    initializeSwipeDeleteActions_();
  } catch (err) {
    const msg = err && err.message ? err.message : String(err);
    const target = document.getElementById('entry-status');
    if (target) {
      target.innerHTML = `<div class="note-text" style="color:#b00020;">初期化エラー: ${escapeHtml(msg)}</div>`;
    }
    showResultPage_();
  }
};

window.addEventListener('resize', handleEntryInputStageViewportChange_);
window.addEventListener('scroll', handleEntryInputStageViewportChange_, true);

function getStageTriggerElementFromEventTarget_(target) {
  if (!target || typeof target.closest !== 'function') return null;
  if (target.closest('.entry-swipe-delete-row')) return null;
  const triggerEl = target.closest('.entry-stage-trigger');
  if (!triggerEl) return null;
  if (!triggerEl.hasAttribute('readonly')) return null;
  return triggerEl;
}

function openStageTriggerWithoutFocus_(triggerEl) {
  if (!triggerEl) return;
  if (triggerEl.dataset && triggerEl.dataset.stageTriggerOpening === '1') return;
  if (triggerEl.dataset) {
    triggerEl.dataset.stageTriggerOpening = '1';
  }
  window.setTimeout(function() {
    if (triggerEl.dataset) {
      delete triggerEl.dataset.stageTriggerOpening;
    }
    if (typeof triggerEl.blur === 'function') {
      try {
        triggerEl.blur();
      } catch (err) {
        // no-op
      }
    }
    if (typeof triggerEl.click === 'function') {
      triggerEl.click();
    }
  }, 0);
}

function handleStageTriggerPointerDown_(event) {
  if (!isInputStabilityVariantB_()) return;
  if (shouldDeferStageTriggerForSwipe_(event && event.target)) return;
  const triggerEl = getStageTriggerElementFromEventTarget_(event && event.target);
  if (!triggerEl) return;
  if (event && typeof event.preventDefault === 'function') {
    event.preventDefault();
  }
  openStageTriggerWithoutFocus_(triggerEl);
}

function handleStageTriggerTouchStart_(event) {
  if (!isInputStabilityVariantB_()) return;
  if (shouldDeferStageTriggerForSwipe_(event && event.target)) return;
  const triggerEl = getStageTriggerElementFromEventTarget_(event && event.target);
  if (!triggerEl) return;
  if (event && typeof event.preventDefault === 'function') {
    event.preventDefault();
  }
  openStageTriggerWithoutFocus_(triggerEl);
}

function shouldDeferStageTriggerForSwipe_(target) {
  if (!target || typeof target.closest !== 'function') return false;
  const triggerEl = target.closest('.entry-stage-trigger');
  if (!triggerEl) return false;
  const swipeTableEl = triggerEl.closest('.entry-inline-table.entry-swipe-table');
  if (!swipeTableEl) return false;
  return !!swipeTableEl.querySelector('.entry-swipe-delete-row');
}

function initializeSwipeDeleteActions_() {
  document.addEventListener('touchstart', handleSwipeDeleteTouchStart_, { passive: true });
  document.addEventListener('touchmove', handleSwipeDeleteTouchMove_, { passive: false });
  document.addEventListener('touchend', handleSwipeDeleteTouchEnd_, true);
  document.addEventListener('touchcancel', handleSwipeDeleteTouchCancel_, true);
  document.addEventListener('click', handleSwipeDeleteDocumentClick_, true);
}

function isEntryListDeleteAvailable_(scope) {
  const targetScope = scope === 'expense' ? 'expense' : 'product';
  return targetScope === 'expense'
    ? expenseList.length > 1
    : entryRows.length > 1;
}

function setEntryListDeleteMode_(scope, enabled) {
  const targetScope = scope === 'expense' ? 'expense' : 'product';
  entryListDeleteModeState_[targetScope] = !!enabled;
}

function toggleEntryListDeleteMode_(scope) {
  const targetScope = scope === 'expense' ? 'expense' : 'product';
  const canEnable = isEntryListDeleteAvailable_(targetScope);
  if (!canEnable) {
    setEntryListDeleteMode_(targetScope, false);
  } else {
    setEntryListDeleteMode_(targetScope, !entryListDeleteModeState_[targetScope]);
  }
  if (targetScope === 'expense') {
    renderExpenseArea();
    return;
  }
  renderEntryRows();
}

function getSwipeDeleteRowFromTarget_(target) {
  if (!target || typeof target.closest !== 'function') return null;
  const rowEl = target.closest('.entry-swipe-delete-row');
  if (!rowEl) return null;
  if (!rowEl.closest('.entry-inline-table.entry-swipe-table')) return null;
  return rowEl;
}

function findTouchById_(touchList, touchId) {
  if (!touchList || touchId === null || touchId === undefined) return null;
  for (let i = 0; i < touchList.length; i++) {
    const touch = touchList[i];
    if (touch && touch.identifier === touchId) {
      return touch;
    }
  }
  return null;
}

function closeSwipeDeleteRows_(exceptRowEl) {
  const openRows = document.querySelectorAll('.entry-swipe-delete-row.is-swipe-open');
  openRows.forEach(function(rowEl) {
    if (exceptRowEl && rowEl === exceptRowEl) return;
    const tableEl = rowEl.closest('.entry-inline-table.entry-swipe-table');
    if (tableEl && tableEl.classList.contains('is-delete-mode')) return;
    rowEl.classList.remove('is-swipe-open');
    if (rowEl.dataset) {
      delete rowEl.dataset.swipeSuppressClick;
    }
  });
}

function setSwipeDeleteRowOpen_(rowEl, shouldOpen) {
  if (!rowEl) return;
  const tableEl = rowEl.closest('.entry-inline-table.entry-swipe-table');
  if (tableEl && tableEl.classList.contains('is-delete-mode')) {
    if (shouldOpen) {
      rowEl.classList.add('is-swipe-open');
    }
    return;
  }
  if (shouldOpen) {
    closeSwipeDeleteRows_(rowEl);
    rowEl.classList.add('is-swipe-open');
    return;
  }
  rowEl.classList.remove('is-swipe-open');
}

function resetSwipeDeleteTouchState_() {
  entrySwipeDeleteTouchState_.touchId = null;
  entrySwipeDeleteTouchState_.rowEl = null;
  entrySwipeDeleteTouchState_.startX = 0;
  entrySwipeDeleteTouchState_.startY = 0;
  entrySwipeDeleteTouchState_.deltaX = 0;
  entrySwipeDeleteTouchState_.moved = false;
}

function handleSwipeDeleteTouchStart_(event) {
  const touch = event && event.changedTouches && event.changedTouches[0];
  if (!touch) return;
  const rowEl = getSwipeDeleteRowFromTarget_(event.target);
  if (!rowEl) {
    resetSwipeDeleteTouchState_();
    return;
  }
  const tableEl = rowEl.closest('.entry-inline-table.entry-swipe-table');
  if (tableEl && tableEl.classList.contains('is-delete-mode')) {
    resetSwipeDeleteTouchState_();
    return;
  }
  const isDeleteButtonTap = event.target && event.target.closest && event.target.closest('.entry-row-remove');
  if (isDeleteButtonTap) {
    resetSwipeDeleteTouchState_();
    return;
  }
  entrySwipeDeleteTouchState_.touchId = touch.identifier;
  entrySwipeDeleteTouchState_.rowEl = rowEl;
  entrySwipeDeleteTouchState_.startX = touch.clientX;
  entrySwipeDeleteTouchState_.startY = touch.clientY;
  entrySwipeDeleteTouchState_.deltaX = 0;
  entrySwipeDeleteTouchState_.moved = false;
}

function handleSwipeDeleteTouchMove_(event) {
  const state = entrySwipeDeleteTouchState_;
  if (!state.rowEl) return;
  const touch = findTouchById_(event.changedTouches, state.touchId) || findTouchById_(event.touches, state.touchId);
  if (!touch) return;
  const deltaX = touch.clientX - state.startX;
  const deltaY = touch.clientY - state.startY;
  if (!state.moved) {
    if (Math.abs(deltaX) < 10 && Math.abs(deltaY) < 10) {
      return;
    }
    if (Math.abs(deltaY) > Math.abs(deltaX)) {
      resetSwipeDeleteTouchState_();
      return;
    }
    state.moved = true;
  }
  state.deltaX = deltaX;
  if (event && event.cancelable) {
    event.preventDefault();
  }
  if (deltaX <= -18) {
    setSwipeDeleteRowOpen_(state.rowEl, true);
  } else if (deltaX >= 18) {
    setSwipeDeleteRowOpen_(state.rowEl, false);
  }
}

function handleSwipeDeleteTouchEnd_(event) {
  const state = entrySwipeDeleteTouchState_;
  if (!state.rowEl) return;
  const touch = findTouchById_(event.changedTouches, state.touchId);
  if (!touch) return;
  const rowEl = state.rowEl;
  if (state.moved) {
    if (state.deltaX <= -28) {
      setSwipeDeleteRowOpen_(rowEl, true);
    } else if (state.deltaX >= 20) {
      setSwipeDeleteRowOpen_(rowEl, false);
    }
    if (rowEl.dataset) {
      rowEl.dataset.swipeSuppressClick = '1';
      window.setTimeout(function() {
        if (rowEl && rowEl.dataset) {
          delete rowEl.dataset.swipeSuppressClick;
        }
      }, 220);
    }
  }
  resetSwipeDeleteTouchState_();
}

function handleSwipeDeleteTouchCancel_() {
  resetSwipeDeleteTouchState_();
}

function handleSwipeDeleteDocumentClick_(event) {
  const target = event && event.target;
  if (!target || typeof target.closest !== 'function') return;
  const deleteBtn = target.closest('.entry-swipe-delete-row .entry-row-remove');
  if (deleteBtn) return;
  const deleteModeTableEl = target.closest('.entry-inline-table.entry-swipe-table.is-delete-mode');
  if (deleteModeTableEl) return;

  const openRowEl = target.closest('.entry-swipe-delete-row.is-swipe-open');
  if (openRowEl) {
    if (openRowEl.dataset && openRowEl.dataset.swipeSuppressClick === '1') {
      if (event && event.cancelable) event.preventDefault();
      if (typeof event.stopPropagation === 'function') event.stopPropagation();
      return;
    }
    setSwipeDeleteRowOpen_(openRowEl, false);
    if (event && event.cancelable) event.preventDefault();
    if (typeof event.stopPropagation === 'function') event.stopPropagation();
    return;
  }

  closeSwipeDeleteRows_(null);
}

function isIOSMobile_() {
  const ua = String((window.navigator && window.navigator.userAgent) || '').toLowerCase();
  const platform = String((window.navigator && window.navigator.platform) || '').toLowerCase();
  const touchPoints = Number((window.navigator && window.navigator.maxTouchPoints) || 0);
  const isAppleMobileUa = /iphone|ipad|ipod/.test(ua);
  const isIPadDesktopMode = platform === 'macintel' && touchPoints > 1;
  return (isAppleMobileUa || isIPadDesktopMode) && window.innerWidth <= 1024;
}

function normalizeEntryViewVariant_(value) {
  const variant = String(value || '').trim().toUpperCase();
  return variant === 'B' ? 'B' : 'A';
}

function persistEntryViewVariant_(variant) {
  try {
    window.localStorage.setItem(ENTRY_VIEW_VARIANT_STORAGE_KEY_, normalizeEntryViewVariant_(variant));
  } catch (err) {
    // no-op
  }
}

function applyEntryViewVariant_(variant, options) {
  const normalized = normalizeEntryViewVariant_(variant);
  const opts = options || {};
  entryViewVariant = normalized;
  document.body.setAttribute('data-ui-variant', normalized.toLowerCase());
  document.body.setAttribute('data-footer-mode', 'consolidated');
  const headerStateEl = document.getElementById('entry-fixed-header-state');
  if (headerStateEl) {
    headerStateEl.textContent = normalized === 'B' ? 'Bモード' : 'Aモード';
  }
  if (!opts.skipPersist) {
    persistEntryViewVariant_(normalized);
  }
  renderTopHelperButtons_();
  updateTopHelperButtons_();
}

function initializeEntryViewVariant_() {
  const queryParamVariant = String(getQueryParam_('ab') || getQueryParam_('variant')).trim();
  const queryVariant = normalizeEntryViewVariant_(queryParamVariant);
  if (queryParamVariant) {
    applyEntryViewVariant_(queryVariant);
    return;
  }
  const pageDefaultRaw = String(ENTRY_PAGE_DEFAULT_VARIANT_ || '').trim().toUpperCase();
  if (pageDefaultRaw === 'A' || pageDefaultRaw === 'B') {
    applyEntryViewVariant_(pageDefaultRaw, { skipPersist: true });
    return;
  }
  if (isIOSMobile_()) {
    applyEntryViewVariant_('B', { skipPersist: true });
    return;
  }
  let storedRaw = '';
  try {
    storedRaw = String(window.localStorage.getItem(ENTRY_VIEW_VARIANT_STORAGE_KEY_) || '').trim();
  } catch (err) {
    storedRaw = '';
  }
  if (storedRaw) {
    applyEntryViewVariant_(normalizeEntryViewVariant_(storedRaw), { skipPersist: true });
    return;
  }
  const defaultVariant = 'A';
  applyEntryViewVariant_(defaultVariant, { skipPersist: true });
}

function handleUiVariantToggleClick() {
  if (ENTRY_PAGE_ROUTE_ && ENTRY_ALT_PAGE_ROUTE_) {
    navigateToWebAppPage_(ENTRY_ALT_PAGE_ROUTE_, {});
    return;
  }
  const nextVariant = normalizeEntryViewVariant_(entryViewVariant) === 'A' ? 'B' : 'A';
  applyEntryViewVariant_(nextVariant);
  renderExpenseArea();
  renderPointArea();
  applyDetailPanelVisibility_();
  if (entryInputStageState_.active) {
    renderEntryInputStage_();
  }
  updateTopHelperButtons_();
}

function isUiVariantB_() {
  return normalizeEntryViewVariant_(entryViewVariant) === 'B';
}

function isInputStabilityVariantB_() {
  return isUiVariantB_();
}

function isFooterConsolidatedMode_() {
  return true;
}

function renderTopHelperButtons_() {
  const helperBar = document.getElementById('entry-top-helper-bar');
  if (!helperBar) return;
  if (isFooterConsolidatedMode_()) {
    helperBar.innerHTML = '';
    return;
  }
  helperBar.innerHTML = '' +
    '<button type="button" id="helper-variant-btn" class="header-toggle-btn" onclick="handleUiVariantToggleClick()"></button>' +
    '<button type="button" id="helper-individual-btn" class="header-toggle-btn" onclick="handleIndividualModeToggleClick()"></button>' +
    '<button type="button" id="helper-tax-btn" class="header-toggle-btn" onclick="handleTaxToggleClick()"></button>';
}

function setEntryScreenState_(screen) {
  const normalized = String(screen || 'entry').trim() || 'entry';
  document.body.setAttribute('data-entry-screen', normalized);
  updateTopHelperButtons_();
}

function scrollAppBodyToTop_() {
  const scrollEl = document.getElementById('entry-scroll-body');
  if (scrollEl) {
    scrollEl.scrollTop = 0;
    return;
  }
  window.scrollTo(0, 0);
}

function isWebAppRuntimeUrl_() {
  return /\/(exec|dev)(?:$|[?#])/i.test(String(window.location.href || ''));
}

function navigateToWebAppPage_(page, params) {
  const fallbackUrl = String(buildWebAppPageUrl_(page, params || {}) || '').trim();
  if (isWebAppRuntimeUrl_()) {
    if (!fallbackUrl) {
      showError(new Error('ページ遷移URLを作成できませんでした。'));
      return;
    }
    window.location.href = fallbackUrl;
    return;
  }
  const canUseGasRun = (typeof google !== 'undefined') &&
    google &&
    google.script &&
    google.script.run &&
    typeof google.script.run.getWebAppPageUrl === 'function';
  if (!canUseGasRun) {
    if (!fallbackUrl) {
      showError(new Error('ページ遷移URLを作成できませんでした。'));
      return;
    }
    window.location.href = fallbackUrl;
    return;
  }
  google.script.run
    .withSuccessHandler(function(url) {
      const resolvedUrl = String(url || '').trim();
      const targetUrl = resolvedUrl || fallbackUrl;
      if (!targetUrl) {
        showError(new Error('ページ遷移URLを取得できませんでした。'));
        return;
      }
      try {
        if (window.top && window.top !== window.self) {
          window.top.location.href = targetUrl;
          return;
        }
      } catch (err) {
        // no-op
      }
      window.location.href = targetUrl;
    })
    .withFailureHandler(function(err) {
      if (fallbackUrl) {
        window.location.href = fallbackUrl;
        return;
      }
      showError(err || new Error('ページ遷移URLを取得できませんでした。'));
    })
    .getWebAppPageUrl(page, params || {});
}

function normalizeEntryInputStageScope_(scope) {
  const target = String(scope || '').trim();
  if (Object.prototype.hasOwnProperty.call(ENTRY_INPUT_STAGE_SCOPE_STEPS_, target)) {
    return target;
  }
  return 'product';
}

function normalizeEntryInputStageStep_(scope, step) {
  const targetScope = normalizeEntryInputStageScope_(scope);
  const target = String(step || '').trim();
  const steps = ENTRY_INPUT_STAGE_SCOPE_STEPS_[targetScope] || ['name'];
  return steps.includes(target) ? target : steps[0];
}

function captureStageRect_(el) {
  if (!el || typeof el.getBoundingClientRect !== 'function') return null;
  const rect = el.getBoundingClientRect();
  return {
    left: rect.left,
    top: rect.top,
    width: rect.width,
    height: rect.height
  };
}

function clampStageValue_(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function getEntryInputStageAnchorElement_() {
  const scope = normalizeEntryInputStageScope_(entryInputStageState_.scope);
  if (scope === 'expense') return document.getElementById('expense-area');
  if (scope === 'point') return document.getElementById('point-area');

function applyEntryInputStagePosition_(stageEl) {
  if (!stageEl) return;
  const panelEl = stageEl.querySelector('.entry-input-stage-panel');
  if (!panelEl) return;
  const isMobile = window.innerWidth <= 768;
  const vv = window.visualViewport;
  const layoutWidth = Math.max(0, window.innerWidth || (vv ? vv.width : 0));
  const vvWidth = vv ? Math.max(0, vv.width) : window.innerWidth;
  const vvHeight = vv ? Math.max(0, vv.height) : window.innerHeight;

  if (isMobile && isInputStabilityVariantB_()) {
    stageEl.style.inset = 'auto';
    stageEl.style.left = '0px';
    stageEl.style.top = '0px';
    stageEl.style.width = layoutWidth + 'px';
    stageEl.style.height = vvHeight + 'px';
    stageEl.style.setProperty('--entry-stage-height', Math.round(vvHeight) + 'px');

    const safeMargin = 8;
    const panelWidth = Math.max(0, Math.min(layoutWidth - (safeMargin * 2), Math.min(layoutWidth * 0.98, 72)));
    const left = Math.round(layoutWidth / 2);
    const top = safeMargin;
    const panelMaxHeight = Math.max(0, vvHeight - (safeMargin * 2));

    panelEl.style.left = left + 'px';
    panelEl.style.top = top + 'px';
    panelEl.style.width = panelWidth + 'px';
    panelEl.style.maxHeight = panelMaxHeight + 'px';
    panelEl.style.transform = 'translateX(-50%)';
    return;
  }
  if (isMobile) {
    stageEl.style.removeProperty('inset');
    stageEl.style.removeProperty('left');
    stageEl.style.removeProperty('top');
    stageEl.style.removeProperty('width');
    stageEl.style.removeProperty('height');
    stageEl.style.setProperty('--entry-stage-height', '100dvh');
    panelEl.style.left = '50%';
    panelEl.style.top = '50%';
    panelEl.style.width = 'min(92vw, 720px)';
    panelEl.style.maxHeight = '80vh';
    panelEl.style.transform = 'translate(-50%, -50%)';
    return;
  }
  stageEl.style.removeProperty('inset');
  stageEl.style.removeProperty('left');
  stageEl.style.removeProperty('top');
  stageEl.style.removeProperty('width');
  stageEl.style.removeProperty('height');
  stageEl.style.setProperty('--entry-stage-height', '100dvh');
  panelEl.style.removeProperty('left');
  panelEl.style.removeProperty('top');
  panelEl.style.removeProperty('width');
  panelEl.style.removeProperty('max-height');
  panelEl.style.removeProperty('transform');

  const anchorEl = getEntryInputStageAnchorElement_();
  const anchorRect = captureStageRect_(anchorEl) || {
    left: 8,
    top: 8,
    width: Math.max(0, window.innerWidth - 16),
    height: 0
  };
  const panelWidth = Math.min(window.innerWidth * 0.96, 1200);
  const rootStyles = window.getComputedStyle(document.documentElement);
  const topOffsetRaw = parseFloat(String(rootStyles.getPropertyValue('--entry-top-offset') || '').trim());
  const topOffset = Number.isFinite(topOffsetRaw) ? topOffsetRaw : 0;
  const safeMargin = 8;
  const left = clampStageValue_(
    anchorRect.left + ((anchorRect.width - panelWidth) / 2),
    safeMargin,
    Math.max(safeMargin, window.innerWidth - panelWidth - safeMargin)
  );
  const top = clampStageValue_(
    anchorRect.top + 8 + topOffset,
    safeMargin,
    Math.max(safeMargin, window.innerHeight - 260)
  );
  const originRect = entryInputStageState_.originRect || anchorRect;
  const fromX = (originRect.left + (originRect.width / 2)) - (left + (panelWidth / 2));
  const fromY = (originRect.top + (originRect.height / 2)) - (top + 20);

  stageEl.style.setProperty('--entry-panel-left', left + 'px');
  stageEl.style.setProperty('--entry-panel-top', top + 'px');
  stageEl.style.setProperty('--entry-panel-width', panelWidth + 'px');
  stageEl.style.setProperty('--entry-from-x', Math.round(fromX) + 'px');
  stageEl.style.setProperty('--entry-from-y', Math.round(fromY) + 'px');
}

function handleEntryInputStageViewportChange_() {
  if (entryInputStageViewportRaf_) return;

    const stageEl = document.getElementById('entry-input-stage');
    if (!stageEl || !stageEl.classList.contains('is-open')) return;
    applyEntryInputStagePosition_(stageEl);
  });
}

function isEntryInputStageDateField_(scope, step) {

function isEntryInputStageAutocompleteField_(scope, step) {
  const targetScope = normalizeEntryInputStageScope_(scope);
  const targetStep = normalizeEntryInputStageStep_(targetScope, step);
  if (targetScope === 'product' && targetStep === 'name') return true;
  if (targetScope === 'expense' && targetStep === 'name') return true;
  if (targetScope === 'common' && (targetStep === 'supplier' || targetStep === 'payment')) return true;
  return false;
}

function getEntryInputStageAutocompleteSource_(scope, step) {
  const targetScope = normalizeEntryInputStageScope_(scope);
  const targetStep = normalizeEntryInputStageStep_(targetScope, step);
  if (targetScope === 'product' && targetStep === 'name') {
    const out = [];
    const seen = new Set();
    (productCandidates || []).forEach(function(item) {
      if (!item) return;
      const values = [item.label, item.name, item.productNo, item.jan];
      values.forEach(function(v) {
        const val = String(v || '').trim();
        if (!val) return;
        if (seen.has(val)) return;
        seen.add(val);
        out.push(val);
      });
    });
    return out;
  }
  if (targetScope === 'expense' && targetStep === 'name') {
    return (expenseCandidates || []).map(function(v) { return String(v || '').trim(); }).filter(function(v) { return !!v; });
  }
  if (targetScope === 'common' && targetStep === 'supplier') {
    return (supplierCandidates || []).map(function(v) { return String(v || '').trim(); }).filter(function(v) { return !!v; });
  }
  if (targetScope === 'common' && targetStep === 'payment') {
    return (paymentCandidates || []).map(function(v) { return String(v || '').trim(); }).filter(function(v) { return !!v; });
  }
  return [];
}

function createEntryInputStageSuggestionList_(scope, step, inputValue) {
  if (!isEntryInputStageAutocompleteField_(scope, step)) return [];
  const queryRaw = String(inputValue || '').trim();
  const query = queryRaw.toLowerCase();
  const source = getEntryInputStageAutocompleteSource_(scope, step);
  const seen = new Set();
  const startsWith = [];
  const includes = [];
  source.forEach(function(item) {
    const value = String(item || '').trim();
    if (!value) return;
    const key = value.toLowerCase();
    if (seen.has(key)) return;
    seen.add(key);
    if (!query) {
      startsWith.push(value);
      return;
    }
    const lower = value.toLowerCase();
    if (lower.indexOf(query) === 0) {
      startsWith.push(value);
      return;
    }
    if (lower.indexOf(query) >= 0) {
      includes.push(value);
    }
  });
  return startsWith.concat(includes).slice(0, 12);
}

function renderEntryInputStageSuggestions_() {
  const listEl = document.getElementById('entry-input-stage-suggestions');
  if (!listEl) return;
  if (!entryInputStageSuggestionVisible_ || !entryInputStageSuggestions_.length) {
    listEl.innerHTML = '';
    listEl.style.display = 'none';
    return;
  }
  const itemsHtml = entryInputStageSuggestions_.map(function(item, idx) {
    const activeClass = idx === entryInputStageSuggestionActiveIndex_ ? ' is-active' : '';
    const escaped = escapeHtml(item);
    return `<button type="button" class="entry-input-stage-suggestion-item${activeClass}" onmousedown="onEntryInputStageSuggestionPick(${idx}, event)">${escaped}</button>`;
  }).join('');
  listEl.innerHTML = itemsHtml;
  listEl.style.display = 'flex';
}

function updateEntryInputStageSuggestions_(scope, step, value, opts) {
  const options = opts || {};
  if (!isEntryInputStageAutocompleteField_(scope, step)) {
    entryInputStageSuggestions_ = [];
    entryInputStageSuggestionActiveIndex_ = -1;
    entryInputStageSuggestionVisible_ = false;
    renderEntryInputStageSuggestions_();
    return;
  }
  const nextSuggestions = createEntryInputStageSuggestionList_(scope, step, value);
  entryInputStageSuggestions_ = nextSuggestions;
  entryInputStageSuggestionVisible_ = nextSuggestions.length > 0;
  if (!entryInputStageSuggestionVisible_) {
    entryInputStageSuggestionActiveIndex_ = -1;
    renderEntryInputStageSuggestions_();
    return;
  }
  if (options.resetActive) {
    entryInputStageSuggestionActiveIndex_ = -1;
  } else if (entryInputStageSuggestionActiveIndex_ >= nextSuggestions.length) {
    entryInputStageSuggestionActiveIndex_ = nextSuggestions.length - 1;
  }
  renderEntryInputStageSuggestions_();
}

function closeEntryInputStageSuggestions_() {
  entryInputStageSuggestions_ = [];
  entryInputStageSuggestionActiveIndex_ = -1;
  entryInputStageSuggestionVisible_ = false;
  renderEntryInputStageSuggestions_();
}

function onEntryInputStageSuggestionPick(index, event) {
  if (event && typeof event.preventDefault === 'function') {
    event.preventDefault();
  }
  const idx = Number(index);
  if (!Number.isFinite(idx) || idx < 0 || idx >= entryInputStageSuggestions_.length) return;
  const picked = entryInputStageSuggestions_[idx];
  const inputEl = document.getElementById('entry-input-stage-field');
  if (inputEl) {
    inputEl.value = picked;
    if (typeof inputEl.focus === 'function') {
      try {
        inputEl.focus({ preventScroll: true });
      } catch (err) {
        inputEl.focus();
      }
    }
  }
  onEntryInputStageInput(picked);
  closeEntryInputStageSuggestions_();
}

function moveEntryInputStageSuggestionSelection_(direction) {
  if (!entryInputStageSuggestionVisible_ || !entryInputStageSuggestions_.length) return false;
  const len = entryInputStageSuggestions_.length;
  if (entryInputStageSuggestionActiveIndex_ < 0) {
    entryInputStageSuggestionActiveIndex_ = direction > 0 ? 0 : len - 1;
  } else {
    entryInputStageSuggestionActiveIndex_ = (entryInputStageSuggestionActiveIndex_ + direction + len) % len;
  }
  renderEntryInputStageSuggestions_();
  return true;
}

function focusEntryInputStage_() {
  if (isInputStabilityVariantB_()) return;
  window.setTimeout(function() {
    const inputEl = document.getElementById('entry-input-stage-field');
    if (!inputEl) return;
    try {
      inputEl.focus({ preventScroll: true });
    } catch (err) {
      try {
        inputEl.focus();
      } catch (err2) {
        // no-op
      }
    }
    if (typeof inputEl.setSelectionRange === 'function') {
      const len = String(inputEl.value || '').length;
      try {
        inputEl.setSelectionRange(len, len);
      } catch (err3) {
        // no-op
      }
    }
  }, 0);
}

function handleEntryInputStageFieldFocus_() {
  if (entryInputStageState_.active) {
    const scope = normalizeEntryInputStageScope_(entryInputStageState_.scope);
    const step = normalizeEntryInputStageStep_(scope, entryInputStageState_.step);
    const inputEl = document.getElementById('entry-input-stage-field');
    updateEntryInputStageSuggestions_(scope, step, inputEl ? inputEl.value : '', { resetActive: true });
  }
  if (!isInputStabilityVariantB_()) return;
  handleEntryInputStageViewportChange_();
  window.setTimeout(function() {

function lockEntryStageBodyForMobile_() {

  if (isInputStabilityVariantB_()) return;
  if (document.body.classList.contains('entry-stage-active')) return;
  entryStageBodyLockScrollY_ = window.scrollY || window.pageYOffset || 0;
  document.body.style.top = '-' + entryStageBodyLockScrollY_ + 'px';
  document.body.style.position = 'fixed';
  document.body.style.left = '0';
  document.body.style.right = '0';
  document.body.style.width = '100%';
}

function unlockEntryStageBodyForMobile_() {
  const top = String(document.body.style.top || '');
  document.body.style.top = '';
  document.body.style.position = '';
  document.body.style.left = '';
  document.body.style.right = '';
  document.body.style.width = '';
  if (window.innerWidth > 768) return;
  if (isInputStabilityVariantB_()) return;
  let restoreY = entryStageBodyLockScrollY_;
  if (top) {
    const parsed = Math.abs(parseInt(top, 10));
    if (Number.isFinite(parsed)) {
      restoreY = parsed;
    }
  }
  window.scrollTo(0, restoreY);
  entryStageBodyLockScrollY_ = 0;
}

  entryInputStageState_.scope = 'product';
  entryInputStageState_.currentRow = -1;
  entryInputStageState_.expenseIdx = -1;
  entryInputStageState_.step = 'name';
  entryInputStageState_.tempData = null;
  entryInputStageState_.originRect = null;
  closeEntryInputStageSuggestions_();
  unlockEntryStageBodyForMobile_();
  document.body.classList.remove('entry-stage-active');
  document.body.classList.remove('entry-stage-mobile-b');
  const stageEl = document.getElementById('entry-input-stage');
  if (!stageEl) return;
  stageEl.classList.remove('is-open');
  stageEl.style.display = 'none';
  stageEl.style.removeProperty('inset');
  stageEl.style.removeProperty('left');
  stageEl.style.removeProperty('top');
  stageEl.style.removeProperty('width');
  stageEl.style.removeProperty('height');
  stageEl.style.setProperty('--entry-stage-height', '100dvh');
  stageEl.innerHTML = '';
}

function renderEntryInputStage_() {
  const stageEl = document.getElementById('entry-input-stage');
  if (!stageEl) return;
  if (!entryInputStageState_.active) {
    closeEntryInputStage_();
    return;
  }

  const scope = normalizeEntryInputStageScope_(entryInputStageState_.scope);
  entryInputStageState_.scope = scope;
  const step = normalizeEntryInputStageStep_(scope, entryInputStageState_.step);
  entryInputStageState_.step = step;
  if (scope === 'product') {
    if (entryInputStageState_.currentRow < 0 || entryInputStageState_.currentRow >= entryRows.length) {
      closeEntryInputStage_();
      return;
    }
  }
  if (scope === 'expense') {
    if (entryInputStageState_.expenseIdx < 0 || entryInputStageState_.expenseIdx >= expenseList.length) {
      closeEntryInputStage_();
      return;
    }
  }
  if (scope === 'lineItem') {
    if (entryInputStageState_.currentRow < 0 || entryInputStageState_.currentRow >= entryRows.length) {
      closeEntryInputStage_();
      return;
    }
  }
  if (scope === 'common') {
    const isPaymentField = step === 'payment';
    if (isPaymentField && isLineItemIndividualMode_()) {
      closeEntryInputStage_();
      return;
    }
  }

  const label = getEntryInputStageLabel_(scope, step);
  const actionLabel = getEntryInputStageActionLabel_(scope, step);
  const value = escapeHtml(getEntryInputStageValue_(scope, step));
  const placeholder = getEntryInputStagePlaceholder_(scope, step);
  const inputClass = getEntryInputStageInputClass_(scope, step);
  const inputAttrs = getEntryInputStageInputAttrs_(scope, step);
  const fieldHtml = buildEntryInputStageFieldHtml_(scope, step, inputClass, inputAttrs, value, placeholder);

  stageEl.innerHTML = `
    <div class="entry-input-stage-panel" role="group" aria-label="${label}">
      <label class="entry-input-stage-label" for="entry-input-stage-field">${label}</label>
      ${fieldHtml}
      <div class="entry-input-stage-actions">
        <button type="button" class="btn-sub" onclick="onEntryInputStageBack()">戻る</button>
        <button type="button" class="btn-main" onclick="onEntryInputStageAction()">${actionLabel}</button>
      </div>
    </div>
  `;
  updateEntryInputStageSuggestions_(scope, step, getEntryInputStageValue_(scope, step), { resetActive: true });
  if (isEntryInputStageDateField_(scope, step)) syncEntryInputStageDatePicker_();
  applyEntryInputStagePosition_(stageEl);
  stageEl.style.display = 'flex';
  stageEl.classList.add('is-open');
  lockEntryStageBodyForMobile_();
  document.body.classList.add('entry-stage-active');
  document.body.classList.toggle('entry-stage-mobile-b', isInputStabilityVariantB_() && window.innerWidth <= 768);
  focusEntryInputStage_();
}

function onEntryInputStageInput(value) {
  if (!entryInputStageState_.active) return;

  const step = normalizeEntryInputStageStep_(scope, entryInputStageState_.step);
  const nextValue = String(value || '');
  setEntryInputStageValue_(scope, step, nextValue);
  updateEntryInputStageSuggestions_(scope, step, nextValue, { resetActive: true });
}

function onEntryInputStageKeydown(event) {
  if (!event) return;
  if (event.key === 'ArrowDown') {
    if (moveEntryInputStageSuggestionSelection_(1)) {
      event.preventDefault();
      return;
    }
  }
  if (event.key === 'ArrowUp') {
    if (moveEntryInputStageSuggestionSelection_(-1)) {
      event.preventDefault();
      return;
    }
  }
  if (event.key === 'Escape') {
    if (entryInputStageSuggestionVisible_) {
      event.preventDefault();
      closeEntryInputStageSuggestions_();
      return;
    }
  }
  if (event.key !== 'Enter') return;
  if (entryInputStageSuggestionVisible_ && entryInputStageSuggestionActiveIndex_ >= 0 && entryInputStageSuggestionActiveIndex_ < entryInputStageSuggestions_.length) {
    event.preventDefault();
    onEntryInputStageSuggestionPick(entryInputStageSuggestionActiveIndex_);
    return;
  }
  event.preventDefault();
  onEntryInputStageAction();
}

function commitEntryInputStageStep_() {
  if (!entryInputStageState_.active) return;
  const scope = normalizeEntryInputStageScope_(entryInputStageState_.scope);
  const step = normalizeEntryInputStageStep_(scope, entryInputStageState_.step);
  const inputEl = document.getElementById('entry-input-stage-field');
  const value = inputEl ? String(inputEl.value || '') : getEntryInputStageValue_(scope, step);
  setEntryInputStageValue_(scope, step, value);

  if (scope === 'product') {
    const idx = entryInputStageState_.currentRow;
    const row = entryRows[idx];
    if (!row) return;
    if (step === 'name') {
      onProductInput(idx, value);
      return;
    }
    if (step === 'price') {
      onPriceInput(idx, value);
      return;
    }
    onQtyInput(idx, value);
    return;
  }

  if (scope === 'expense') {
    const idx = entryInputStageState_.expenseIdx;
    const row = expenseList[idx];
    if (!row) return;
    if (step === 'name') {
      onExpenseNameInput(idx, value);
      renderExpenseArea();
      return;
    }
    onExpenseAmountBlur(idx, value);
    renderExpenseArea();
    return;
  }

  if (scope === 'lineItem') {
    const idx = entryInputStageState_.currentRow;
    const row = entryRows[idx];
    if (!row) return;
    if (step === 'point') {
      onPointInput(idx, value);
      return;
    }
    if (step === 'expense') {
      onExpenseAllocInput(idx, value);
      return;
    }
    onRowPaymentInput(idx, value);
    return;
  }

  if (scope === 'common') {
    const target = normalizeEntryInputStageStep_('common', step);
    const normalizedValue = target === 'date'
      ? normalizeDateDigits_(value)
      : String(value || '').trim();
    setEntryInputStageValue_(scope, target, normalizedValue);
    if (target === 'date') {
      const dateInput = document.getElementById('common-date');
      if (dateInput) dateInput.value = normalizedValue;
      syncDatePickerFromText_('common-date', 'common-date-picker');
      return;
    }
    if (target === 'supplier') {
      const supplierInput = document.getElementById('common-supplier');
      if (supplierInput) supplierInput.value = normalizedValue;
      return;
    }
    const paymentInput = document.getElementById('common-payment');
    if (paymentInput) paymentInput.value = normalizedValue;
    return;
  }

  pointTotal = Math.max(0, roundYen(value || 0));
  recalculateCosts();
  renderPointArea();
}

function onEntryInputStageAction() {
  if (!entryInputStageState_.active) return;
  const scope = normalizeEntryInputStageScope_(entryInputStageState_.scope);
  const step = normalizeEntryInputStageStep_(scope, entryInputStageState_.step);
  commitEntryInputStageStep_();

  if (scope === 'product') {
    if (step === 'name') {
      entryInputStageState_.step = 'price';
      renderEntryInputStage_();
      return;
    }
    if (step === 'price') {
      entryInputStageState_.step = 'qty';
      renderEntryInputStage_();
      return;
    }
    closeEntryInputStage_();
    return;
  }

  if (scope === 'expense') {
    if (step === 'name') {
      entryInputStageState_.step = 'amount';
      renderEntryInputStage_();
      return;
    }
    closeEntryInputStage_();
    return;
  }

  if (scope === 'lineItem') {
    if (step === 'point') {
      entryInputStageState_.step = 'expense';
      renderEntryInputStage_();
      return;
    }
    if (step === 'expense') {
      entryInputStageState_.step = 'payment';
      renderEntryInputStage_();
      return;
    }
    closeEntryInputStage_();
    return;
  }

  if (scope === 'common') {
    if (step === 'date') {
      entryInputStageState_.step = 'supplier';
      renderEntryInputStage_();
      return;
    }
    if (step === 'supplier' && !isLineItemIndividualMode_()) {
      entryInputStageState_.step = 'payment';
      renderEntryInputStage_();
      return;
    }
    closeEntryInputStage_();
    return;
  }

  closeEntryInputStage_();
}

function onEntryInputStageBack() {
  if (!entryInputStageState_.active) return;
  const scope = normalizeEntryInputStageScope_(entryInputStageState_.scope);
  const step = normalizeEntryInputStageStep_(scope, entryInputStageState_.step);

  if (scope === 'product') {
    if (step === 'qty') {
      entryInputStageState_.step = 'price';

    }

    return;
  }

  if (scope === 'expense') {
    if (step === 'amount') {
      entryInputStageState_.step = 'name';

      return;

    closeEntryInputStage_();
    return;
  }

  if (scope === 'lineItem') {
    if (step === 'payment') {
      entryInputStageState_.step = 'expense';
      renderEntryInputStage_();
      return;
    }
    if (step === 'expense') {
      entryInputStageState_.step = 'point';

  if (scope === 'common') {

}

function createEmptyExpenseRow() {
  return {
    name: '',
    amount: '',
    memo: ''
  };
}

function toNumber(v) {
  const n = Number(v);
  return Number.isFinite(n) ? n : 0;
}

function roundYen(v) {
  return Math.round(toNumber(v));
}

function escapeHtml(value) {
  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function formatWithComma_(value) {
  return String(Math.round(toNumber(value))).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

function formatYen_(value) {
  return formatWithComma_(value) + '円';
}

function getQueryParam_(name) {
  try {
    const url = new URL(window.location.href);
    return String(url.searchParams.get(name) || '').trim();
  } catch (err) {
    const query = String(window.location.search || '').replace(/^\?/, '');
    if (!query) return '';
    const pairs = query.split('&');
    for (let i = 0; i < pairs.length; i++) {
      const parts = pairs[i].split('=');
      if (decodeURIComponent(parts[0] || '') !== String(name || '')) continue;
      return decodeURIComponent(parts[1] || '').trim();
    }
    return '';
  }
}

function buildWebAppPageUrl_(page, params) {
  try {
    const url = new URL(window.location.href);
    url.searchParams.set('page', String(page || 'entry'));
    const p = params || {};
    Object.keys(p).forEach(key => {
      if (p[key] === undefined || p[key] === null || String(p[key]).trim() === '') {
        url.searchParams.delete(key);
        return;
      }
      url.searchParams.set(key, String(p[key]));
    });
    return url.toString();
  } catch (err) {
    const p = params || {};
    const query = ['page=' + encodeURIComponent(String(page || 'entry'))];
    Object.keys(p).forEach(key => {
      if (p[key] === undefined || p[key] === null || String(p[key]).trim() === '') return;
      query.push(encodeURIComponent(key) + '=' + encodeURIComponent(String(p[key])));
    });
    return String(window.location.pathname || '') + '?' + query.join('&');
  }
}

function setLineItemIndividualMode_(enabled) {
  const wasLineItemIndividualMode = isLineItemIndividualMode_();
  const currentDate = normalizeDateDigits_(String((document.getElementById('common-date') && document.getElementById('common-date').value) || '').trim());
  const currentSupplier = String((document.getElementById('common-supplier') && document.getElementById('common-supplier').value) || '').trim();
  const currentPayment = String((document.getElementById('common-payment') && document.getElementById('common-payment').value) || '').trim();

  const shouldUseIndividual = !!enabled;
  if (!wasLineItemIndividualMode && shouldUseIndividual) {
    commonPaymentCache = currentPayment;
  }
  pointInputMode = shouldUseIndividual ? 'individual' : 'allocation';
  expenseInputMode = shouldUseIndividual ? 'individual' : 'allocation';

  if (shouldUseIndividual) {
    entryRows.forEach(function(row) {
      row.point = 0;
      row.expenseAlloc = 0;
    });
    detailPanelState.expense = false;
    detailPanelState.point = false;
  } else {
    pointTotal = entryRows.reduce(function(sum, row) {
      if (!String(row.name || '').trim() || roundYen(row.price) <= 0) return sum;
      return sum + Math.max(0, roundYen(row.point || 0));
    }, 0);
  }

  recalculateCosts();
  renderPointArea();
  renderExpenseArea();
  renderCommonInfo();
  const dateInput = document.getElementById('common-date');
  const datePicker = document.getElementById('common-date-picker');
  const supplierInput = document.getElementById('common-supplier');
  const paymentInput = document.getElementById('common-payment');
  if (dateInput) dateInput.value = currentDate;
  if (dateInput && datePicker) syncDatePickerFromText_('common-date', 'common-date-picker');
  if (supplierInput) supplierInput.value = currentSupplier;
  if (paymentInput) {
    paymentInput.value = shouldUseIndividual ? '' : (currentPayment || commonPaymentCache);
  }
  updateTopHelperButtons_();
}

function loadProductCandidates() {
  google.script.run
    .withSuccessHandler(function(list) {
      productCandidates = Array.isArray(list) ? list : [];
      const dl = document.getElementById('product-options');
      if (dl) {
        dl.innerHTML = productCandidates
          .map(item => `<option value="${escapeHtml(item.label || '')}"></option>`)
          .join('');
      }
      renderEntryRows();
    })
    .withFailureHandler(showError)
    .getProductCandidates();
}

function resolveProductByInput(input) {
  const text = String(input || '').trim();
  if (!text) return null;

  for (let i = 0; i < productCandidates.length; i++) {
    const item = productCandidates[i];
    const label = String(item.label || '').trim();
    const no = String(item.productNo || '').trim();
    const jan = String(item.jan || '').trim();
    const name = String(item.name || '').trim();
    if (text === label || text === name || (no && text === no) || (jan && text === jan)) {
      return {
        productNo: no,
        name: name,
        label: label || name,
        isKnown: true
      };
    }
  }

  const split = text.split('：');
  if (split.length >= 2) {
    const tokenPart = split[0].trim();
    const namePart = split.slice(1).join('：').trim();
    for (let j = 0; j < productCandidates.length; j++) {
      const item2 = productCandidates[j];
      const itemNo = String(item2.productNo || '').trim();
      const itemJan = String(item2.jan || '').trim();
      if ((itemNo === tokenPart || itemJan === tokenPart) && String(item2.name || '').trim() === namePart) {
        return {
          productNo: itemNo,
          name: namePart,
          label: String(item2.label || text),
          isKnown: true
        };
      }
    }
  }

  return {
    productNo: '',
    name: text,
    label: text,
    isKnown: false
  };
}

function onProductInput(idx, value) {
  const row = entryRows[idx];
  if (!row) return;

  row.productInput = String(value || '').trim();
  const matched = resolveProductByInput(row.productInput);
  if (!matched) {
    row.productNo = '';
    row.name = '';
  } else {
    row.productNo = matched.productNo;
    row.name = matched.name;
  }
  recalculateCosts();
}

function cacheProductInput(idx, value) {
  const row = entryRows[idx];
  if (!row) return;
  row.productInput = String(value || '');
}

function onPriceInput(idx, value) {
  const row = entryRows[idx];
  if (!row) return;
  row.price = Math.max(0, roundYen(value));
  recalculateCosts();
}

function cachePriceInput(idx, value) {
  const row = entryRows[idx];
  if (!row) return;
  row.price = String(value || '');
}

function onQtyInput(idx, value) {
  const row = entryRows[idx];
  if (!row) return;
  row.qty = Math.max(1, roundYen(value || 1));
  recalculateCosts();
}

function cacheQtyInput(idx, value) {
  const row = entryRows[idx];
  if (!row) return;
  row.qty = String(value || '');
}

function cachePointInput(idx, value) {
  const row = entryRows[idx];
  if (!row) return;
  row.point = String(value || '');
}

function recalculateCostsWithFocusId_(focusId, cursorPos) {
  recalculateCosts();
  if (!focusId) return;
  window.setTimeout(function() {
    const el = document.getElementById(String(focusId));
    if (!el) return;
    try {
      el.focus({ preventScroll: true });
    } catch (err) {
      try {
        el.focus();
      } catch (err2) {
        // no-op
      }
    }
    if (typeof cursorPos === 'number' && typeof el.setSelectionRange === 'function') {
      const len = String(el.value || '').length;
      const pos = Math.max(0, Math.min(cursorPos, len));
      try {
        el.setSelectionRange(pos, pos);
      } catch (err3) {
        // no-op
      }
    }
  }, 0);
}

function onPointInputLive(idx, value, cursorPos) {
  const row = entryRows[idx];
  if (!row) return;
  row.point = String(value || '');
  recalculateCostsWithFocusId_('entry-point-' + idx, cursorPos);
}

function onPointInput(idx, value) {
  const row = entryRows[idx];
  if (!row) return;
  row.point = Math.max(0, roundYen(value));
  recalculateCosts();
}

function cacheExpenseAllocInput(idx, value) {
  const row = entryRows[idx];
  if (!row) return;
  row.expenseAlloc = String(value || '');
}

function onExpenseAllocInputLive(idx, value, cursorPos) {
  const row = entryRows[idx];
  if (!row) return;
  row.expenseAlloc = String(value || '');
  recalculateCostsWithFocusId_('entry-expense-alloc-' + idx, cursorPos);
}

function onExpenseAllocInput(idx, value) {
  const row = entryRows[idx];
  if (!row) return;
  row.expenseAlloc = Math.max(0, roundYen(value));
  recalculateCosts();
}

function cacheRowPaymentInput(idx, value) {
  const row = entryRows[idx];

  row.paymentMethod = String(value || '');
}

function onRowPaymentInput(idx, value) {

  if (!row) return;

}

function addEntryRow(afterIdx) {
  const pos = Math.max(0, Math.min(afterIdx + 1, entryRows.length));
  entryRows.splice(pos, 0, createEmptyEntryRow());
  if (entryInputStageState_.active && entryInputStageState_.currentRow >= pos) {
    entryInputStageState_.currentRow += 1;
  }
  renderEntryRows();
  recalculateCosts();
}

function removeEntryRow(idx) {
  const removingActive = entryInputStageState_.active && entryInputStageState_.currentRow === idx;
  if (entryRows.length <= 1) {
    entryRows[0] = createEmptyEntryRow();
    if (removingActive) {
      closeEntryInputStage_();
    }
  } else {
    entryRows.splice(idx, 1);
    if (removingActive) {
      closeEntryInputStage_();
    } else if (entryInputStageState_.active && entryInputStageState_.currentRow > idx) {
      entryInputStageState_.currentRow -= 1;
    }
  }
  if (entryRows.length <= 1) {
    setEntryListDeleteMode_('product', false);
  }
  renderEntryRows();
  recalculateCosts();
}

      : '';
    const taxAmount = (typeof row.taxBasePrice !== 'undefined')
      ? Math.max(0, roundYen(row.price) - roundYen(row.taxBasePrice))

    const canRemoveRow = canDeleteEntryRows && idx > 0;
    const mainRowClass = canRemoveRow
      ? `entry-main-row entry-swipe-delete-row${isEntryDeleteMode ? ' is-swipe-open' : ''}`

              ${pointCell}

function getActiveEntryRows() {
  const lineItemIndividualMode = isLineItemIndividualMode_();
  const active = [];
  for (let i = 0; i < entryRows.length; i++) {
    const row = entryRows[i];
    const hasAnyInput = !!String(row.productInput || '').trim() || roundYen(row.price) > 0;
    if (!hasAnyInput) continue;

    if (!String(row.name || '').trim()) {
      throw new Error(`商品${i + 1} の商品名を入力してください`);
    }
    if (roundYen(row.price) <= 0) {
      throw new Error(`商品${i + 1} の提示金額を入力してください`);
    }
    if (roundYen(row.qty) <= 0) {
      throw new Error(`商品${i + 1} の個数を入力してください`);
    }
    if (lineItemIndividualMode && !String(row.paymentMethod || '').trim()) {
      throw new Error(`商品${i + 1} の支払い方法を入力してください`);
    }

    active.push(row);
  }
  if (!active.length) {
    throw new Error('商品行が空です');
  }
  return active;
}

function getActiveExpenseRows_() {
  return expenseList.filter(ex => String(ex.name || '').trim() && roundYen(ex.amount) > 0);
}

function recalculateCosts() {
  const pointAllocation = isPointAllocationMode_();
  const expenseAllocation = isExpenseAllocationMode_();

  entryRows.forEach(row => {
    row.price = Math.max(0, roundYen(row.price));
    row.qty = Math.max(1, roundYen(row.qty || 1));
    if (pointAllocation) {
      row.point = 0;
    } else {
      row.point = Math.max(0, roundYen(row.point || 0));
    }
    if (expenseAllocation) {
      row.expenseAlloc = 0;
    } else {
      row.expenseAlloc = Math.max(0, roundYen(row.expenseAlloc || 0));
    }
    row.baseCost = row.price;
    row.cost = row.price;
    row.unitPrice = row.qty > 0 ? Math.round(row.price / row.qty) : row.price;
  });

  const targetRows = entryRows.filter(row => String(row.name || '').trim() && row.price > 0);
  if (!targetRows.length) {
    renderEntryRows();
    if (!pointAllocation) {
      renderPointArea();
    }
    renderSummary();
    return;
  }

  if (pointAllocation) {
    pointTotal = Math.max(0, roundYen(pointTotal || 0));
    const totalPrice = targetRows.reduce((sum, row) => sum + roundYen(row.price), 0);
    let remainPoint = pointTotal;

    targetRows.forEach((row, idx) => {
      let pointAlloc = 0;
      if (totalPrice > 0 && remainPoint > 0) {
        if (idx === targetRows.length - 1) {
          pointAlloc = remainPoint;
        } else {
          pointAlloc = Math.round(pointTotal * (row.price / totalPrice));
          pointAlloc = Math.min(pointAlloc, remainPoint);
        }
      }
      remainPoint -= pointAlloc;
      row.point = pointAlloc;
      row.baseCost = Math.max(0, row.price - pointAlloc);
    });
  } else {
    targetRows.forEach(row => {
      row.point = Math.max(0, roundYen(row.point || 0));
      row.baseCost = Math.max(0, row.price - row.point);
    });
    pointTotal = targetRows.reduce((sum, row) => sum + roundYen(row.point), 0);
  }

  const totalExpenseInput = getActiveExpenseRows_().reduce((sum, ex) => sum + roundYen(ex.amount), 0);
  if (expenseAllocation) {
    const totalBaseCost = targetRows.reduce((sum, row) => sum + roundYen(row.baseCost), 0);
    let remainExpense = totalExpenseInput;

    targetRows.forEach((row, idx) => {
      let alloc = 0;
      if (totalExpenseInput > 0 && totalBaseCost > 0) {
        if (idx === targetRows.length - 1) {
          alloc = remainExpense;
        } else {
          alloc = Math.round(totalExpenseInput * (row.baseCost / totalBaseCost));
          alloc = Math.min(alloc, remainExpense);
        }
      }
      remainExpense -= alloc;
      row.expenseAlloc = alloc;
      row.cost = Math.max(0, roundYen(row.baseCost) + alloc);
      row.unitPrice = row.qty > 0 ? Math.round(row.cost / row.qty) : row.cost;
    });
  } else {
    targetRows.forEach(row => {
      row.expenseAlloc = Math.max(0, roundYen(row.expenseAlloc || 0));
      row.cost = Math.max(0, roundYen(row.baseCost) + row.expenseAlloc);
      row.unitPrice = row.qty > 0 ? Math.round(row.cost / row.qty) : row.cost;
    });
  }

  renderEntryRows();
  if (!pointAllocation) {
    renderPointArea();
  }
  renderSummary();
}

function getTaxRate_() {
  const rateInput = document.getElementById('tax-rate');
  return toNumber((rateInput && rateInput.value) || '10') / 100;
}

function applyTaxToAll_() {
  const rate = getTaxRate_();
  const targets = entryRows.filter(row => String(row.name || '').trim() && roundYen(row.price) > 0);
  if (!targets.length) {
    alert('税加算対象の商品がありません');
    return false;
  }

  targets.forEach(row => {
    row.taxBasePrice = roundYen(row.price);
    row.price = Math.floor(row.taxBasePrice * (1 + rate));
  });
  recalculateCosts();
  return true;
}

function removeTaxFromAll_() {
  entryRows.forEach(row => {
    if (typeof row.taxBasePrice !== 'undefined') {
      row.price = roundYen(row.taxBasePrice);
      delete row.taxBasePrice;
    }
  });
  recalculateCosts();
}

function renderPointArea() {
  const isVariantB = isFooterConsolidatedMode_();
  const pointTotalFromRows = entryRows.reduce((sum, row) => {
    if (!String(row.name || '').trim() || roundYen(row.price) <= 0) return sum;
    return sum + Math.max(0, roundYen(row.point || 0));
  }, 0);
  if (!isPointAllocationMode_()) {
    pointTotal = pointTotalFromRows;
  }

  const pointPanelOpen = !!detailPanelState.point;
  if (entryInputStageState_.active && entryInputStageState_.scope === 'point' && !pointPanelOpen) {
    closeEntryInputStage_();
  }
  const pointToggleBtnClass = pointPanelOpen ? 'btn-icon btn-icon-minus panel-head-toggle' : 'btn-icon btn-icon-plus panel-head-toggle';
  const pointToggleLabel = pointPanelOpen ? 'ポイント入力エリアを閉じる' : 'ポイント入力エリアを開く';
  let modeContent = '';
  if (pointPanelOpen && isPointAllocationMode_()) {
    modeContent = `

        <div class="point-input-row b-panel-input-row">
          <input type="text" id="point-total-display" class="inline-number point-stage-trigger entry-stage-trigger" inputmode="numeric" pattern="\\d*" value="${pointTotal || ''}" readonly onfocus="this.blur(); openPointInputStage(this)" onclick="openPointInputStage(this)" aria-label="ポイント/割引入力">
          <span class="point-input-unit">pt / 円</span>
        </div>

  } else if (pointPanelOpen) {
    modeContent = `

        <div class="entry-line-title">ポイント個別入力</div>
        <div class="note-text">商品入力テーブルの2行目（補助情報）で入力してください。</div>

function updatePointTotal() {
  const input = document.getElementById('point-total') || document.getElementById('point-total-display');
  if (!input) return;
  pointTotal = Math.max(0, roundYen(input.value || 0));
  recalculateCosts();
}

function onPointModeChange(mode) {

  setLineItemIndividualMode_(useIndividual);
}

  const row = expenseList[idx];

function onExpenseNameInput(idx, value) {
  const row = expenseList[idx];

  recalculateCosts();
}

function onExpenseAmountInput(idx, value) {
  const row = expenseList[idx];
  if (!row) return;
  row.amount = String(value || '');
  recalculateCosts();
}

function onExpenseAmountBlur(idx, value) {
  const row = expenseList[idx];
  if (!row) return;
  row.amount = Math.max(0, roundYen(value));
  recalculateCosts();
}

function addExpenseRow(afterIdx) {
  const pos = Math.max(0, Math.min(afterIdx + 1, expenseList.length));
  expenseList.splice(pos, 0, createEmptyExpenseRow());
  if (entryInputStageState_.active && entryInputStageState_.scope === 'expense' && entryInputStageState_.expenseIdx >= pos) {
    entryInputStageState_.expenseIdx += 1;
  }
  renderExpenseArea();
}

function removeExpenseRow(idx) {
  const removingActive = entryInputStageState_.active &&
    entryInputStageState_.scope === 'expense' &&
    entryInputStageState_.expenseIdx === idx;
  if (expenseList.length <= 1) {
    expenseList[0] = createEmptyExpenseRow();
    if (removingActive) {
      closeEntryInputStage_();
    }
  } else {
    expenseList.splice(idx, 1);
    if (removingActive) {
      closeEntryInputStage_();
    } else if (entryInputStageState_.active && entryInputStageState_.scope === 'expense' && entryInputStageState_.expenseIdx > idx) {
      entryInputStageState_.expenseIdx -= 1;
    }
  }
  if (expenseList.length <= 1) {
    setEntryListDeleteMode_('expense', false);
  }
  renderExpenseArea();
  recalculateCosts();
}

function onExpenseModeChange(mode) {

function formatDateInput(el) {
  if (!el) return;
  el.value = normalizeDateDigits_(el.value);
}

function normalizeDateDigits_(value) {
  let v = String(value || '').replace(/[^0-9]/g, '');
  if (v.length > 8) v = v.slice(0, 8);
  return v;
}

function digitsToIsoDate_(value) {
  const v = normalizeDateDigits_(value);
  if (v.length !== 8) return '';
  return v.replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3');
}

function isoDateToDigits_(value) {
  return normalizeDateDigits_(value);
}

function onDateTextInput(targetId, pickerId, value) {
  const target = document.getElementById(targetId);
  if (!target) return;
  target.value = normalizeDateDigits_(value);
  syncDatePickerFromText_(targetId, pickerId);
}

function syncDatePickerFromText_(targetId, pickerId) {
  const target = document.getElementById(targetId);
  const picker = document.getElementById(pickerId);
  if (!target || !picker) return;
  picker.value = digitsToIsoDate_(target.value);
}

function openDatePickerFromText(targetId, pickerId) {
  const picker = document.getElementById(pickerId);
  if (!picker) return false;
  syncDatePickerFromText_(targetId, pickerId);
  if (typeof picker.showPicker === 'function') {
    try {
      picker.showPicker();
      return true;
    } catch (err3) {
      // showPicker非対応/制限時はclickにフォールバック
    }
  }
  try {
    picker.focus({ preventScroll: true });
  } catch (err) {
    try {
      picker.focus();
    } catch (err2) {
      // no-op
    }
  }
  try {
    picker.click();
    return true;
  } catch (err4) {
    // no-op
  }
  alert('カレンダーを開けませんでした。日付欄（YYYY-MM-DD）を直接タップして選択してください。');
  return false;
}

function onDatePickerChange(targetId, pickerId) {
  const target = document.getElementById(targetId);
  const picker = document.getElementById(pickerId);
  if (!target || !picker) return;
  target.value = isoDateToDigits_(picker.value);
}

function restoreDraftIfNeeded_() {
  const token = getQueryParam_('token');
  if (!token) return;

  google.script.run
    .withSuccessHandler(function(payload) {
      applyDraftPayload_(payload);
    })
    .withFailureHandler(showError)
    .getEntryDraftForConfirm(token);
}

function applyDraftPayload_(payload) {
  const p = payload || {};
  const entries = Array.isArray(p.entries) ? p.entries : [];
  const expenses = Array.isArray(p.expenses) ? p.expenses : [];
  const info = p.commonInfo || {};

  const restoreIndividualMode =
    String(p.pointMode || 'allocation') === 'individual' ||
    String(p.expenseMode || 'allocation') === 'individual';
  pointInputMode = restoreIndividualMode ? 'individual' : 'allocation';
  expenseInputMode = restoreIndividualMode ? 'individual' : 'allocation';

  entryRows = entries.map(function(item) {
    const productNo = String(item[0] || '').trim();
    const name = String(item[1] || '').trim();
    const price = roundYen(item[2]);
    const point = roundYen(item[3]);
    const cost = roundYen(item[4]);
    const qty = Math.max(1, roundYen(item[5] || 1));
    const unitPrice = roundYen(item[6]);
    const expenseAlloc = roundYen(item[7]);
    const paymentMethod = String(item[8] || '').trim();
    return {
      productInput: productNo && name ? productNo + '：' + name : (name || productNo),
      productNo: productNo,
      name: name,
      price: price,
      qty: qty,
      point: point,
      expenseAlloc: expenseAlloc,
      paymentMethod: paymentMethod,
      baseCost: Math.max(0, price - point),
      cost: cost,
      unitPrice: unitPrice
    };
  });
  if (!entryRows.length) {
    entryRows = [createEmptyEntryRow()];
  }

  expenseList = expenses.map(function(ex) {
    return {
      name: String(ex.name || '').trim(),
      amount: roundYen(ex.amount),
      memo: String(ex.memo || '').trim()
    };
  });
  if (!expenseList.length) {
    expenseList = [createEmptyExpenseRow()];
  }

  pointTotal = entryRows.reduce(function(sum, row) {
    if (!String(row.name || '').trim() || roundYen(row.price) <= 0) return sum;
    return sum + Math.max(0, roundYen(row.point || 0));
  }, 0);
  detailPanelState.expense = expenses.some(function(ex) {
    return String(ex.name || '').trim() || roundYen(ex.amount || 0) > 0 || String(ex.memo || '').trim();
  });
  detailPanelState.point = isPointAllocationMode_() && pointTotal > 0;

  recalculateCosts();
  renderExpenseArea();
  renderPointArea();
  renderSummary();
  renderCommonInfo();

  const dateInput = document.getElementById('common-date');
  const datePicker = document.getElementById('common-date-picker');
  const supplierInput = document.getElementById('common-supplier');
  const paymentInput = document.getElementById('common-payment');
  const infoPayment = String(info.payment || '').trim();
  if (infoPayment && infoPayment !== '個別入力') {
    commonPaymentCache = infoPayment;
  }
  if (dateInput) dateInput.value = normalizeDateDigits_(String(info.date || '').trim());
  if (dateInput && datePicker) syncDatePickerFromText_('common-date', 'common-date-picker');
  if (supplierInput) supplierInput.value = String(info.supplier || '').trim();
  if (paymentInput) paymentInput.value = infoPayment;

  updateTopHelperButtons_();
}

function buildEntryPayload(rows) {
  return rows.map(row => [
    String(row.productNo || '').trim(),
    String(row.name || '').trim(),
    roundYen(row.price),
    roundYen(row.point),
    roundYen(row.cost),
    Math.max(1, roundYen(row.qty)),
    roundYen(row.unitPrice),
    roundYen(row.expenseAlloc),
    String(row.paymentMethod || '').trim()
  ]);
}

function showFinalConfirm() {
  try {
    if (entryInputStageState_.active) {
      commitEntryInputStageStep_();
      closeEntryInputStage_();
    }
    recalculateCosts();

    const lineItemIndividualMode = isLineItemIndividualMode_();
    const date = normalizeDateDigits_(String((document.getElementById('common-date') && document.getElementById('common-date').value) || '').trim());
    const supplier = (document.getElementById('common-supplier').value || '').trim();
    const payment = lineItemIndividualMode
      ? '個別入力'
      : (document.getElementById('common-payment').value || '').trim();

    if (!date || !supplier || (!lineItemIndividualMode && !payment)) {
      alert('共通項目（仕入日/仕入先/支払い方法）を入力してください');
      return;
    }

    const activeRows = getActiveEntryRows();
    const payloadEntries = buildEntryPayload(activeRows);
    const payloadExpenses = (isExpenseAllocationMode_() ? getActiveExpenseRows_() : []).map(ex => ({
      name: String(ex.name || '').trim(),
      amount: roundYen(ex.amount),
      memo: String(ex.memo || '').trim()
    }));
    pendingPayload = {
      entries: payloadEntries,
      commonInfo: { date: date, supplier: supplier, payment: payment },
      expenses: payloadExpenses,
      pointMode: pointInputMode,
      expenseMode: expenseInputMode
    };

    renderFinalConfirm_(activeRows, payloadExpenses, pendingPayload.commonInfo, pendingPayload.pointMode, pendingPayload.expenseMode);
    showConfirmPage_();
    scrollAppBodyToTop_();
  } catch (err) {
    showError(err);
  }
}
