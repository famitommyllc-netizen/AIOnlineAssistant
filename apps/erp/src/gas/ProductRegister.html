<html>
<head>
  <base target="_top">

</head>
<body class="entry-app-layout entry-b-layout">
  <div id="entry-app-shell" class="entry-app-shell">
    <header id="entry-fixed-header" class="entry-fixed-header">
      <div class="entry-fixed-header-inner">
        <div class="entry-fixed-header-title-wrap">
          <h1 class="entry-fixed-header-title">商品登録</h1>
          <div id="entry-fixed-header-file" class="entry-fixed-header-file">ProductRegister.html</div>
        </div>
        <div id="entry-fixed-header-state" class="entry-fixed-header-state">入力</div>
      </div>
    </header>
    <main id="entry-scroll-body" class="entry-scroll-body">
  <div class="section">
    <h2 class="section-title">商品新規登録</h2>
    <div class="note-text">商品登録も統一テーブルUIで入力します（1行固定）。</div>
    <div id="product-table-area"></div>
    <div class="button-row">
      <button type="button" class="btn-main" onclick="registerProduct()">登録</button>
      <span id="status"></span>
    </div>
  </div>
  </main>
  <footer id="entry-fixed-footer" class="entry-fixed-footer">
    <nav class="entry-bottom-nav" aria-label="Product 操作">
      <button type="button" id="footer-home-btn" class="entry-bottom-nav-btn" onclick="handleFooterHomeClick()">
        <span class="entry-bottom-nav-icon">H</span>
        <span class="entry-bottom-nav-label">ホーム</span>
      </button>
      <button type="button" id="footer-display-btn" class="entry-bottom-nav-btn" onclick="handleFooterDisplaySettingsClick()">
        <span class="entry-bottom-nav-icon">UI</span>
        <span class="entry-bottom-nav-label">表示</span>
      </button>
      <button type="button" id="footer-detail-btn" class="entry-bottom-nav-btn is-placeholder" onclick="handleFooterPlaceholderClick()">
        <span class="entry-bottom-nav-icon">-</span>
        <span class="entry-bottom-nav-label"></span>
      </button>
      <button type="button" id="footer-tax-btn" class="entry-bottom-nav-btn is-placeholder" onclick="handleFooterPlaceholderClick()">
        <span class="entry-bottom-nav-icon">-</span>
        <span class="entry-bottom-nav-label"></span>
      </button>
      <button type="button" id="footer-individual-btn" class="entry-bottom-nav-btn" onclick="handleFooterPlaceholderClick()">
        <span class="entry-bottom-nav-icon">IND</span>
        <span class="entry-bottom-nav-label">個別</span>
      </button>
    </nav>
  </footer>

  <script>
function uiEscapeHtml_(value) {
  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function uiBuildOpButtons_(idx, opts) {
  var o = opts || {};
  if (!o.show) {
    return '<div class="inline-value">固定</div>';
  }

  var addLabel = uiEscapeHtml_(o.addLabel || '＋行追加');
  var removeLabel = uiEscapeHtml_(o.removeLabel || '−削除');
  var addFn = String(o.onAdd || '');
  var removeFn = String(o.onRemove || '');

  var addBtn = addFn
    ? '<button type="button" class="btn-main" onclick="' + addFn + '(' + idx + ')">' + addLabel + '</button>'
    : '';
  var removeBtn = removeFn
    ? '<button type="button" class="btn-sub" onclick="' + removeFn + '(' + idx + ')">' + removeLabel + '</button>'
    : '';

  return '<div class="inline-actions">' + addBtn + removeBtn + '</div>';
}

function uiBuildInputTable_(config) {
  var c = config || {};
  var title = c.title ? '<div class="entry-line-title">' + uiEscapeHtml_(c.title) + '</div>' : '';
  var columns = Array.isArray(c.columns) ? c.columns : [];
  var includeOps = c.includeOps !== false;
  var bodyHtml = String(c.bodyHtml || '');
  var note = c.note ? '<div class="note-text" style="margin-top:0.45em;">' + uiEscapeHtml_(c.note) + '</div>' : '';

  var header = '<th class="col-no">No</th>';
  for (var i = 0; i < columns.length; i++) {
    var col = columns[i] || {};
    var cls = col.className ? ' ' + uiEscapeHtml_(col.className) : '';
    header += '<th class="' + cls.trim() + '">' + uiEscapeHtml_(col.label || '') + '</th>';
  }
  if (includeOps) {
    header += '<th class="col-action">操作</th>';
  }

  return '' +
    '<div class="entry-line-card unified-entry-card">' +
      title +
      '<div class="inline-scroll">' +
        '<table class="entry-inline-table unified-input-table">' +
          '<tr>' + header + '</tr>' +
          bodyHtml +
        '</table>' +
      '</div>' +
      note +
    '</div>';
}
  </script>
  <script>
let productRow = {};
const PRODUCT_DISPLAY_SETTINGS_STORAGE_KEY_ = 'entryDisplaySettings.v1';
const PRODUCT_DISPLAY_SETTINGS_DEFAULTS_ = {
  h1FontPx: 22, h2FontPx: 28, thFontPx: 36, valueFontPx: 48, dropdownFontPx: 28, helperFontPx: 30,
  headerFontPx: 24, footerFontPx: 36, noteFontPx: 22, buttonFontPx: 48, borderWidth: 2, fontWeight: 500
};

window.onload = function() {
  initializeProductPageShell_();
  productRow = createEmptyProductRow();
  renderProductRow();
};

function clampDisplaySetting_(value, min, max, fallback) {
  const n = Number(value);
  if (!Number.isFinite(n)) return fallback;
  return Math.max(min, Math.min(max, Math.round(n)));
}

function normalizeDisplaySettings_(input) {
  const src = input || {};
  return {
    h1FontPx: clampDisplaySetting_(src.h1FontPx, 12, 96, PRODUCT_DISPLAY_SETTINGS_DEFAULTS_.h1FontPx),
    h2FontPx: clampDisplaySetting_(src.h2FontPx, 12, 96, PRODUCT_DISPLAY_SETTINGS_DEFAULTS_.h2FontPx),
    thFontPx: clampDisplaySetting_(src.thFontPx, 10, 96, PRODUCT_DISPLAY_SETTINGS_DEFAULTS_.thFontPx),
    valueFontPx: clampDisplaySetting_(src.valueFontPx, 10, 96, PRODUCT_DISPLAY_SETTINGS_DEFAULTS_.valueFontPx),
    dropdownFontPx: clampDisplaySetting_(src.dropdownFontPx, 10, 96, PRODUCT_DISPLAY_SETTINGS_DEFAULTS_.dropdownFontPx),
    helperFontPx: clampDisplaySetting_(src.helperFontPx, 10, 96, PRODUCT_DISPLAY_SETTINGS_DEFAULTS_.helperFontPx),
    headerFontPx: clampDisplaySetting_(src.headerFontPx, 10, 96, PRODUCT_DISPLAY_SETTINGS_DEFAULTS_.headerFontPx),
    footerFontPx: clampDisplaySetting_(src.footerFontPx, 10, 96, PRODUCT_DISPLAY_SETTINGS_DEFAULTS_.footerFontPx),
    noteFontPx: clampDisplaySetting_(src.noteFontPx, 10, 96, PRODUCT_DISPLAY_SETTINGS_DEFAULTS_.noteFontPx),
    buttonFontPx: clampDisplaySetting_(src.buttonFontPx, 10, 96, PRODUCT_DISPLAY_SETTINGS_DEFAULTS_.buttonFontPx),
    borderWidth: clampDisplaySetting_(src.borderWidth, 1, 8, PRODUCT_DISPLAY_SETTINGS_DEFAULTS_.borderWidth),
    fontWeight: clampDisplaySetting_(src.fontWeight, 400, 700, PRODUCT_DISPLAY_SETTINGS_DEFAULTS_.fontWeight)
  };
}

function applyDisplaySettingsFromStorage_() {
  let settings = PRODUCT_DISPLAY_SETTINGS_DEFAULTS_;
  try {
    const raw = window.localStorage.getItem(PRODUCT_DISPLAY_SETTINGS_STORAGE_KEY_);
    if (raw) settings = Object.assign({}, settings, JSON.parse(raw));
  } catch (err) {}
  const s = normalizeDisplaySettings_(settings);
  const root = document.documentElement;
  root.style.setProperty('--entry-ui-border-width', s.borderWidth + 'px');
  root.style.setProperty('--entry-ui-font-weight', String(s.fontWeight));
  root.style.setProperty('--entry-ui-h1-font-px', s.h1FontPx + 'px');
  root.style.setProperty('--entry-ui-title-font-px', s.h2FontPx + 'px');
  root.style.setProperty('--entry-ui-summary-header-font-px', s.thFontPx + 'px');
  root.style.setProperty('--entry-ui-value-font-px', s.valueFontPx + 'px');
  root.style.setProperty('--entry-ui-helper-font-px', s.helperFontPx + 'px');
  root.style.setProperty('--entry-ui-note-font-px', s.noteFontPx + 'px');
  root.style.setProperty('--entry-ui-button-font-px', s.buttonFontPx + 'px');
  root.style.setProperty('--entry-ui-header-font-px', s.headerFontPx + 'px');
  root.style.setProperty('--entry-ui-footer-font-px', s.footerFontPx + 'px');
  root.style.setProperty('--entry-ui-dropdown-font-px', s.dropdownFontPx + 'px');
}

function initializeProductPageShell_() {
  applyDisplaySettingsFromStorage_();
}

function buildWebAppPageUrl_(page, params) {
  try {
    const url = new URL(window.location.href);
    url.searchParams.set('page', String(page || 'home'));
    const p = params || {};
    Object.keys(p).forEach(function(key) {
      const value = p[key];
      if (value === undefined || value === null || String(value).trim() === '') {
        url.searchParams.delete(key);
        return;
      }
      url.searchParams.set(key, String(value));
    });
    return url.toString();
  } catch (err) {
    return '';
  }
}

function navigateToWebAppPage_(page, params) {
  const url = buildWebAppPageUrl_(page, params || {});
  if (!url) return;
  window.location.href = url;
}

function handleFooterHomeClick() {
  navigateToWebAppPage_('home', {});
}

function handleFooterDisplaySettingsClick() {
  navigateToWebAppPage_('entry', { openDisplaySettings: '1', returnPage: 'product' });
}

function handleFooterPlaceholderClick() {
  // 商品登録では未使用
}

function createEmptyProductRow() {
  return {
    jan: '',
    name: '',
    category: '',
    maker: '',
    brand: '',
    sub: '',
    retailPrice: '',
    note: '',
    searchName: '',
    yomigana: '',
    assumedPrice: ''
  };
}

function toNumber(v) {
  const n = Number(v);
  return Number.isFinite(n) ? n : 0;
}

function roundYen(v) {
  return Math.round(toNumber(v));
}

function getProductNo(jan) {
  if (jan && jan.length >= 4) return String(jan).slice(-4);
  return String(Math.floor(Math.random() * 9000) + 1000);
}

function cacheProductField(key, value) {
  productRow[key] = String(value || '');
}

function renderProductRow() {
  const rowHtml = '' +
    '<tr>' +
      '<td class="col-no">1</td>' +
      '<td class="col-num"><input type="text" class="inline-number" maxlength="13" value="' + uiEscapeHtml_(productRow.jan) + '" oninput="cacheProductField(\'jan\', this.value)"></td>' +
      '<td class="col-item"><input type="text" class="inline-input" value="' + uiEscapeHtml_(productRow.name) + '" oninput="cacheProductField(\'name\', this.value)"></td>' +
      '<td class="col-item"><input type="text" class="inline-input" value="' + uiEscapeHtml_(productRow.category) + '" oninput="cacheProductField(\'category\', this.value)"></td>' +
      '<td class="col-item"><input type="text" class="inline-input" value="' + uiEscapeHtml_(productRow.maker) + '" oninput="cacheProductField(\'maker\', this.value)"></td>' +
      '<td class="col-item"><input type="text" class="inline-input" value="' + uiEscapeHtml_(productRow.brand) + '" oninput="cacheProductField(\'brand\', this.value)"></td>' +
      '<td class="col-item"><input type="text" class="inline-input" value="' + uiEscapeHtml_(productRow.sub) + '" oninput="cacheProductField(\'sub\', this.value)"></td>' +
      '<td class="col-num"><input type="text" class="inline-number" inputmode="numeric" pattern="\\d*" value="' + uiEscapeHtml_(productRow.retailPrice) + '" oninput="cacheProductField(\'retailPrice\', this.value)"></td>' +
      '<td class="col-item"><input type="text" class="inline-input" value="' + uiEscapeHtml_(productRow.note) + '" oninput="cacheProductField(\'note\', this.value)"></td>' +
      '<td class="col-item"><input type="text" class="inline-input" value="' + uiEscapeHtml_(productRow.searchName) + '" oninput="cacheProductField(\'searchName\', this.value)"></td>' +
      '<td class="col-item"><input type="text" class="inline-input" value="' + uiEscapeHtml_(productRow.yomigana) + '" oninput="cacheProductField(\'yomigana\', this.value)"></td>' +
      '<td class="col-num"><input type="text" class="inline-number" inputmode="numeric" pattern="\\d*" value="' + uiEscapeHtml_(productRow.assumedPrice) + '" oninput="cacheProductField(\'assumedPrice\', this.value)"></td>' +
      '<td class="col-action"><div class="inline-value">1行固定</div></td>' +
    '</tr>';

  document.getElementById('product-table-area').innerHTML = uiBuildInputTable_({
    title: '商品入力（1行固定）',
    columns: [
      { label: 'JAN', className: 'col-num' },
      { label: '商品名*', className: 'col-item' },
      { label: 'カテゴリ', className: 'col-item' },
      { label: 'メーカー', className: 'col-item' },
      { label: 'ブランド', className: 'col-item' },
      { label: 'サブ', className: 'col-item' },
      { label: '希望小売価格', className: 'col-num' },
      { label: '備考', className: 'col-item' },
      { label: '検索名', className: 'col-item' },
      { label: '読み仮名', className: 'col-item' },
      { label: '想定売価', className: 'col-num' }
    ],
    includeOps: true,
    bodyHtml: rowHtml
  });
}

function registerProduct() {
  const jan = String(productRow.jan || '').trim();
  const name = String(productRow.name || '').trim();
  if (!name) {
    alert('商品名は必須です');
    return;
  }

  const info = {
    productNo: getProductNo(jan),
    jan: jan,
    name: name,
    category: String(productRow.category || '').trim(),
    maker: String(productRow.maker || '').trim(),
    brand: String(productRow.brand || '').trim(),
    sub: String(productRow.sub || '').trim(),
    retailPrice: roundYen(productRow.retailPrice || 0),
    note: String(productRow.note || '').trim(),
    searchName: String(productRow.searchName || '').trim(),
    yomigana: String(productRow.yomigana || '').trim(),
    assumedPrice: roundYen(productRow.assumedPrice || 0)
  };

  const status = document.getElementById('status');
  status.textContent = '登録中...';
  google.script.run
    .withSuccessHandler(function(res) {
      status.textContent = (res && res.msg ? res.msg : '商品情報を登録しました') + ' (' + (res && res.productNo ? res.productNo : '') + ')';
      productRow = createEmptyProductRow();
      renderProductRow();
    })
    .withFailureHandler(function(err) {
      status.textContent = '';
      const msg = err && err.message ? err.message : String(err);
      alert('エラー: ' + msg);
    })
    .registerNewProduct(info);
}
  </script>
</body>
