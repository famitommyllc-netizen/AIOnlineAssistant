  <?!= HtmlService.createHtmlOutputFromFile('DisplaySettingsPanel').getContent(); ?>

  <script>
    // 今日の日付をセット
    (function() {
      var d = new Date();
      var y = d.getFullYear();
      var m = String(d.getMonth() + 1).padStart(2, '0');
      var day = String(d.getDate()).padStart(2, '0');
      document.getElementById('today-date').value = y + '-' + m + '-' + day;
    })();

    function loadToday() {
      var dateVal = document.getElementById('today-date').value;
      if (!dateVal) return;
      var status = document.getElementById('today-status');
      var content = document.getElementById('today-content');
      status.textContent = '読込中...';
      content.innerHTML = '';

      google.script.run
        .withSuccessHandler(function(report) {
          status.textContent = '';
          renderTodayReport(report);
        })
        .withFailureHandler(function(err) {
          status.textContent = 'エラー: ' + String(err && err.message || err);
        })
        .getPeriodReport('day', dateVal);
    }

    function renderTodayReport(report) {
      if (!report) return;
      var content = document.getElementById('today-content');
      var html = '';

      // サマリー
      var s = report.summary || {};
      html += '<div class="section-card today-summary" style="margin-bottom:0.5em;">';
      html += summaryItem_('仕入件数', (s.purchaseCount || 0) + '件');
      html += summaryItem_('仕入合計', '¥' + (s.purchaseCost || 0).toLocaleString());
      html += summaryItem_('売上件数', (s.salesCount || 0) + '件');
      html += summaryItem_('売上合計', '¥' + (s.salesAmount || 0).toLocaleString());
      html += summaryItem_('利益', '¥' + (s.profit || 0).toLocaleString());
      html += '</div>';

      // 仕入一覧
      var purchases = report.purchases || [];
      html += '<div class="today-section-title">仕入（' + purchases.length + '件）</div>';
      if (purchases.length) {
        html += '<div class="section-card" style="padding:0;"><div class="table-wrap"><table class="today-table">';
        html += '<tr><th>商品名</th><th>個別番号</th><th>原価</th><th>在庫数</th><th>伝票番号</th></tr>';
        purchases.forEach(function(r) {
          html += '<tr>' +
            '<td>' + esc(r.name || '') + '</td>' +
            '<td style="font-size:0.78em;">' + esc(r.inventoryId || '') + '</td>' +
            '<td>¥' + (r.cost || 0).toLocaleString() + '</td>' +
            '<td>' + (r.qty || 0) + '</td>' +
            '<td style="font-size:0.78em;">' + esc(r.slipNo || '') + '</td>' +
            '</tr>';
        });
        html += '</table></div></div>';
      } else {
        html += '<div class="today-empty">仕入なし</div>';
      }

      // 売上一覧
      var sales = report.sales || [];
      html += '<div class="today-section-title">売上（' + sales.length + '件）</div>';
      if (sales.length) {
        html += '<div class="section-card" style="padding:0;"><div class="table-wrap"><table class="today-table">';
        html += '<tr><th>商品名</th><th>個別番号</th><th>売上金額</th><th>利益</th><th>販売場所</th></tr>';
        sales.forEach(function(r) {
          html += '<tr>' +
            '<td>' + esc(r.name || '') + '</td>' +
            '<td style="font-size:0.78em;">' + esc(r.inventoryId || '') + '</td>' +
            '<td>¥' + (r.salesAmount || 0).toLocaleString() + '</td>' +
            '<td>¥' + (r.profit || 0).toLocaleString() + '</td>' +
            '<td>' + esc(r.place || '') + '</td>' +
            '</tr>';
        });
        html += '</table></div></div>';
      } else {
        html += '<div class="today-empty">売上なし</div>';
      }

      // 経費一覧
      var expenses = report.expenses || [];
      html += '<div class="today-section-title">経費（' + expenses.length + '件）</div>';
      if (expenses.length) {
        html += '<div class="section-card" style="padding:0;"><div class="table-wrap"><table class="today-table">';
        html += '<tr><th>内容</th><th>金額</th></tr>';
        expenses.forEach(function(r) {
          html += '<tr>' +
            '<td>' + esc(r.name || '') + '</td>' +
            '<td>¥' + (r.amount || 0).toLocaleString() + '</td>' +
            '</tr>';
        });
        html += '</table></div></div>';
      } else {
        html += '<div class="today-empty">経費なし</div>';
      }

      content.innerHTML = html;
    }

    function summaryItem_(label, value) {
      return '<div class="today-summary-item">' +
        '<div class="today-summary-label">' + esc(label) + '</div>' +
        '<div class="today-summary-value">' + esc(value) + '</div>' +
        '</div>';
    }

    function printToday() { window.print(); }

    function esc(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function handleFooterDisplaySettingsClick() { openSharedDisplaySettingsModal_(); }

    function isWebAppRuntimeUrl_() {
      return /\/(exec|dev)(?:$|[?#])/i.test(String(window.location.href || ''));
    }
    function buildWebAppPageUrl_(page, params) {
      try {
        var url = new URL(window.location.href);
        url.searchParams.set('page', String(page || 'home'));
        var p = params || {};
        Object.keys(p).forEach(function(key) {
          var value = p[key];
          if (value === undefined || value === null || String(value).trim() === '') { url.searchParams.delete(key); return; }
          url.searchParams.set(key, String(value));
        });
        return url.toString();
      } catch (e) { return ''; }
    }
    function navigateToWebAppPage_(page, params) {
      var fallbackUrl = String(buildWebAppPageUrl_(page, params || {}) || '').trim();
      if (isWebAppRuntimeUrl_()) { if (fallbackUrl) window.location.href = fallbackUrl; return; }
      try {
        google.script.run
          .withSuccessHandler(function(url) {
            var dest = (url && String(url).trim()) ? String(url).trim() : fallbackUrl;
            if (dest) (window.top || window).location.href = dest;
          })
          .withFailureHandler(function() { if (fallbackUrl) (window.top || window).location.href = fallbackUrl; })
          .getWebAppPageUrl(String(page || 'home'), params || {});
      } catch (e) { if (fallbackUrl) (window.top || window).location.href = fallbackUrl; }
    }
    function handleFooterHomeClick() { navigateToWebAppPage_('home', {}); }

    (function() {
      initSharedDisplaySettings_();
      loadToday();
    })();
  </script>
</body>
</html>
