  <script>
function uiEscapeHtml_(value) {
  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function uiBuildOpButtons_(idx, opts) {
  var o = opts || {};
  if (!o.show) {
    return '<div class="inline-value">固定</div>';
  }

  var addLabel = uiEscapeHtml_(o.addLabel || '＋行追加');
  var removeLabel = uiEscapeHtml_(o.removeLabel || '−削除');
  var addFn = String(o.onAdd || '');
  var removeFn = String(o.onRemove || '');

  var addBtn = addFn
    ? '<button type="button" class="btn-main" onclick="' + addFn + '(' + idx + ')">' + addLabel + '</button>'
    : '';
  var removeBtn = removeFn
    ? '<button type="button" class="btn-sub" onclick="' + removeFn + '(' + idx + ')">' + removeLabel + '</button>'
    : '';

  return '<div class="inline-actions">' + addBtn + removeBtn + '</div>';
}

function uiBuildInputTable_(config) {
  var c = config || {};
  var title = c.title ? '<div class="entry-line-title">' + uiEscapeHtml_(c.title) + '</div>' : '';
  var columns = Array.isArray(c.columns) ? c.columns : [];
  var includeOps = c.includeOps !== false;
  var bodyHtml = String(c.bodyHtml || '');
  var note = c.note ? '<div class="note-text" style="margin-top:0.45em;">' + uiEscapeHtml_(c.note) + '</div>' : '';

  var header = '<th class="col-no">No</th>';
  for (var i = 0; i < columns.length; i++) {
    var col = columns[i] || {};
    var cls = col.className ? ' ' + uiEscapeHtml_(col.className) : '';
    header += '<th class="' + cls.trim() + '">' + uiEscapeHtml_(col.label || '') + '</th>';
  }
  if (includeOps) {
    header += '<th class="col-action">操作</th>';
  }

  return '' +
    '<div class="entry-line-card unified-entry-card">' +
      title +
      '<div class="inline-scroll">' +
        '<table class="entry-inline-table unified-input-table">' +
          '<tr>' + header + '</tr>' +
          bodyHtml +
        '</table>' +
      '</div>' +
      note +
    '</div>';
}
  </script>
  <script>
let expenseRows = [];
let expenseCandidates = [];
const EXPENSE_STAGE_STEPS_ = ['date', 'name', 'amount', 'memo'];
let expenseInputStageState_ = {
  active: false,
  rowIdx: -1,
  step: 'date',
  tempData: null
};
const EXPENSE_DISPLAY_SETTINGS_STORAGE_KEY_ = 'entryDisplaySettings.v1';
const EXPENSE_DISPLAY_SETTINGS_DEFAULTS_ = {
  h1FontPx: 22, h2FontPx: 28, thFontPx: 36, valueFontPx: 48, dropdownFontPx: 28, helperFontPx: 30,
  headerFontPx: 24, footerFontPx: 36, noteFontPx: 22, buttonFontPx: 48, borderWidth: 2, fontWeight: 500
};

window.onload = function() {
  initializeExpensePageShell_();
  expenseRows = [createEmptyExpenseRow()];
  renderExpenseRows();
  renderExpenseSummary();
  loadExpenseItems();
};

function clampDisplaySetting_(value, min, max, fallback) {
  const n = Number(value);
  if (!Number.isFinite(n)) return fallback;
  return Math.max(min, Math.min(max, Math.round(n)));
}

function normalizeDisplaySettings_(input) {
  const src = input || {};
  return {
    h1FontPx: clampDisplaySetting_(src.h1FontPx, 12, 96, EXPENSE_DISPLAY_SETTINGS_DEFAULTS_.h1FontPx),
    h2FontPx: clampDisplaySetting_(src.h2FontPx, 12, 96, EXPENSE_DISPLAY_SETTINGS_DEFAULTS_.h2FontPx),
    thFontPx: clampDisplaySetting_(src.thFontPx, 10, 96, EXPENSE_DISPLAY_SETTINGS_DEFAULTS_.thFontPx),
    valueFontPx: clampDisplaySetting_(src.valueFontPx, 10, 96, EXPENSE_DISPLAY_SETTINGS_DEFAULTS_.valueFontPx),
    dropdownFontPx: clampDisplaySetting_(src.dropdownFontPx, 10, 96, EXPENSE_DISPLAY_SETTINGS_DEFAULTS_.dropdownFontPx),
    helperFontPx: clampDisplaySetting_(src.helperFontPx, 10, 96, EXPENSE_DISPLAY_SETTINGS_DEFAULTS_.helperFontPx),
    headerFontPx: clampDisplaySetting_(src.headerFontPx, 10, 96, EXPENSE_DISPLAY_SETTINGS_DEFAULTS_.headerFontPx),
    footerFontPx: clampDisplaySetting_(src.footerFontPx, 10, 96, EXPENSE_DISPLAY_SETTINGS_DEFAULTS_.footerFontPx),
    noteFontPx: clampDisplaySetting_(src.noteFontPx, 10, 96, EXPENSE_DISPLAY_SETTINGS_DEFAULTS_.noteFontPx),
    buttonFontPx: clampDisplaySetting_(src.buttonFontPx, 10, 96, EXPENSE_DISPLAY_SETTINGS_DEFAULTS_.buttonFontPx),
    borderWidth: clampDisplaySetting_(src.borderWidth, 1, 8, EXPENSE_DISPLAY_SETTINGS_DEFAULTS_.borderWidth),
    fontWeight: clampDisplaySetting_(src.fontWeight, 400, 700, EXPENSE_DISPLAY_SETTINGS_DEFAULTS_.fontWeight)
  };
}

function applyDisplaySettingsFromStorage_() {
  let settings = EXPENSE_DISPLAY_SETTINGS_DEFAULTS_;
  try {
    const raw = window.localStorage.getItem(EXPENSE_DISPLAY_SETTINGS_STORAGE_KEY_);
    if (raw) settings = Object.assign({}, settings, JSON.parse(raw));
  } catch (err) {}
  const s = normalizeDisplaySettings_(settings);
  const root = document.documentElement;
  root.style.setProperty('--entry-ui-border-width', s.borderWidth + 'px');
  root.style.setProperty('--entry-ui-font-weight', String(s.fontWeight));
  root.style.setProperty('--entry-ui-h1-font-px', s.h1FontPx + 'px');
  root.style.setProperty('--entry-ui-title-font-px', s.h2FontPx + 'px');
  root.style.setProperty('--entry-ui-summary-header-font-px', s.thFontPx + 'px');
  root.style.setProperty('--entry-ui-value-font-px', s.valueFontPx + 'px');
  root.style.setProperty('--entry-ui-helper-font-px', s.helperFontPx + 'px');
  root.style.setProperty('--entry-ui-note-font-px', s.noteFontPx + 'px');
  root.style.setProperty('--entry-ui-button-font-px', s.buttonFontPx + 'px');
  root.style.setProperty('--entry-ui-header-font-px', s.headerFontPx + 'px');
  root.style.setProperty('--entry-ui-footer-font-px', s.footerFontPx + 'px');
  root.style.setProperty('--entry-ui-dropdown-font-px', s.dropdownFontPx + 'px');
}

function initializeExpensePageShell_() {
  initSharedDisplaySettings_();
}

function isWebAppRuntimeUrl_() {
  return /\/(exec|dev)(?:$|[?#])/i.test(String(window.location.href || ''));
}

function buildWebAppPageUrl_(page, params) {
  try {
    const url = new URL(window.location.href);
    url.searchParams.set('page', String(page || 'home'));
    const p = params || {};
    Object.keys(p).forEach(function(key) {
      const value = p[key];
      if (value === undefined || value === null || String(value).trim() === '') {
        url.searchParams.delete(key);
        return;
      }
      url.searchParams.set(key, String(value));
    });
    return url.toString();
  } catch (err) {
    const p = params || {};
    const query = ['page=' + encodeURIComponent(String(page || 'home'))];
    Object.keys(p).forEach(function(key) {
      if (p[key] === undefined || p[key] === null || String(p[key]).trim() === '') return;
      query.push(encodeURIComponent(key) + '=' + encodeURIComponent(String(p[key])));
    });
    return String(window.location.pathname || '') + '?' + query.join('&');
  }
}

function navigateToWebAppPage_(page, params) {
  const fallbackUrl = String(buildWebAppPageUrl_(page, params || {}) || '').trim();
  if (isWebAppRuntimeUrl_()) {
    if (fallbackUrl) window.location.href = fallbackUrl;
    return;
  }
  const canUseGasRun = (typeof google !== 'undefined') && google && google.script &&
    google.script.run && typeof google.script.run.getWebAppPageUrl === 'function';
  if (!canUseGasRun) {
    if (fallbackUrl) window.location.href = fallbackUrl;
    return;
  }
  google.script.run
    .withSuccessHandler(function(url) {
      const targetUrl = String(url || '').trim() || fallbackUrl;
      if (!targetUrl) return;
      try {
        if (window.top && window.top !== window.self) { window.top.location.href = targetUrl; return; }
      } catch (e) {}
      window.location.href = targetUrl;
    })
    .withFailureHandler(function() { if (fallbackUrl) window.location.href = fallbackUrl; })
    .getWebAppPageUrl(page, params || {});
}

function handleFooterHomeClick() {
  navigateToWebAppPage_('home', {});
}

function handleFooterDisplaySettingsClick() {
  openSharedDisplaySettingsModal_();
}

function handleFooterPlaceholderClick() {
  // 経費登録では未使用
}

function normalizeExpenseStageStep_(step) {
  const s = String(step || '').trim();
  return EXPENSE_STAGE_STEPS_.indexOf(s) >= 0 ? s : 'date';
}

function getExpenseStageLabel_(step) {
  if (step === 'name') return '内容';
  if (step === 'amount') return '金額';
  if (step === 'memo') return 'メモ';
  return '日付';
}

function getExpenseStagePlaceholder_(step) {
  if (step === 'name') return '内容を入力';
  if (step === 'amount') return '金額を入力';
  if (step === 'memo') return 'メモを入力';
  return 'YYYYMMDD';
}

function getExpenseStageActionLabel_(step) {
  return step === 'memo' ? '確定' : '次へ';
}

function closeExpenseInputStage_() {
  expenseInputStageState_.active = false;
  expenseInputStageState_.rowIdx = -1;
  expenseInputStageState_.step = 'date';
  expenseInputStageState_.tempData = null;
  document.body.classList.remove('entry-stage-active');
  const stageEl = document.getElementById('entry-input-stage');
  if (!stageEl) return;
  stageEl.classList.remove('is-open');
  stageEl.style.display = 'none';
  stageEl.innerHTML = '';
}

function onExpenseInputStageInput(value) {
  if (!expenseInputStageState_.active) return;
  const step = normalizeExpenseStageStep_(expenseInputStageState_.step);
  if (!expenseInputStageState_.tempData) expenseInputStageState_.tempData = {};
  expenseInputStageState_.tempData[step] = String(value || '');
}

function commitExpenseInputStageStep_() {
  if (!expenseInputStageState_.active) return;
  const idx = expenseInputStageState_.rowIdx;
  if (idx < 0 || idx >= expenseRows.length) return;
  const step = normalizeExpenseStageStep_(expenseInputStageState_.step);
  const inputEl = document.getElementById('expense-input-stage-field');
  const value = String((inputEl && inputEl.value) || '');
  onExpenseInputStageInput(value);
  if (step === 'date') {
    onExpenseDateBlur(idx, value);
    return;
  }
  if (step === 'name') {
    cacheExpenseField(idx, 'name', value);
    renderExpenseRows();
    return;
  }
  if (step === 'amount') {
    onExpenseAmountBlur(idx, value);
    return;
  }
  cacheExpenseField(idx, 'memo', value);
  renderExpenseRows();
}

function onExpenseInputStageAction() {
  if (!expenseInputStageState_.active) return;
  const step = normalizeExpenseStageStep_(expenseInputStageState_.step);
  commitExpenseInputStageStep_();
  const idx = EXPENSE_STAGE_STEPS_.indexOf(step);
  if (idx >= 0 && idx < EXPENSE_STAGE_STEPS_.length - 1) {
    expenseInputStageState_.step = EXPENSE_STAGE_STEPS_[idx + 1];
    renderExpenseInputStage_();
    return;
  }
  closeExpenseInputStage_();
}

function onExpenseInputStageBack() {
  if (!expenseInputStageState_.active) return;
  const step = normalizeExpenseStageStep_(expenseInputStageState_.step);
  const idx = EXPENSE_STAGE_STEPS_.indexOf(step);
  if (idx > 0) {
    expenseInputStageState_.step = EXPENSE_STAGE_STEPS_[idx - 1];
    renderExpenseInputStage_();
    return;
  }
  closeExpenseInputStage_();
}

function onExpenseInputStageKeydown(event) {
  if (!event || event.key !== 'Enter') return;
  event.preventDefault();
  onExpenseInputStageAction();
}

function renderExpenseInputStage_() {
  const stageEl = document.getElementById('entry-input-stage');
  if (!stageEl || !expenseInputStageState_.active) return;
  const step = normalizeExpenseStageStep_(expenseInputStageState_.step);
  const value = expenseInputStageState_.tempData && expenseInputStageState_.tempData[step]
    ? String(expenseInputStageState_.tempData[step])
    : '';
  const listAttr = step === 'name' ? ' list="expense-items"' : '';
  const inputmode = (step === 'date' || step === 'amount') ? 'numeric' : 'text';
  const pattern = (step === 'date' || step === 'amount') ? '\\d*' : '';
  stageEl.innerHTML = `
    <div class="entry-input-stage-panel" role="group" aria-label="${uiEscapeHtml_(getExpenseStageLabel_(step))}">
      <button type="button" class="entry-input-stage-close" aria-label="閉じる" onclick="closeExpenseInputStage_()">×</button>
      <label class="entry-input-stage-label" for="expense-input-stage-field">${uiEscapeHtml_(getExpenseStageLabel_(step))}</label>
      <div class="entry-input-stage-input-wrap">
        <input id="expense-input-stage-field" class="inline-input entry-input-stage-input" type="text" inputmode="${inputmode}" pattern="${pattern}"${listAttr} value="${uiEscapeHtml_(value)}" placeholder="${uiEscapeHtml_(getExpenseStagePlaceholder_(step))}" oninput="onExpenseInputStageInput(this.value)" onkeydown="onExpenseInputStageKeydown(event)">
      </div>
      <div class="entry-input-stage-actions">
        <button type="button" class="btn-sub" onclick="onExpenseInputStageBack()">戻る</button>
        <button type="button" class="btn-main" onclick="onExpenseInputStageAction()">${uiEscapeHtml_(getExpenseStageActionLabel_(step))}</button>
      </div>
    </div>
  `;
  stageEl.style.display = 'flex';
  stageEl.classList.add('is-open');
  document.body.classList.add('entry-stage-active');
  window.setTimeout(function() {
    const inputEl = document.getElementById('expense-input-stage-field');
    if (!inputEl) return;
    try { inputEl.focus({ preventScroll: true }); } catch (err) { inputEl.focus(); }
  }, 0);
}

function openExpenseRowInputStage(idx, step, triggerEl) {
  if (idx < 0 || idx >= expenseRows.length) return;
  const row = expenseRows[idx] || createEmptyExpenseRow();
  expenseInputStageState_.active = true;
  expenseInputStageState_.rowIdx = idx;
  expenseInputStageState_.step = normalizeExpenseStageStep_(step);
  expenseInputStageState_.tempData = {
    date: String(row.date || ''),
    name: String(row.name || ''),
    amount: String(row.amount || ''),
    memo: String(row.memo || '')
  };
  renderExpenseInputStage_();
}

function createEmptyExpenseRow() {
  return {
    date: '',
    name: '',
    amount: '',
    memo: ''
  };
}

function toNumber(v) {
  const n = Number(v);
  return Number.isFinite(n) ? n : 0;
}

function roundYen(v) {
  return Math.round(toNumber(v));
}

function formatDateValue(v) {
  let s = String(v || '').replace(/[^0-9]/g, '');
  if (s.length > 8) s = s.slice(0, 8);
  if (s.length === 8) {
    return s.replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3');
  }
  return s;
}

function cacheExpenseField(idx, key, value) {
  const row = expenseRows[idx];
  if (!row) return;
  row[key] = String(value || '');
}

function onExpenseDateBlur(idx, value) {
  const row = expenseRows[idx];
  if (!row) return;
  row.date = formatDateValue(value);
  renderExpenseRows();
  renderExpenseSummary();
}

function onExpenseAmountBlur(idx, value) {
  const row = expenseRows[idx];
  if (!row) return;
  row.amount = Math.max(0, roundYen(value));
  renderExpenseRows();
  renderExpenseSummary();
}

function addExpenseRow(afterIdx) {
  const pos = Math.max(0, Math.min(afterIdx + 1, expenseRows.length));
  expenseRows.splice(pos, 0, createEmptyExpenseRow());
  renderExpenseRows();
  renderExpenseSummary();
}

function removeExpenseRow(idx) {
  if (expenseRows.length <= 1) {
    expenseRows[0] = createEmptyExpenseRow();
  } else {
    expenseRows.splice(idx, 1);
  }
  renderExpenseRows();
  renderExpenseSummary();
}

function loadExpenseItems() {
  google.script.run
    .withSuccessHandler(function(list) {
      expenseCandidates = Array.isArray(list) ? list : [];
      const dl = document.getElementById('expense-items');
      dl.innerHTML = expenseCandidates.map(function(item) {
        return '<option value="' + uiEscapeHtml_(item) + '"></option>';
      }).join('');
      renderExpenseRows();
      renderExpenseSummary();
    })
    .withFailureHandler(showError)
    .getExpenseItems();
}

function getActiveExpenseRows() {
  const active = [];
  for (let i = 0; i < expenseRows.length; i++) {
    const row = expenseRows[i];
    const hasInput = !!String(row.date || '').trim() || !!String(row.name || '').trim() || roundYen(row.amount) > 0 || !!String(row.memo || '').trim();
    if (!hasInput) continue;

    const date = formatDateValue(row.date);
    const name = String(row.name || '').trim();
    const amount = Math.max(0, roundYen(row.amount));
    const memo = String(row.memo || '').trim();

    if (!date || !name || !amount) {
      throw new Error('明細' + (i + 1) + ' の日付・内容・金額は必須です');
    }
    active.push({ date: date, name: name, amount: amount, memo: memo });
  }
  if (!active.length) {
    throw new Error('経費明細が空です');
  }
  return active;
}

function renderExpenseRows() {
  const canDeleteRows = expenseRows.length > 1;
  const addButtonHtml = `<button type="button" class="btn-append-row" onclick="addExpenseRow(${Math.max(0, expenseRows.length - 1)})" aria-label="経費行を追加">＋</button>`;
  const titleActionsHtml = `<div class="entry-lines-title-actions">${addButtonHtml}</div>`;
  let rowsHtml = '';
  expenseRows.forEach(function(row, idx) {
    const canRemoveRow = canDeleteRows && idx > 0;
    const removeBtn = canRemoveRow
      ? `<button type="button" class="entry-row-remove" onclick="removeExpenseRow(${idx})" aria-label="経費${idx + 1}を削除">−</button>`
      : '';
    rowsHtml += '' +
      '<tr class="entry-main-row" data-expense-row-index="' + idx + '">' +
        '<td class="col-no">' + (idx + 1) + '</td>' +
        '<td class="col-num"><input type="text" class="inline-number entry-stage-trigger" maxlength="10" inputmode="numeric" placeholder="YYYYMMDD" value="' + uiEscapeHtml_(row.date || '') + '" readonly onfocus="this.blur(); openExpenseRowInputStage(' + idx + ', \'date\', this)" onclick="openExpenseRowInputStage(' + idx + ', \'date\', this)"></td>' +
        '<td class="col-item"><input type="text" class="inline-input entry-stage-trigger" list="expense-items" autocomplete="off" value="' + uiEscapeHtml_(row.name || '') + '" readonly onfocus="this.blur(); openExpenseRowInputStage(' + idx + ', \'name\', this)" onclick="openExpenseRowInputStage(' + idx + ', \'name\', this)"></td>' +
        '<td class="col-num"><input type="text" class="inline-number entry-stage-trigger" inputmode="numeric" pattern="\\d*" value="' + uiEscapeHtml_(row.amount || '') + '" readonly onfocus="this.blur(); openExpenseRowInputStage(' + idx + ', \'amount\', this)" onclick="openExpenseRowInputStage(' + idx + ', \'amount\', this)"></td>' +
        '<td class="col-item"><input type="text" class="inline-input entry-stage-trigger" value="' + uiEscapeHtml_(row.memo || '') + '" readonly onfocus="this.blur(); openExpenseRowInputStage(' + idx + ', \'memo\', this)" onclick="openExpenseRowInputStage(' + idx + ', \'memo\', this)"></td>' +
        '<td class="col-action">' + removeBtn + '</td>' +
      '</tr>';
  });

  document.getElementById('expense-table-area').innerHTML = '' +
    '<div class="entry-lines-title-row">' +
      '<h2 class="mid-title">経費</h2>' +
      titleActionsHtml +
    '</div>' +
    '<div class="entry-line-card section-card section-tone-expense">' +
      '<table class="entry-inline-table entry-expense-table">' +
        '<tr><th class="col-no">No</th><th class="col-num">日付</th><th class="col-item">内容</th><th class="col-num">金額</th><th class="col-item">メモ</th><th class="col-action"></th></tr>' +
        rowsHtml +
      '</table>' +
    '</div>';
}

function renderExpenseSummary() {
  let count = 0;
  let total = 0;
  expenseRows.forEach(function(row) {
    const hasActive = !!String(row.name || '').trim() && roundYen(row.amount) > 0;
    if (!hasActive) return;
    count += 1;
    total += roundYen(row.amount);
  });
  const summaryEl = document.getElementById('expense-summary-area');
  if (!summaryEl) return;
  summaryEl.innerHTML = '' +
    '<h2 class="mid-title">集計</h2>' +
    '<div class="entry-line-card section-card section-tone-summary">' +
      '<table class="entry-inline-table entry-summary-table">' +
        '<tr><th>明細数</th><th>経費合計</th></tr>' +
        '<tr class="entry-main-row summary-value-row"><td class="count-cell">' + count + '</td><td class="is-emphasis">' + total + '</td></tr>' +
      '</table>' +
    '</div>';
}

function registerExpenseRows() {
  let payload = [];
  const status = document.getElementById('exp-status');
  try {
    payload = getActiveExpenseRows();
  } catch (e) {
    showError(e);
    return;
  }

  status.textContent = '登録中...';
  google.script.run
    .withSuccessHandler(function(res) {
      const msg = (res && res.message) ? res.message : '経費を登録しました';
      status.textContent = msg;
      expenseRows = [createEmptyExpenseRow()];
      renderExpenseRows();
      loadExpenseItems();
    })
    .withFailureHandler(function(err) {
      status.textContent = '';
      showError(err);
    })
    .registerExpensesBatch(payload);
}

function showError(err) {
  const msg = err && err.message ? err.message : String(err);
  alert('エラー: ' + msg);
}
  </script>
</body>
</html>
