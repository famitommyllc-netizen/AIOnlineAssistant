<body class="entry-app-layout entry-b-layout">
  <div id="entry-app-shell" class="entry-app-shell">

  <script>
function uiEscapeHtml_(value) {
  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function uiBuildOpButtons_(idx, opts) {
  var o = opts || {};
  if (!o.show) {
    return '<div class="inline-value">固定</div>';
  }

  var addLabel = uiEscapeHtml_(o.addLabel || '＋行追加');
  var removeLabel = uiEscapeHtml_(o.removeLabel || '−削除');
  var addFn = String(o.onAdd || '');
  var removeFn = String(o.onRemove || '');

  var addBtn = addFn
    ? '<button type="button" class="btn-main" onclick="' + addFn + '(' + idx + ')">' + addLabel + '</button>'
    : '';
  var removeBtn = removeFn
    ? '<button type="button" class="btn-sub" onclick="' + removeFn + '(' + idx + ')">' + removeLabel + '</button>'
    : '';

  return '<div class="inline-actions">' + addBtn + removeBtn + '</div>';
}

function uiBuildInputTable_(config) {
  var c = config || {};
  var title = c.title ? '<div class="entry-line-title">' + uiEscapeHtml_(c.title) + '</div>' : '';
  var columns = Array.isArray(c.columns) ? c.columns : [];
  var includeOps = c.includeOps !== false;
  var bodyHtml = String(c.bodyHtml || '');
  var note = c.note ? '<div class="note-text" style="margin-top:0.45em;">' + uiEscapeHtml_(c.note) + '</div>' : '';

  var header = '<th class="col-no">No</th>';
  for (var i = 0; i < columns.length; i++) {
    var col = columns[i] || {};
    var cls = col.className ? ' ' + uiEscapeHtml_(col.className) : '';
    header += '<th class="' + cls.trim() + '">' + uiEscapeHtml_(col.label || '') + '</th>';
  }
  if (includeOps) {
    header += '<th class="col-action">操作</th>';
  }

  return '' +
    '<div class="entry-line-card unified-entry-card">' +
      title +
      '<div class="inline-scroll">' +
        '<table class="entry-inline-table unified-input-table">' +
          '<tr>' + header + '</tr>' +
          bodyHtml +
        '</table>' +
      '</div>' +
      note +
    '</div>';
}
  </script>
<script>
let salesRows = [];
let salesCandidates = [];
let salesPlaceCandidates = [];
let salesCandidateKeyMap = {};
let pendingSalesPayload = null;
const SALES_FORM_REV_ = 'rev-20260412-01';
const SALES_STAGE_STEPS_ = {
  row: ['item', 'amount', 'place'],
  common: ['date', 'place']
};
let salesInputStageState_ = {
  active: false,
  scope: 'row',
  rowIdx: -1,
  step: 'item',
  tempData: null
};
const SALES_DISPLAY_SETTINGS_STORAGE_KEY_ = 'entryDisplaySettings.v1';
const SALES_DISPLAY_SETTINGS_DEFAULTS_ = {
  h1FontPx: 22, h2FontPx: 28, thFontPx: 36, valueFontPx: 48, dropdownFontPx: 28, helperFontPx: 30,
  headerFontPx: 24, footerFontPx: 36, noteFontPx: 22, buttonFontPx: 48, borderWidth: 2, fontWeight: 500,
  productColItemPct: 50, productColPricePct: 20, productColQtyPct: 10, productColCostPct: 20, commonColPct: 33
};

window.onload = function() {
  applySalesRevisionTag_();
  initializeSalesPageShell_();
  salesRows = [createEmptySalesRow()];
  renderSalesRows();
  renderSalesCommonInfo();
  renderSalesSummary();
  loadSalesCandidates();
  loadSalesPlaceOptions();
};

function applySalesRevisionTag_() {
  const fileEl = document.getElementById('entry-fixed-header-file');
  if (!fileEl) return;
  fileEl.textContent = 'SalesForm.html ' + SALES_FORM_REV_;
}

function clampDisplaySetting_(value, min, max, fallback) {
  const n = Number(value);
  if (!Number.isFinite(n)) return fallback;
  return Math.max(min, Math.min(max, Math.round(n)));
}

function normalizeDisplaySettings_(input) {
  const src = input || {};
  return {
    h1FontPx: clampDisplaySetting_(src.h1FontPx, 12, 96, SALES_DISPLAY_SETTINGS_DEFAULTS_.h1FontPx),
    h2FontPx: clampDisplaySetting_(src.h2FontPx, 12, 96, SALES_DISPLAY_SETTINGS_DEFAULTS_.h2FontPx),
    thFontPx: clampDisplaySetting_(src.thFontPx, 10, 96, SALES_DISPLAY_SETTINGS_DEFAULTS_.thFontPx),
    valueFontPx: clampDisplaySetting_(src.valueFontPx, 10, 96, SALES_DISPLAY_SETTINGS_DEFAULTS_.valueFontPx),
    dropdownFontPx: clampDisplaySetting_(src.dropdownFontPx, 10, 96, SALES_DISPLAY_SETTINGS_DEFAULTS_.dropdownFontPx),
    helperFontPx: clampDisplaySetting_(src.helperFontPx, 10, 96, SALES_DISPLAY_SETTINGS_DEFAULTS_.helperFontPx),
    headerFontPx: clampDisplaySetting_(src.headerFontPx, 10, 96, SALES_DISPLAY_SETTINGS_DEFAULTS_.headerFontPx),
    footerFontPx: clampDisplaySetting_(src.footerFontPx, 10, 96, SALES_DISPLAY_SETTINGS_DEFAULTS_.footerFontPx),
    noteFontPx: clampDisplaySetting_(src.noteFontPx, 10, 96, SALES_DISPLAY_SETTINGS_DEFAULTS_.noteFontPx),
    buttonFontPx: clampDisplaySetting_(src.buttonFontPx, 10, 96, SALES_DISPLAY_SETTINGS_DEFAULTS_.buttonFontPx),
    borderWidth: clampDisplaySetting_(src.borderWidth, 1, 8, SALES_DISPLAY_SETTINGS_DEFAULTS_.borderWidth),
    fontWeight: clampDisplaySetting_(src.fontWeight, 400, 700, SALES_DISPLAY_SETTINGS_DEFAULTS_.fontWeight),
    productColItemPct: clampDisplaySetting_(src.productColItemPct, 40, 70, SALES_DISPLAY_SETTINGS_DEFAULTS_.productColItemPct),
    productColPricePct: clampDisplaySetting_(src.productColPricePct, 10, 30, SALES_DISPLAY_SETTINGS_DEFAULTS_.productColPricePct),
    productColQtyPct: clampDisplaySetting_(src.productColQtyPct, 8, 20, SALES_DISPLAY_SETTINGS_DEFAULTS_.productColQtyPct),
    productColCostPct: clampDisplaySetting_(src.productColCostPct, 10, 30, SALES_DISPLAY_SETTINGS_DEFAULTS_.productColCostPct),
    commonColPct: clampDisplaySetting_(src.commonColPct, 30, 34, SALES_DISPLAY_SETTINGS_DEFAULTS_.commonColPct)
  };
}

function applyDisplaySettingsFromStorage_() {
  let settings = SALES_DISPLAY_SETTINGS_DEFAULTS_;
  try {
    const raw = window.localStorage.getItem(SALES_DISPLAY_SETTINGS_STORAGE_KEY_);
    if (raw) settings = Object.assign({}, settings, JSON.parse(raw));
  } catch (err) {}
  const s = normalizeDisplaySettings_(settings);
  const root = document.documentElement;
  root.style.setProperty('--entry-ui-border-width', s.borderWidth + 'px');
  root.style.setProperty('--entry-ui-font-weight', String(s.fontWeight));
  root.style.setProperty('--entry-ui-h1-font-px', s.h1FontPx + 'px');
  root.style.setProperty('--entry-ui-title-font-px', s.h2FontPx + 'px');
  root.style.setProperty('--entry-ui-summary-header-font-px', s.thFontPx + 'px');
  root.style.setProperty('--entry-ui-value-font-px', s.valueFontPx + 'px');
  root.style.setProperty('--entry-ui-helper-font-px', s.helperFontPx + 'px');
  root.style.setProperty('--entry-ui-note-font-px', s.noteFontPx + 'px');
  root.style.setProperty('--entry-ui-button-font-px', s.buttonFontPx + 'px');
  root.style.setProperty('--entry-ui-header-font-px', s.headerFontPx + 'px');
  root.style.setProperty('--entry-ui-footer-font-px', s.footerFontPx + 'px');
  root.style.setProperty('--entry-ui-dropdown-font-px', s.dropdownFontPx + 'px');
}

function initializeSalesPageShell_() {
  applyDisplaySettingsFromStorage_();
  setSalesScreenState_('entry');
}

function setSalesScreenState_(screen) {
  const stateEl = document.getElementById('entry-fixed-header-state');
  if (!stateEl) return;
  const map = { entry: '入力', confirm: '確認', result: '完了' };
  stateEl.textContent = map[String(screen || 'entry')] || '入力';
}

function getQueryParam_(name) {
  try {
    const url = new URL(window.location.href);
    return String(url.searchParams.get(name) || '').trim();
  } catch (err) {
    return '';
  }
}

function buildWebAppPageUrl_(page, params) {
  try {
    const url = new URL(window.location.href);
    url.searchParams.set('page', String(page || 'home'));
    const p = params || {};
    Object.keys(p).forEach(function(key) {
      const value = p[key];
      if (value === undefined || value === null || String(value).trim() === '') {
        url.searchParams.delete(key);
        return;
      }
      url.searchParams.set(key, String(value));
    });
    return url.toString();
  } catch (err2) {
    return '';
  }
}

function navigateToWebAppPage_(page, params) {
  const url = buildWebAppPageUrl_(page, params || {});
  if (!url) return;
  window.location.href = url;
}

function handleFooterHomeClick() {
  navigateToWebAppPage_('home', {});
}

function handleFooterDisplaySettingsClick() {
  navigateToWebAppPage_('entry', { openDisplaySettings: '1', returnPage: 'sales' });
}

function handleFooterPlaceholderClick() {
  // 売上入力では未使用
}

function normalizeSalesStageScope_(scope) {
  const s = String(scope || '').trim();
  return (s === 'common') ? 'common' : 'row';
}

function normalizeSalesStageStep_(scope, step) {
  const targetScope = normalizeSalesStageScope_(scope);
  const steps = SALES_STAGE_STEPS_[targetScope] || SALES_STAGE_STEPS_.row;
  const s = String(step || '').trim();
  return steps.indexOf(s) >= 0 ? s : steps[0];
}

function getSalesStageLabel_(scope, step) {
  if (scope === 'common') {
    return step === 'date' ? '売上日' : '販売場所';
  }
  if (step === 'amount') return '売上金額';
  if (step === 'place') return '販売場所';
  return '商品';
}

function getSalesStageActionLabel_(scope, step) {
  if (scope === 'common') {
    return step === 'date' ? '次へ' : '確定';
  }
  return step === 'place' ? '確定' : '次へ';
}

function getSalesStagePlaceholder_(scope, step) {
  if (scope === 'common') {
    return step === 'date' ? 'YYYYMMDD' : '販売場所を入力';
  }
  if (step === 'amount') return '売上金額を入力';
  if (step === 'place') return '販売場所を入力';
  return '商品個別番号 / 商品名 / 商品番号 / JAN';
}

function closeSalesInputStage_() {
  salesInputStageState_.active = false;
  salesInputStageState_.scope = 'row';
  salesInputStageState_.rowIdx = -1;
  salesInputStageState_.step = 'item';
  salesInputStageState_.tempData = null;
  document.body.classList.remove('entry-stage-active');
  const stageEl = document.getElementById('entry-input-stage');
  if (!stageEl) return;
  stageEl.classList.remove('is-open');
  stageEl.style.display = 'none';
  stageEl.innerHTML = '';
}

function onSalesInputStageInput(value) {
  if (!salesInputStageState_.active) return;
  const scope = normalizeSalesStageScope_(salesInputStageState_.scope);
  const step = normalizeSalesStageStep_(scope, salesInputStageState_.step);
  if (!salesInputStageState_.tempData) salesInputStageState_.tempData = {};
  salesInputStageState_.tempData[step] = String(value || '');
}

function commitSalesInputStageStep_() {
  if (!salesInputStageState_.active) return;
  const scope = normalizeSalesStageScope_(salesInputStageState_.scope);
  const step = normalizeSalesStageStep_(scope, salesInputStageState_.step);
  const inputEl = document.getElementById('sales-input-stage-field');
  const value = String((inputEl && inputEl.value) || '');
  onSalesInputStageInput(value);
  if (scope === 'common') {
    if (step === 'date') {
      const dateEl = document.getElementById('sales-date');
      const dateDisplayEl = document.getElementById('sales-date-display');
      if (dateEl) dateEl.value = normalizeDateDigits_(value);
      if (dateDisplayEl) dateDisplayEl.value = normalizeDateDigits_(value);
      return;
    }
    const placeEl = document.getElementById('sales-place');
    if (placeEl) placeEl.value = String(value || '').trim();
    return;
  }
  const idx = salesInputStageState_.rowIdx;
  if (idx < 0 || idx >= salesRows.length) return;
  if (step === 'item') {
    onSalesItemInput(idx, value);
    return;
  }
  if (step === 'amount') {
    onSalesAmountInput(idx, value);
    return;
  }
  onSalesPlaceInput(idx, value);
  renderSalesRows();
}

function onSalesInputStageAction() {
  if (!salesInputStageState_.active) return;
  const scope = normalizeSalesStageScope_(salesInputStageState_.scope);
  const step = normalizeSalesStageStep_(scope, salesInputStageState_.step);
  commitSalesInputStageStep_();
  const steps = SALES_STAGE_STEPS_[scope] || SALES_STAGE_STEPS_.row;
  const currentIndex = steps.indexOf(step);
  if (currentIndex >= 0 && currentIndex < steps.length - 1) {
    salesInputStageState_.step = steps[currentIndex + 1];
    renderSalesInputStage_();
    return;
  }
  closeSalesInputStage_();
}

function onSalesInputStageBack() {
  if (!salesInputStageState_.active) return;
  const scope = normalizeSalesStageScope_(salesInputStageState_.scope);
  const step = normalizeSalesStageStep_(scope, salesInputStageState_.step);
  const steps = SALES_STAGE_STEPS_[scope] || SALES_STAGE_STEPS_.row;
  const currentIndex = steps.indexOf(step);
  if (currentIndex > 0) {
    salesInputStageState_.step = steps[currentIndex - 1];
    renderSalesInputStage_();
    return;
  }
  closeSalesInputStage_();
}

function onSalesInputStageKeydown(event) {
  if (!event || event.key !== 'Enter') return;
  event.preventDefault();
  onSalesInputStageAction();
}

function renderSalesInputStage_() {
  const stageEl = document.getElementById('entry-input-stage');
  if (!stageEl || !salesInputStageState_.active) return;
  const scope = normalizeSalesStageScope_(salesInputStageState_.scope);
  const step = normalizeSalesStageStep_(scope, salesInputStageState_.step);
  const label = getSalesStageLabel_(scope, step);
  const actionLabel = getSalesStageActionLabel_(scope, step);
  const placeholder = getSalesStagePlaceholder_(scope, step);
  const value = salesInputStageState_.tempData && salesInputStageState_.tempData[step]
    ? String(salesInputStageState_.tempData[step])
    : '';
  const listAttr = (scope === 'row' && step === 'item')
    ? ' list="sales-item-options"'
    : ((step === 'place') ? ' list="sales-place-options"' : '');
  stageEl.innerHTML = `
    <div class="entry-input-stage-panel" role="group" aria-label="${escapeHtml(label)}">
      <button type="button" class="entry-input-stage-close" aria-label="閉じる" onclick="closeSalesInputStage_()">×</button>
      <label class="entry-input-stage-label" for="sales-input-stage-field">${escapeHtml(label)}</label>
      <div class="entry-input-stage-input-wrap">
        <input id="sales-input-stage-field" class="inline-input entry-input-stage-input" type="text" inputmode="${(step === 'amount' || step === 'date') ? 'numeric' : 'text'}" pattern="${(step === 'amount' || step === 'date') ? '\\d*' : ''}"${listAttr} value="${escapeHtml(value)}" placeholder="${escapeHtml(placeholder)}" oninput="onSalesInputStageInput(this.value)" onkeydown="onSalesInputStageKeydown(event)">
      </div>
      <div class="entry-input-stage-actions">
        <button type="button" class="btn-sub" onclick="onSalesInputStageBack()">戻る</button>
        <button type="button" class="btn-main" onclick="onSalesInputStageAction()">${escapeHtml(actionLabel)}</button>
      </div>
    </div>
  `;
  stageEl.style.display = 'flex';
  stageEl.classList.add('is-open');
  document.body.classList.add('entry-stage-active');
  window.setTimeout(function() {
    const inputEl = document.getElementById('sales-input-stage-field');
    if (!inputEl) return;
    try { inputEl.focus({ preventScroll: true }); } catch (err) { inputEl.focus(); }
  }, 0);
}

function openSalesRowInputStage(rowIdx, step, triggerEl) {
  if (rowIdx < 0 || rowIdx >= salesRows.length) return;
  const row = salesRows[rowIdx];
  salesInputStageState_.active = true;
  salesInputStageState_.scope = 'row';
  salesInputStageState_.rowIdx = rowIdx;
  salesInputStageState_.step = normalizeSalesStageStep_('row', step);
  salesInputStageState_.tempData = {
    item: String(row.itemInput || ''),
    amount: String(row.salesAmount || ''),
    place: String(row.place || '')
  };
  renderSalesInputStage_();
}

function openSalesCommonInputStage(step, triggerEl) {
  const dateEl = document.getElementById('sales-date');
  const placeEl = document.getElementById('sales-place');
  salesInputStageState_.active = true;
  salesInputStageState_.scope = 'common';
  salesInputStageState_.rowIdx = -1;
  salesInputStageState_.step = normalizeSalesStageStep_('common', step);
  salesInputStageState_.tempData = {
    date: String((dateEl && dateEl.value) || ''),
    place: String((placeEl && placeEl.value) || '')
  };
  renderSalesInputStage_();
}

function createEmptySalesRow() {
  return {
    itemInput: '',
    inventoryId: '',
    productNo: '',
    name: '',
    cost: 0,
    salesAmount: '',
    profit: 0,
    place: ''
  };
}

function toNumber(v) {
  const n = Number(v);
  return Number.isFinite(n) ? n : 0;
}

function roundYen(v) {
  return Math.round(toNumber(v));
}

function escapeHtml(value) {
  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function normalizeText(value) {
  return String(value || '').trim().toLowerCase();
}

function toCandidateTokens(item) {
  const values = [
    item && item.label,
    item && item.inventoryId,
    item && item.name,
    item && item.productNo,
    item && item.jan
  ];
  const seen = {};
  const out = [];
  values.forEach(v => {
    const token = String(v || '').trim();
    if (!token || seen[token]) return;
    seen[token] = true;
    out.push(token);
  });
  return out;
}

function buildSalesItemOptions(filterText) {
  const dl = document.getElementById('sales-item-options');
  if (!dl) return;

  const q = normalizeText(filterText);
  const uniqueOptions = {};
  const options = [];
  salesCandidateKeyMap = {};

  salesCandidates.forEach(item => {
    const searchable = [
      item && item.label,
      item && item.inventoryId,
      item && item.name,
      item && item.productNo,
      item && item.jan
    ].map(normalizeText).join(' ');

    if (q && searchable.indexOf(q) === -1) return;

    toCandidateTokens(item).forEach(token => {
      const key = normalizeText(token);
      if (!salesCandidateKeyMap[key]) salesCandidateKeyMap[key] = [];
      salesCandidateKeyMap[key].push(item);
      if (uniqueOptions[token]) return;
      uniqueOptions[token] = true;
      options.push(`<option value="${escapeHtml(token)}"></option>`);
    });
  });

  dl.innerHTML = options.join('');
}

function loadSalesCandidates() {
  google.script.run
    .withSuccessHandler(function(list) {
      salesCandidates = Array.isArray(list) ? list : [];
      buildSalesItemOptions('');
      renderSalesRows();
    })
    .withFailureHandler(showError)
    .getSalesInventoryCandidates();
}

function loadSalesPlaceOptions() {
  google.script.run
    .withSuccessHandler(function(list) {
      salesPlaceCandidates = Array.isArray(list) ? list : [];
      const dl = document.getElementById('sales-place-options');
      if (dl) {
        dl.innerHTML = salesPlaceCandidates.map(v => `<option value="${escapeHtml(v)}"></option>`).join('');
      }
      const sel = document.getElementById('sales-place-candidate');
      if (sel) {
        if (!salesPlaceCandidates.length) {
          sel.innerHTML = '<option value="">候補なし</option>';
        } else {
          sel.innerHTML = salesPlaceCandidates.map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join('');
        }
      }
    })
    .withFailureHandler(showError)
    .getSalesPlaceList();
}

function resolveSalesCandidateByInput(input) {
  const text = String(input || '').trim();
  if (!text) return null;
  const key = normalizeText(text);

  if (salesCandidateKeyMap[key] && salesCandidateKeyMap[key].length === 1) {
    return salesCandidateKeyMap[key][0];
  }

  const exact = salesCandidates.filter(item => {
    return (
      normalizeText(item && item.label) === key ||
      normalizeText(item && item.inventoryId) === key ||
      normalizeText(item && item.name) === key ||
      normalizeText(item && item.productNo) === key ||
      normalizeText(item && item.jan) === key
    );
  });
  if (exact.length === 1) {
    return exact[0];
  }

  const contains = salesCandidates.filter(item => {
    const searchable = [
      item && item.label,
      item && item.inventoryId,
      item && item.name,
      item && item.productNo,
      item && item.jan
    ].map(normalizeText).join(' ');
    return searchable.indexOf(key) !== -1;
  });
  if (contains.length === 1) {
    return contains[0];
  }

  return null;
}

function onSalesItemInput(idx, value) {
  const row = salesRows[idx];
  if (!row) return;

  row.itemInput = String(value || '').trim();
  const matched = resolveSalesCandidateByInput(row.itemInput);
  if (!matched) {
    row.inventoryId = '';
    row.productNo = '';
    row.name = '';
    row.cost = 0;
    row.salesAmount = '';
    row.profit = 0;
    renderSalesRows();
    renderSalesSummary();
    return;
  }

  row.inventoryId = String(matched.inventoryId || '').trim();
  row.productNo = String(matched.productNo || '').trim();
  row.name = String(matched.name || '').trim();
  row.cost = roundYen(matched.cost || 0);
  if (!roundYen(row.salesAmount)) {
    const assumed = roundYen(matched.assumedSales || 0);
    row.salesAmount = assumed > 0 ? assumed : row.cost;
  }
  row.profit = roundYen(row.salesAmount) - row.cost;
  renderSalesRows();
  renderSalesSummary();
}

function cacheSalesItemInput(idx, value) {
  const row = salesRows[idx];
  if (!row) return;
  row.itemInput = String(value || '');
  buildSalesItemOptions(row.itemInput);
}

function onSalesAmountInput(idx, value) {
  const row = salesRows[idx];
  if (!row) return;
  row.salesAmount = Math.max(0, roundYen(value));
  row.profit = roundYen(row.salesAmount) - roundYen(row.cost);
  renderSalesRows();
  renderSalesSummary();
}

function cacheSalesAmountInput(idx, value) {
  const row = salesRows[idx];
  if (!row) return;
  row.salesAmount = String(value || '');
}

function onSalesPlaceInput(idx, value) {
  const row = salesRows[idx];
  if (!row) return;
  row.place = String(value || '').trim();
}

function addSalesRow(afterIdx) {
  const pos = Math.max(0, Math.min(afterIdx + 1, salesRows.length));
  salesRows.splice(pos, 0, createEmptySalesRow());
  renderSalesRows();
}

function removeSalesRow(idx) {
  if (salesRows.length <= 1) {
    salesRows[0] = createEmptySalesRow();
  } else {
    salesRows.splice(idx, 1);
  }
  renderSalesRows();
  renderSalesSummary();
}

function renderSalesRows() {
  const canDeleteRows = salesRows.length > 1;
  const addButtonHtml = `<button type="button" class="btn-append-row" onclick="addSalesRow(${Math.max(0, salesRows.length - 1)})" aria-label="売上行を追加">＋</button>`;
  const titleActionsHtml = `<div class="entry-lines-title-actions">${addButtonHtml}</div>`;
  let rowsHtml = '';
  salesRows.forEach((row, idx) => {
    const canRemoveRow = canDeleteRows && idx > 0;
    const removeBtn = canRemoveRow
      ? `<button type="button" class="entry-row-remove" onclick="removeSalesRow(${idx})" aria-label="売上${idx + 1}を削除">−</button>`
      : '';
    rowsHtml += `
      <tr class="entry-main-row" data-sales-row-index="${idx}">
        <td class="col-no">${idx + 1}</td>
        <td class="col-item">
          <input type="text" class="inline-input entry-stage-trigger" list="sales-item-options" value="${escapeHtml(row.itemInput || '')}" readonly onfocus="this.blur(); openSalesRowInputStage(${idx}, 'item', this)" onclick="openSalesRowInputStage(${idx}, 'item', this)" placeholder="商品個別番号 / 商品名 / 商品番号 / JAN">
        </td>
        <td class="col-num">
          <input type="text" class="inline-number entry-stage-trigger" inputmode="numeric" pattern="\\d*" value="${row.salesAmount || ''}" readonly onfocus="this.blur(); openSalesRowInputStage(${idx}, 'amount', this)" onclick="openSalesRowInputStage(${idx}, 'amount', this)">
        </td>
        <td class="col-num"><div class="inline-value">${row.cost || 0}</div></td>
        <td class="col-num"><div class="inline-value">${row.profit || 0}</div></td>
        <td class="col-action">${removeBtn}</td>
      </tr>
      <tr class="entry-meta-row">
        <td colspan="6">
          <div class="entry-meta-grid entry-meta-grid-normal">
            <div class="entry-meta-item">
              <div class="entry-meta-label">商品個別番号</div>
              <span class="entry-meta-value">${escapeHtml(row.inventoryId || '') || '未選択'}</span>
            </div>
            <div class="entry-meta-item">
              <div class="entry-meta-label">商品マスタ番号</div>
              <span class="entry-meta-value">${escapeHtml(row.productNo || '') || '-'}</span>
            </div>
            <div class="entry-meta-item">
              <div class="entry-meta-label">販売場所</div>
              <input type="text" class="inline-input entry-meta-input entry-stage-trigger" list="sales-place-options" value="${escapeHtml(row.place || '')}" readonly onfocus="this.blur(); openSalesRowInputStage(${idx}, 'place', this)" onclick="openSalesRowInputStage(${idx}, 'place', this)" placeholder="空欄なら共通販売場所">
            </div>
          </div>
        </td>
      </tr>
    `;
  });

  document.getElementById('sales-lines').innerHTML = `
    <div class="entry-lines-title-row">
      <h2 class="mid-title">売上明細</h2>
      ${titleActionsHtml}
    </div>
    <div class="entry-line-card section-card section-tone-product">
      <table class="entry-inline-table entry-product-table">
          <tr>
            <th class="col-no">No</th>
            <th class="col-item">商品</th>
            <th class="col-num">売上金額</th>
            <th class="col-num">原価</th>
            <th class="col-num">利益</th>
            <th class="col-action"></th>
          </tr>
          ${rowsHtml}
      </table>
    </div>
  `;
}

function renderSalesCommonInfo() {
  const currentDate = String((document.getElementById('sales-date') && document.getElementById('sales-date').value) || '').trim();
  const currentPlace = String((document.getElementById('sales-place') && document.getElementById('sales-place').value) || '').trim();
  document.getElementById('sales-common-info').innerHTML =
    '<datalist id="sales-place-options"></datalist>' +
    '<div class="entry-line-card section-card section-tone-common">' +
      '<table class="entry-inline-table entry-common-table">' +
        '<tr><th>売上日</th><th>販売場所</th></tr>' +
        '<tr class="entry-main-row">' +
          '<td>' +
            '<input type="hidden" id="sales-date">' +
            '<input type="text" id="sales-date-display" class="inline-input entry-stage-trigger common-stage-trigger" inputmode="numeric" pattern="\\d*" value="" readonly onfocus="this.blur(); openSalesCommonInputStage(\'date\', this)" onclick="openSalesCommonInputStage(\'date\', this)" placeholder="YYYYMMDD">' +
          '</td>' +
          '<td><input type="text" id="sales-place" class="inline-input entry-stage-trigger common-stage-trigger" list="sales-place-options" placeholder="販売場所を入力" readonly onfocus="this.blur(); openSalesCommonInputStage(\'place\', this)" onclick="openSalesCommonInputStage(\'place\', this)"></td>' +
        '</tr>' +
      '</table>' +
    '</div>';
  const dateEl = document.getElementById('sales-date');
  const dateDisplayEl = document.getElementById('sales-date-display');
  const placeEl = document.getElementById('sales-place');
  if (dateEl) dateEl.value = normalizeDateDigits_(currentDate);
  if (dateDisplayEl) dateDisplayEl.value = normalizeDateDigits_(currentDate);
  if (placeEl) placeEl.value = currentPlace;
}

function addSalesPlaceCandidate() {
  const value = String(document.getElementById('sales-place-add').value || '').trim();
  if (!value) {
    alert('追加する販売場所を入力してください');
    return;
  }
  const status = document.getElementById('sales-place-status');
  status.textContent = '追加中...';
  google.script.run
    .withSuccessHandler(function() {
      status.textContent = '追加しました';
      document.getElementById('sales-place-add').value = '';
      loadSalesPlaceOptions();
      setTimeout(function() { status.textContent = ''; }, 1000);
    })
    .withFailureHandler(function(err) {
      status.textContent = '';
      showError(err);
    })
    .addMasterCandidate('sales_place', value);
}

function removeSalesPlaceCandidate() {
  const value = String(document.getElementById('sales-place-candidate').value || '').trim();
  if (!value || value === '候補なし') {
    alert('削除する販売場所候補を選択してください');
    return;
  }
  if (!confirm(`候補「${value}」を削除します。よろしいですか？`)) return;

  const status = document.getElementById('sales-place-status');
  status.textContent = '削除中...';
  google.script.run
    .withSuccessHandler(function() {
      status.textContent = '削除しました';
      loadSalesPlaceOptions();
      setTimeout(function() { status.textContent = ''; }, 1000);
    })
    .withFailureHandler(function(err) {
      status.textContent = '';
      showError(err);
    })
    .removeMasterCandidate('sales_place', value);
}

function formatDateInput(el) {
  if (!el) return;
  el.value = normalizeDateDigits_(el.value);
}

function normalizeDateDigits_(value) {
  let v = String(value || '').replace(/[^0-9]/g, '');
  if (v.length > 8) v = v.slice(0, 8);
  return v;
}

function digitsToIsoDate_(value) {
  const v = normalizeDateDigits_(value);
  if (v.length !== 8) return '';
  return v.replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3');
}

function isoDateToDigits_(value) {
  return normalizeDateDigits_(value);
}

function onDateTextInput(targetId, pickerId, value) {
  const target = document.getElementById(targetId);
  if (!target) return;
  target.value = normalizeDateDigits_(value);
  syncDatePickerFromText_(targetId, pickerId);
}

function syncDatePickerFromText_(targetId, pickerId) {
  const target = document.getElementById(targetId);
  const picker = document.getElementById(pickerId);
  if (!target || !picker) return;
  picker.value = digitsToIsoDate_(target.value);
}

function openDatePickerFromText(targetId, pickerId) {
  const picker = document.getElementById(pickerId);
  if (!picker) return;
  syncDatePickerFromText_(targetId, pickerId);
  let opened = false;
  try {
    picker.focus({ preventScroll: true });
  } catch (err) {
    try {
      picker.focus();
    } catch (err2) {
      // no-op
    }
  }
  if (typeof picker.showPicker === 'function') {
    try {
      picker.showPicker();
      opened = true;
      return;
    } catch (err3) {
      // showPicker非対応/制限時はclickにフォールバック
    }
  }
  try {
    picker.click();
    opened = true;
  } catch (err4) {
    // no-op
  }
  if (!opened) {
    alert('カレンダーを開けませんでした。日付欄（YYYY-MM-DD）を直接タップして選択してください。');
  }
}

function onDatePickerChange(targetId, pickerId) {
  const target = document.getElementById(targetId);
  const picker = document.getElementById(pickerId);
  if (!target || !picker) return;
  target.value = isoDateToDigits_(picker.value);
}

function getActiveSalesRows() {
  const out = [];
  for (let i = 0; i < salesRows.length; i++) {
    const row = salesRows[i];
    const hasInput = !!String(row.itemInput || '').trim() || roundYen(row.salesAmount) > 0;
    if (!hasInput) continue;

    if (!String(row.inventoryId || '').trim()) {
      throw new Error(`明細${i + 1} の商品を候補から選択してください`);
    }
    if (roundYen(row.salesAmount) <= 0) {
      throw new Error(`明細${i + 1} の売上金額を入力してください`);
    }
    out.push(row);
  }
  if (!out.length) {
    throw new Error('売上明細が空です');
  }
  return out;
}

function renderSalesSummary() {
  let count = 0;
  let totalSales = 0;
  let totalCost = 0;
  let totalProfit = 0;

  salesRows.forEach(row => {
    if (!String(row.inventoryId || '').trim()) return;
    count += 1;
    totalSales += roundYen(row.salesAmount);
    totalCost += roundYen(row.cost);
    totalProfit += roundYen(row.profit);
  });

  document.getElementById('sales-summary').innerHTML = `
    <h2 class="mid-title">集計</h2>
    <div class="entry-line-card section-card section-tone-summary">
      <table class="entry-inline-table entry-summary-table">
        <tr>
          <th>明細数</th>
          <th>売上合計</th>
          <th>原価合計</th>
          <th>利益合計</th>
        </tr>
        <tr class="entry-main-row summary-value-row">
          <td class="count-cell">${count}</td>
          <td>${totalSales}</td>
          <td>${totalCost}</td>
          <td class="is-emphasis">${totalProfit}</td>
        </tr>
      </table>
    </div>
  `;
}

function showSalesFinalConfirm() {
  try {
    const date = normalizeDateDigits_(String((document.getElementById('sales-date') && document.getElementById('sales-date').value) || '').trim());
    const place = String(document.getElementById('sales-place').value || '').trim();
    if (!date) {
      alert('売上日を入力してください');
      return;
    }

    const activeRows = getActiveSalesRows();
    const payloadEntries = activeRows.map(row => ([
      String(row.inventoryId || '').trim(),
      roundYen(row.salesAmount),
      String(row.place || '').trim()
    ]));

    pendingSalesPayload = {
      entries: payloadEntries,
      commonInfo: {
        date: date,
        place: place
      }
    };

    let bodyRows = '';
    activeRows.forEach((row, idx) => {
      const usePlace = String(row.place || '').trim() || place;
      bodyRows += `<tr>
        <td>${idx + 1}</td>
        <td>${escapeHtml(row.inventoryId || '')}</td>
        <td>${escapeHtml(row.productNo || '')}</td>
        <td>${escapeHtml(row.name || '')}</td>
        <td>${roundYen(row.salesAmount)}</td>
        <td>${roundYen(row.cost)}</td>
        <td>${roundYen(row.profit)}</td>
        <td>${escapeHtml(usePlace || '')}</td>
      </tr>`;
    });

    const totalSales = activeRows.reduce((sum, row) => sum + roundYen(row.salesAmount), 0);
    const totalCost = activeRows.reduce((sum, row) => sum + roundYen(row.cost), 0);
    const totalProfit = activeRows.reduce((sum, row) => sum + roundYen(row.profit), 0);

    document.getElementById('sales-confirm-area').innerHTML = `
      <div class="confirm-block section-card section-tone-common">
        <div class="confirm-title">共通情報</div>
        <div class="summary-table-wrap">
          <table class="summary-table summary-meta-table">
            <thead><tr><th>売上日</th><th>共通販売場所</th></tr></thead>
            <tbody><tr class="summary-text-row"><td>${escapeHtml(date)}</td><td>${escapeHtml(place || '(明細ごと指定)')}</td></tr></tbody>
          </table>
        </div>
      </div>

      <div class="confirm-block section-card section-tone-product">
        <div class="confirm-title">売上明細</div>
        <div class="table-wrap">
          <table>
            <tr><th>No</th><th>商品個別番号</th><th>商品マスタ番号</th><th>商品名</th><th>売上金額</th><th>原価</th><th>利益</th><th>販売場所</th></tr>
            ${bodyRows}
          </table>
        </div>
      </div>

      <div class="confirm-block section-card section-tone-summary">
        <div class="confirm-title">集計</div>
        <div class="summary-table-wrap">
          <table class="summary-table confirm-summary-table">
            <thead><tr><th>明細数</th><th>売上合計</th><th>原価合計</th><th>利益合計</th></tr></thead>
            <tbody><tr class="summary-value-row">
              <td class="count-cell">${activeRows.length}</td>
              <td>${totalSales}</td>
              <td>${totalCost}</td>
              <td class="is-emphasis">${totalProfit}</td>
            </tr></tbody>
          </table>
        </div>
      </div>
    `;

    document.getElementById('sales-entry-page').style.display = 'none';
    document.getElementById('sales-confirm-page').style.display = 'block';
    setSalesScreenState_('confirm');
    window.scrollTo(0, 0);
  } catch (err) {
    showError(err);
  }
}

function hideSalesFinalConfirm() {
  document.getElementById('sales-confirm-page').style.display = 'none';
  document.getElementById('sales-entry-page').style.display = 'block';
  setSalesScreenState_('entry');
  window.scrollTo(0, 0);
}

function submitSalesEntries() {
  if (!pendingSalesPayload) {
    alert('最終確認を先に実行してください');
    return;
  }

  const btn = document.getElementById('sales-submit-btn');
  const status = document.getElementById('sales-submit-status');
  btn.disabled = true;
  status.textContent = '登録中...';

  google.script.run
    .withSuccessHandler(function(res) {
      const result = (typeof res === 'string') ? { message: res } : (res || {});
      document.getElementById('sales-final-result').innerHTML = `
        <div class="result-success">${escapeHtml(result.message || '売上登録が完了しました')}</div>
      `;

      salesRows = [createEmptySalesRow()];
      pendingSalesPayload = null;
      renderSalesRows();
      renderSalesSummary();
      renderSalesCommonInfo();
      loadSalesCandidates();
      loadSalesPlaceOptions();
      hideSalesFinalConfirm();
      setSalesScreenState_('result');

      btn.disabled = false;
      status.textContent = '';
    })
    .withFailureHandler(function(err) {
      btn.disabled = false;
      status.textContent = '';
      showError(err);
    })
    .registerSalesEntries(pendingSalesPayload.entries, pendingSalesPayload.commonInfo);
}

function showError(err) {
  const msg = err && err.message ? err.message : String(err);
  alert('エラー: ' + msg);
}
</script>
