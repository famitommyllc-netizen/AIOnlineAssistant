  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>タスク管理</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <nav class="top-nav">
      <a href="/" class="nav-link">チャット</a>
      <a href="/tasks.html" class="nav-link active">タスク</a>
      <a href="/memos.html" class="nav-link">メモ一覧</a>
      <a href="/number-tool.html" class="nav-link">数値集計</a>
      <a href="/profit-tool.html" class="nav-link">利益計算</a>

      <a href="/notify.html" class="nav-link">通知設定</a>
    </nav>
    <button class="nav-toggle" type="button" aria-label="メニュー" aria-expanded="false">MENU</button>
    <button id="closeToChatBtn" class="close-to-chat" type="button" aria-label="チャットへ戻る">×</button>

    <main class="settings-layout">
      <section class="card">
        <div class="title-row">
          <img id="pageIcon" class="page-icon" src="/assets/icons/tasks.svg" alt="" />
          <h1>タスク管理</h1>
        </div>
        <p class="sub">チャットで作成したタスクを確認・編集・完了できます。</p>
        <div class="row">
          <select id="sortKey">
            <option value="status">ステータス順</option>
            <option value="due">期限順</option>
            <option value="assignee">担当者順</option>
          </select>
          <select id="sortOrder">
            <option value="asc">昇順</option>
            <option value="desc">降順</option>
          </select>
        </div>
        <ul id="taskList" class="task-list"></ul>
      </section>
    </main>

    <script src="/nav.js"></script>
    <script src="/app-feedback.js?v=20260308feedback01"></script>
