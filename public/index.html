<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatbot Prototype</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="chat-page">
    <header class="chat-header">
      <button class="nav-toggle" type="button" aria-label="メニュー" aria-expanded="false">MENU</button>
      <div class="chat-header-main">
        <img id="pageIcon" class="page-icon" src="/assets/icons/chat.svg" alt="" />
        <div>
          <h1>秘書チャット（叩き台）</h1>
          <p class="sub">AI未接続のルールベース応答。曖昧表現を整形して保存します。</p>
        </div>
      </div>
      <nav class="top-nav">
        <a href="/" class="nav-link active">チャット</a>
        <a href="/apps/tasks/public/tasks.html" class="nav-link">タスク</a>
        <a href="/apps/memos/public/memos.html" class="nav-link">メモ一覧</a>
        <a href="/apps/number-tool/public/number-tool.html" class="nav-link">数値集計</a>
        <a href="/apps/profit/public/profit-tool.html" class="nav-link">利益計算</a>
        <a href="/apps/profit/public/profit-settings.html" class="nav-link">利益設定</a>
        <a href="/help.html" class="nav-link">使い方</a>
        <a href="/icon-settings.html" class="nav-link">アイコン設定</a>
        <a href="/settings.html" class="nav-link">設定</a>
        <a href="/notify.html" class="nav-link">通知設定</a>
      </nav>
    </header>

    <main class="chat-main">
      <div id="chatLog" class="chat-log-full"></div>
    </main>

    <div id="modeControl" class="mode-control chat-mode-control" style="display: none">
      <span id="modeLabel" class="mode-label"></span>
      <button id="exitModeBtn" type="button" class="secondary">モード終了</button>
      <button id="modeFeatureBtn" type="button" class="secondary" style="display: none"></button>
    </div>

    <footer class="chat-footer">
      <form id="chatForm" class="row chat-input-row chat-input-dock">
        <input id="chatInput" type="text" placeholder="メッセージを入力" required />
        <button type="submit">送信</button>
      </form>
    </footer>

    <script src="/nav.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
