<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>端末通知設定</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <nav class="top-nav">
      <a href="/" class="nav-link">チャット</a>
      <a href="/apps/tasks/public/tasks.html" class="nav-link">タスク</a>
      <a href="/apps/number-tool/public/number-tool.html" class="nav-link">数値集計</a>
      <a href="/apps/profit/public/profit-tool.html" class="nav-link">利益計算</a>
      <a href="/help.html" class="nav-link">使い方</a>
      <a href="/settings.html" class="nav-link">設定</a>
      <a href="/notify.html" class="nav-link active">通知設定</a>
    </nav>
    <button class="nav-toggle" type="button" aria-label="メニュー" aria-expanded="false">MENU</button>
    <button id="closeToChatBtn" class="close-to-chat" type="button" aria-label="チャットへ戻る">×</button>

    <main class="settings-layout">
      <section class="card">
        <div class="title-row">
          <img class="page-icon" src="/assets/icons/settings.svg" alt="" />
          <h1>端末通知設定</h1>
        </div>
        <p class="sub">チャット画面には表示せず、こちらで端末通知の許可を管理します。</p>
        <div class="notify-control">
          <span id="notifyStatus" class="notify-status">端末通知: 判定中</span>
          <button id="notifyPermissionBtn" type="button" class="secondary">通知を有効化</button>
        </div>
        <p class="status-text">補足: iPhoneではSafariでホーム画面に追加すると安定しやすくなります。</p>
      </section>
    </main>

    <script src="/nav.js"></script>
    <script src="/notify.js"></script>
  </body>
