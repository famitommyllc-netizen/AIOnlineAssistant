<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>アイコン設定</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <nav class="top-nav">
      <a href="/" class="nav-link">チャット</a>
      <a href="/apps/tasks/public/tasks.html" class="nav-link">タスク</a>
      <a href="/apps/memos/public/memos.html" class="nav-link">メモ一覧</a>
      <a href="/apps/number-tool/public/number-tool.html" class="nav-link">数値集計</a>
      <a href="/apps/profit/public/profit-tool.html" class="nav-link">利益計算</a>
      <a href="/apps/profit/public/profit-settings.html" class="nav-link">利益設定</a>
      <a href="/help.html" class="nav-link">使い方</a>
      <a href="/icon-settings.html" class="nav-link active">アイコン設定</a>
      <a href="/settings.html" class="nav-link">設定</a>
      <a href="/notify.html" class="nav-link">通知設定</a>
    </nav>
    <button class="nav-toggle" type="button" aria-label="メニュー" aria-expanded="false">MENU</button>
    <button id="closeToChatBtn" class="close-to-chat" type="button" aria-label="チャットへ戻る">×</button>

    <main class="settings-layout">
      <section class="card">
        <div class="title-row">
          <img id="pageIcon" class="page-icon" src="/assets/icons/icon-settings.svg" alt="" />
          <h1>アイコン設定</h1>
        </div>
        <p class="sub">各画面のアイコンURLを設定できます。後から自作画像URLへ変更可能です。</p>

        <form id="iconForm" class="settings-form">
          <label class="field-row"><span>チャット</span><input id="icon_chat" type="text" /></label>
          <label class="field-row"><span>タスク</span><input id="icon_tasks" type="text" /></label>
          <label class="field-row"><span>メモ一覧</span><input id="icon_memos" type="text" /></label>
          <label class="field-row"><span>数値集計</span><input id="icon_number" type="text" /></label>
          <label class="field-row"><span>利益計算</span><input id="icon_profit" type="text" /></label>
          <label class="field-row"><span>利益設定</span><input id="icon_profitSettings" type="text" /></label>
          <label class="field-row"><span>使い方</span><input id="icon_help" type="text" /></label>
          <label class="field-row"><span>設定</span><input id="icon_settings" type="text" /></label>
          <label class="field-row"><span>アイコン設定</span><input id="icon_iconSettings" type="text" /></label>
          <div class="row">
            <button type="submit">保存</button>
          </div>
        </form>

        <p id="saveStatus" class="status-text">未保存</p>
      </section>
    </main>

    <script src="/nav.js"></script>
    <script src="/icon-settings.js"></script>
  </body>
</html>
